<script id="wiki-data" type="application/json">{"version": "course-wiki-v2", "date": "2026-11-22", "ingested": 7, "total": 7, "pages": [{"path": "wiki/cases/engineering-measurement.md", "title": "案例：水下鋼管追蹤與太陽能板變形", "body": "# 案例：水下鋼管追蹤與太陽能板變形\n\n## 背景與輸入\n課堂以曾文水庫象鼻鋼管縮尺模型追蹤動態，並以雙相機量測太陽能板形變。兩例分別展示剛體姿態與三維點位移，不混成同一量測目標。[S05 pp.29–48]\n\n## 方法與流程\n**水下鋼管**：建立物體三維標點模型 → 分別考慮空氣／水下率定 → 由影像標點解姿態，或以多相機交會連續三維點 → 比較動態曲線。多相機路線要求同步；單相機姿態路線需已知剛體模型。[S05 pp.29–38]\n\n**太陽能板**：已率定且固定相對關係的雙相機 → 同步拍攝 → 偵測 Australis 標 → 前方交會 → 必要的相機晃動／影像套合修正 → 相對參考時刻計算位移 → 內插變形場。[S05 pp.39–47]\n\n## 教材參數與結果\n太陽能板範圍約 6.8×8.4 m、5×5 panels；雙相機各約 24 MP、基線 6.5 m、拍攝高度約 11 m，逐秒座標量測。教材示意修正前後差異，不包含可重跑的完整原始時序。[S05 pp.40–47]\n\n## 補充公式與限制\n$$\n\\Delta\\mathbf X_i(t)=\\mathbf X_i(t)-\\mathbf X_i(t_0).\n$$\n位移需在相同物方座標比較；不能把未補償的相機移動算成板體形變。水下還涉及介質折射與率定適用環境，不能將空氣中的結果直接視為水下有效。[S05 pp.33,37–38,43；位移式為補充]\n\n## 缺漏與常見誤解\n本次沒有相機同步紀錄、控制點、原始影像與量測真值，不宣稱本 Wiki 重現工程精度或可供安全判定。曲線平滑不等於誤差一定小，仍需檢核。[S05 pp.37–47；補充界線]\n\n## 來源與相關頁\n[來源](../sources.md) · [交會](../concepts/orientation-adjustment.md) · [旋轉](../concepts/spatial-rotation.md)\n"}, {"path": "wiki/cases/geographic-registration.md", "title": "案例：空拍影像與衛星影像地理對位", "body": "# 案例：空拍影像與衛星影像地理對位\n\n## 背景與輸入\n用 UAV 照片與參考正射影像匹配，將參考像點轉成已知平面地理位置，再取 DSM 高程形成三維控制點，反算 UAV 位置及姿態。需共同坐標基準、相機內參、正射影像地理定位與高程資料。[S06 pp.34–41]\n\n## 方法與操作流程\n近似定位／裁切參考區 → 處理尺度差 → 匹配與幾何驗證 → 由參考像點取得 XYZ → 後方交會 → 以參考真值比較位置與角度。DSM 指含地表物體的表面模型，不應與裸地模型混稱；真實正射的遮蔽處理亦依資料方法而定。[S06 pp.35–40；補充術語界線]\n\n## 教材參數與計算\n4096×3000 pixel、像元 3.45 μm、f＝6 mm、H＝100 m，GSD＝$100\\times0.00345/6=0.0575$ m/pixel＝5.75 cm/pixel。p.59 列 UAV 約 585×428、衛星 486×486，LightGlue 門檻 0.1；這是該案例參數，不作通用推薦。[S06 pp.41,59]\n\n## 原始計數與案例判讀\np.59 列合格 384、不合格 472、未解算 868，並將已解算集合稱 856。384＋472＝856 可核對，但總母體與圖上計數語意未完整交代，故不直接報整體成功率；I06-03 保留此限制。[S06 p.59]\n\n城鎮案例的 Z 誤差列 7.66、7.79、8.66、7.65 m；這支持該列有同向高程偏差，不能推成所有定位都同樣偏移。山區、農地與河流另有失敗列；河流場景變化與紋理差造成較多錯配。[S06 pp.60–68]\n\n## 限制與缺漏\n教材說「有匹配點就能反算」須補上點數、非退化幾何、座標基準及正確性條件。未取得原始資料、DSM 基準及真值表，不能重現完整誤差或解釋高程偏差的唯一原因。[S06 pp.36,59–68；補充檢查]\n\n## 來源與相關頁\n[來源](../sources.md) · [學習式匹配](../concepts/learned-matching.md) · [第 05 章](../chapters/05-collinearity.md) · [疑點](../issues.md)\n"}, {"path": "wiki/cases/hw1-camera.md", "title": "案例：HW1 取像參數與相機選擇", "body": "# 案例：HW1 取像參數與相機選擇\n\n## 背景與輸入\n課堂要求操作工業相機與 SpinView，記錄相機／鏡頭組合、攝影幾何、不同曝光及內插結果，說明適用場景。[S01 p.104]\n\n## 方法與操作流程\n查感測器實體尺寸、像元與鏡頭焦距 → 指定拍攝距離 → 算 FOV／GSD → 調整快門／曝光／白平衡／Gamma → 固定其他條件拍比較組 → 觀察細節、動態模糊與雜訊 → 說明選擇理由。[S01 pp.30–42,61–65,104]\n\n## 算例與結果解讀\n使用教材 500 m、20 mm、4 μm 的條件，GSD 為 10 cm/pixel。若自建比較把距離改成 250 m，其餘不變，則為 5 cm/pixel；這是理想模型算例，不是實拍成果。可在[互動學習](../../labs/index.md)調參。[S01 p.64；後半為補充算例]\n\n## 應保存的參數與限制\n每組影像記錄型號、鏡頭、解析度、位深、通道格式、距離、曝光、Gain、Gamma 及照明。比較快門時固定照明與其他設定，避免把多項變動混成單一因果。介面標稱速度不是實際可持續寫入速度。[S01 pp.80–87,104；補充流程]\n\n## 缺漏\n本次未取得 HW1 原始拍攝檔、實際相機設定與量測真值，因此只整理教材任務，不報實測銳利度或建議購買型號。\n\n## 來源與相關頁\n[來源](../sources.md) · [GSD 推導](../concepts/sensor-geometry.md) · [曝光與位深](../concepts/sensing-quality.md)\n"}, {"path": "wiki/cases/hw2-calibration.md", "title": "案例：HW2 相機率定與再率定", "body": "# 案例：HW2 相機率定與再率定\n\n## 教材案例背景\nHW2 要求使用 Australis（Demo）與 Metashape，以工業相機拍攝人造標場域，做自率、影像修正，再將修正影像匯回 Australis 重新率定並比較。[S02 p.44]\n\n## 輸入與方法\n| 項目 | 教材提供 | 目前缺漏 |\n| --- | --- | --- |\n| 場域 | Australis 人造標 | 實際場域座標、已知尺度與標點表 |\n| 相機 | 工業相機、多角度環繞拍攝 | 型號、鏡頭、焦距／對焦與解析度設定 |\n| 軟體 | Australis Demo、Metashape | 軟體版本、模型選項及匯出格式 |\n| 觀測 | 拍攝影像、標點對應 | 原始影像、標點偵測與剔除紀錄 |\n| 成果 | 率定、修正、重新率定比較 | 實測參數、殘差與前後影像 |\n\n此表依教材任務整理，不代表已取得或執行實驗。[S02 pp.32–36,44]\n\n## 教材操作流程\n1. 佈置人造標場域，建立尺度／控制條件。\n2. 多角度拍攝並記錄相機設定。\n3. 在 Australis 與 Metashape 進行 self-calibration。\n4. 依所選模型與參數修正影像。\n5. 修正影像匯入 Australis 重新率定。\n6. 比較參數、變形與影像，說明操作過程。[S02 p.44]\n\n## 補充檢查：每一步保存什麼\n拍攝紀錄、有效影像清單、標點對應、參數及單位、修正方向、新影像尺寸／新 K、殘差定義、比較圖。不同軟體係數先核對定義再比較，不直接比較同名字母的數值。\n\n重新率定後畸變參數應如何變化，需根據修正模型與新影像座標判讀；不能預先填成「全部係數等於零」。這是檢查原則，不是本次實測發現。\n\n## 結果與限制\n**本次只完成教材流程整理，未進行 HW2 實拍、軟體率定或再率定。** 因缺少輸入影像與實驗紀錄，不產生虛構的精度表。外部工具操作仍須依使用者實際版本確認。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [率定方法](../concepts/calibration-methods.md) · [影像修正](../concepts/undistortion.md) · [疑點](../issues.md)\n"}, {"path": "wiki/cases/hw3-stitching.md", "title": "案例：HW3 拼接與模型比較", "body": "# 案例：HW3 拼接與模型比較\n\n## 背景與輸入\n用工業相機拍兩張錯位影像，修正畸變、找特徵對應，分別以 Affine 與 Perspective 模型拼接，畫誤差向量並比較誤差。[S03 p.25]\n\n## 方法與操作流程\n固定並記錄相機模型 → 修正鏡頭畸變 → 偵測／描述／匹配 → 幾何過濾 → 用同一批有效點估計兩模型 → 定義輸出畫布 → 反算及內插 → 比較重疊區與誤差向量。[S03 pp.18–25,31–54；流程補齊]\n\n## 應比較的結果\n| 欄位 | 記錄內容 |\n| --- | --- |\n| 有效對應 | 數量、分布、幾何模型與過濾門檻 |\n| 殘差 | 每點二維 RMSE 或自由度校正尺度，寫出分母 |\n| 系統偏差 | 中心／四周向量是否呈規律 |\n| 視覺結果 | 接縫、重影、孔洞、裁切及內插方式 |\n\n**補充判讀**：對相同資料，參數較多的模型可能有較低擬合誤差；仍須保留檢核點或觀察未參與估計的區域，不能直接宣稱透視一定比較好。[S03 pp.24–25,34；補充驗收]\n\n## 限制與缺漏\n未取得本次實拍資料、匹配點與真值，故不填虛構實測表。第 03 章的拼接圖是教材案例，不是本 Wiki 新完成的實驗。[S03 pp.20–25]\n\n## 來源與相關頁\n[來源](../sources.md) · [平面模型](../concepts/planar-transforms.md) · [誤差定義](../concepts/least-squares.md) · [內插](../concepts/interpolation.md)\n"}, {"path": "wiki/cases/hw4-stereo.md", "title": "案例：HW4 核影像、視差圖與點雲", "body": "# 案例：HW4 核影像、視差圖與點雲\n\n## 背景與輸入\n課堂要求用具有視差的教室或空拍照片，求 E／R／T、建立核影像、使用 SGBM 估視差，再交會成三維點雲。需相機模型、有效對應，以及若要公尺單位則必須有尺度來源。[S07 pp.48,54]\n\n## 方法與操作流程\n檢查取像與內參 → 去畸變與特徵匹配 → 幾何估計 F／E → SVD 候選／前方深度選解 → 核影像糾正 → 檢查 y 視差 → SGBM → 視差單位與有效遮罩 → 三角交會／點雲 → 分析遮蔽與誤差。[S07 pp.17–39,48,51–54；流程補齊]\n\n## 應保存的結果\n| 產物 | 檢查 |\n| --- | --- |\n| F／E／R／T | 對應來源、rank、旋轉正交性與 det、平移尺度 |\n| 核影像 | 同名點的垂直殘差、裁切與新內參 |\n| 視差圖 | 搜尋範圍、儲存倍率、無效區及左右一致性 |\n| 點雲 | 單位、座標系、負深度／離群值與真值比較 |\n\n## 限制與缺漏\n未取得實際照片、相機率定與基線，故不報新實驗點雲或精度。教材提及 ToF／Kinect 是另一種感測路線，硬體世代未指定時不把所有 Kinect 都視為同一測距原理。[S07 pp.46–49,54；補充界線]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動雙目深度](../../labs/index.md) · [E 分解](../concepts/essential-decomposition.md) · [立體匹配](../concepts/stereo-matching.md)\n"}, {"path": "wiki/cases/multi-camera-stitch.md", "title": "案例：多相機陣列拼接與多光譜套合", "body": "# 案例：多相機陣列拼接與多光譜套合\n\n## 背景與輸入\n教材以多光譜套合比較 AT／PT／EPT；另以三相機陣列在保持取樣細節時增加視野。所需資料包括各相機率定、重疊區、對應點及轉換模型。[S06 pp.5–33]\n\n## 方法與操作流程\n每鏡頭率定 → 處理相近取樣尺度 → 在重疊區匹配 → 排除錯配 → 估平面模型／附加項 → 反算重採樣 → 檢查接縫、誤差向量與獨立檢核點。[S06 pp.24–33；流程補齊]\n\n## 教材算例與結果\n相機像元 4.5 μm、焦距 35 mm、距離 500 m，依針孔 GSD 為 $500\\times0.0045/35\\approx0.06429$ m/pixel，約 6.43 cm；教材 p.31 約寫 6 cm。單台 FOV 約 56°×38°，拼接示意約 100°×55°，是該組案例，不是任何三台都會得到相同視野。[S06 pp.31–32；計算補齊]\n\n## 限制與缺漏\n未取得各相機外參、同步資料、原始影像及拼接程式，不能獨立重現 130 MP 或誤差圖。相機中心不同時會有深度視差，應檢查平面映射適用區，不將接縫改善當絕對三維精度。[S06 pp.27–33；補充限制]\n\n## 來源與相關頁\n[來源](../sources.md) · [GSD](../concepts/sensor-geometry.md) · [異質套合](../concepts/multispectral-registration.md)\n"}, {"path": "wiki/cases/principal-point.md", "title": "案例：主點偏移的 PM／CV 換算", "body": "# 案例：主點偏移的 PM／CV 換算\n\n## 背景與輸入\n教材給定影像 4096×3000 pixel、中心 (2048,1500)、像元尺寸 5 μm；主點右偏 4.3 pixel、上偏 1.3 pixel。[S02 p.17]\n\n## 方法與逐步計算\n先換單位：$5\\,\\mu\\mathrm m=0.005\\,\\mathrm{mm}$。\nPM 以中心為原點、向上為正：\n$$\nx_p=4.3\\times0.005=0.0215\\ \\mathrm{mm},\\qquad\ny_p=1.3\\times0.005=0.0065\\ \\mathrm{mm}.\n$$\nCV 以左上為原點、向下為正：\n$$\nc_x=2048+4.3=2052.3,\\qquad c_y=1500-1.3=1498.7\\quad(\\mathrm{pixel}).\n$$\n結果與教材相符；本頁只是重新計算教材算例，不是新拍攝的率定數據。[S02 pp.12,17]\n\n## 操作流程與檢查\n確認軸向 → μm 轉 mm → 依中心偏移換算 → 反算回像素偏移。x、y 各自回到 4.3、1.3，作為數值 round-trip 檢查。[補充驗算]\n\n## 限制與缺漏\n教材未在此算例提供焦距或畸變係數，不能因此組成完整的實測 K 或進行影像修正。此例沿用教材 W/2、H/2 的中心慣例。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [座標系統](../concepts/coordinate-systems.md) · [相機內參](../concepts/intrinsics.md)\n"}, {"path": "wiki/cases/sfm-pipeline.md", "title": "案例：影像匹配如何進入 SfM", "body": "# 案例：影像匹配如何進入 SfM\n\n## 背景與輸入\n運動結構回復（Structure from Motion, SfM）從多張具重疊區的影像估相機姿態與三維點。教材展示由匹配到方位重建與稀疏點雲的流程。[S04 pp.51–52]\n\n## 方法與操作流程\n拍攝重疊影像 → 偵測與描述 → 比率測試 → 幾何驗證 → 建立相機間關係 → 三角交會 → 光束法平差。內參可固定或在適當約束下同估，不是任何資料都能無先驗穩定求解。[S04 p.51；S05 pp.58–60；補充界線]\n\n## 成果應如何分析\n記錄影像數、有效匹配、內點、相機連接性、可重建點、殘差定義與尺度來源。稀疏點雲不是稠密表面；MVS 使用已估相機關係進行更密集的匹配。[S01 p.4；S04 pp.51–52]\n\n## 限制與缺漏\n沒有這次拍攝資料與相機／控制點，不能報告本 Wiki 的相機姿態或絕對精度。教材示例只支持方法理解，未提供可完全重跑的原始資料集。[S04 pp.51–52]\n\n## 來源與相關頁\n[來源](../sources.md) · [描述子](../concepts/feature-matching.md) · [RANSAC](../concepts/robust-estimation.md) · [第 05 章](../chapters/05-collinearity.md)\n"}, {"path": "wiki/chapters/01-sensors.md", "title": "第 01 章：影像感測器", "body": "# 第 01 章：影像感測器\n\n狀態：**已匯入，保留待查項**。S01 共 104 張，逐頁去向見 coverage.json。\n\n## 複習路線\n| 投影片 | 問題 | 知識頁 |\n| --- | --- | --- |\n| pp.2–28 | 成像、感測方式與四種解析度如何區分？ | [成像品質](../concepts/sensing-quality.md) |\n| pp.29–59 | 曝光、快門、色彩、畸變與亮度缺陷如何影響資料？ | [成像品質](../concepts/sensing-quality.md)、[鏡頭](../concepts/camera-optics.md) |\n| pp.60–65 | 如何由距離、像元與焦距算 GSD／FOV？ | [幾何推導](../concepts/sensor-geometry.md) |\n| pp.66–92 | 感測器、CFA、傳輸與魚眼模型如何選讀？ | [品質](../concepts/sensing-quality.md)、[鏡頭](../concepts/camera-optics.md) |\n| pp.93–104 | 多光譜、熱紅外、全景及 HW1 如何串接？ | [鏡頭](../concepts/camera-optics.md)、[HW1](../cases/hw1-camera.md) |\n\n## 核心連結\n本章決定輸入影像的品質與取樣幾何；第 02 章求得量測所需內參；第 03 章及第 06 章處理多影像／多波段對位。[S01 pp.49–50,95,98,102]\n\n## 互動與檢查\n[開啟 GSD／視角互動](../../labs/index.md)。教材 2-bit 範例、傾斜 GSD 敘述、跨章切向公式與魚眼名稱差異，見[疑點台帳](../issues.md)。互動不使用尚未確認的傾斜公式。\n\n## 來源\n[來源索引](../sources.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/02-calibration.md", "title": "第 02 章：相機率定", "body": "# 第 02 章：相機率定\n\n狀態：**試做形式已由使用者確認，已納入完整 Wiki**。來源 S02，共 44 張投影片。\n\n相機率定（Camera Calibration）的用途，是估計相機成像幾何與畸變參數，使影像能用於後續幾何量測。[S02 pp.8,18,20–31]\n\n## 複習路線\n| 教材位置 | 要回答的問題 | 知識頁 |\n| --- | --- | --- |\n| pp.2–5 | PM 與 CV 的課程觀點有何差異？ | [座標與慣例](../concepts/coordinate-systems.md) |\n| pp.7–19 | 物點如何變成像素？負號與單位從哪裡來？ | [座標系統](../concepts/coordinate-systems.md)、[相機內參](../concepts/intrinsics.md) |\n| pp.20–27 | 徑向與切向畸變如何表示？係數能否直接通用？ | [鏡頭畸變](../concepts/distortion.md) |\n| pp.28–38 | 實驗室、自率、在任率定有何差異？ | [率定方法](../concepts/calibration-methods.md)、[棋盤格推導](../concepts/checkerboard.md) |\n| pp.39–43 | 參數變動及修正方向如何處理？ | [影像修正](../concepts/undistortion.md) |\n| p.44 | HW2 要做什麼、還缺哪些實驗資料？ | [HW2 案例](../cases/hw2-calibration.md) |\n\n## 本章必須分清楚的三件事\n1. 影像幾何中心、像主點與三維攝影中心不同。[S02 pp.9,12–18]\n2. PM 的 mm 與 CV 的 pixel／正規化座標，不可直接代入同一係數。[S02 pp.12–19,26]\n3. 求得參數、修正影像、重新率定是三項不同工作。[S02 pp.28–44]\n\n## 建議閱讀順序\n座標 → 內參 → [主點算例](../cases/principal-point.md) → 畸變 → 率定方法 → 棋盤格 → 影像修正 → HW2。\n\n## 互動理解\n[徑向畸變互動](../../labs/distortion.md)使用 E01 的生成畸變方向，與本章 PM 修正量分開；可觀察網格與係數的關係。\n\n## 本章待查事項\n第 25／31 頁切向公式的平方項係數、第 26／31／42 頁修正量方向、第 13 頁主點用語，以及第 37 頁精度比較，都保留在[疑點台帳](../issues.md)。未解項不作後續簡報定論。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [術語](../glossary.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/03-planar.md", "title": "第 03 章：平面影像轉換", "body": "# 第 03 章：平面影像轉換\n\n狀態：**已匯入，保留定義差異註記**。S03 共 54 張。\n\n## 複習路線\n| 投影片 | 重點 | 知識頁 |\n| --- | --- | --- |\n| pp.3–18 | 相似 4、仿射 6、透視 8 自由度及多項式 | [平面轉換](../concepts/planar-transforms.md) |\n| pp.19–25 | 穩定、套合、拼接及 HW3 | [HW3 案例](../cases/hw3-stitching.md) |\n| pp.26–34 | 設計矩陣、法方程式、殘差／自由度 | [最小二乘](../concepts/least-squares.md) |\n| pp.35–54 | 陣列索引、正反算、最鄰近／雙線性／雙三次 | [內插推導](../concepts/interpolation.md) |\n\n## 先修與應用\n先讀 [第 02 章](02-calibration.md) 的座標與畸變。估計轉換模型所需對應點，來自 [第 04 章](04-matching.md)；一般三維場景的幾何模型則看 [第 05 章](05-collinearity.md)。[S03 pp.18–25]\n\n## 互動與常見誤解\n[平面變換與雙線性內插互動](../../labs/index.md)。請區分座標軸旋轉與點旋轉、仿射與透視，以及課堂自由度校正殘差與每點 RMSE，詳見[疑點](../issues.md)。\n\n## 來源\n[來源索引](../sources.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/04-matching.md", "title": "第 04 章：影像匹配", "body": "# 第 04 章：影像匹配\n\n狀態：**已匯入**。S04 共 52 張；三個階段要分清楚：偵測 → 描述／配對 → 幾何驗證。\n\n## 複習路線\n| 投影片 | 問題 | 知識頁 |\n| --- | --- | --- |\n| pp.3–20 | 角點、FAST、DoG 各偵測什麼？ | [偵測與推導](../concepts/feature-detection.md) |\n| pp.21–32 | 邊緣如何變成線與線段？ | [Canny／Hough／LSD](../concepts/feature-detection.md) |\n| pp.33–48 | 區域與描述子如何找對應？ | [NCC 與比率測試](../concepts/feature-matching.md) |\n| pp.49–50 | 如何排除幾何不一致？ | [RANSAC](../concepts/robust-estimation.md) |\n| pp.51–52 | 匹配如何接到相機姿態與三維點？ | [SfM 案例](../cases/sfm-pipeline.md) |\n\n## 互動與跨章\n[比率測試／RANSAC 互動](../../labs/index.md)。第 03 章提供平面模型，第 06 章提供異質資料案例，第 07 章提供雙視圖幾何；對應點只是觀測，仍需正確模型。[S04 pp.3,50–51]\n\n## 來源與疑點\n[來源](../sources.md) · [I04-01 Canny 方向](../issues.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/05-collinearity.md", "title": "第 05 章：空間轉換與共線條件式", "body": "# 第 05 章：空間轉換與共線條件式\n\n狀態：**已匯入，旋轉符號與觀測數差異另列**。S05 共 61 張。\n\n## 複習路線\n| 投影片 | 問題 | 知識頁 |\n| --- | --- | --- |\n| pp.3–15 | 旋轉順序與 M／R 方向如何定義？ | [空間旋轉](../concepts/spatial-rotation.md) |\n| pp.16–24 | 物點、攝影中心與像點如何共線？ | [共線推導](../concepts/collinearity.md) |\n| pp.25–28 | 前方與後方交會差在哪裡？ | [交會與方位](../concepts/orientation-adjustment.md) |\n| pp.29–48 | 如何追蹤剛體／量測非剛性變形？ | [水下與太陽能案例](../cases/engineering-measurement.md) |\n| pp.49–54 | DLT 如何退化為平面轉換？ | [DLT 推導](../concepts/collinearity.md) |\n| pp.55–61 | 相對／絕對方位與光束法平差 | [方位與尺度](../concepts/orientation-adjustment.md) |\n\n## 互動與核心條件\n[旋轉與投影互動](../../labs/index.md)顯示轉換順序、矩陣與可見性。方程數足夠不代表幾何非退化或解唯一；影像觀測、內參、尺度與同步須一起看。\n\n## 來源與疑點\n[來源](../sources.md) · [I05-01～02](../issues.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/06-applications.md", "title": "第 06 章：影像匹配之應用", "body": "# 第 06 章：影像匹配之應用\n\n狀態：**已匯入，保留模型名稱與計數疑點**。S06 共 68 張。\n\n## 複習路線\n| 投影片 | 主題 | 知識頁 |\n| --- | --- | --- |\n| pp.3–15 | 異質波段與 N-SURF／CDF 門檻 | [多光譜套合](../concepts/multispectral-registration.md) |\n| pp.16–23 | MR／DR／CR、點數與時間 | [指標定義](../concepts/matching-metrics.md) |\n| pp.24–29 | AT／PT／EPT 與誤差向量 | [套合模型](../concepts/multispectral-registration.md) |\n| pp.30–33 | 多相機提高視野 | [陣列拼接案例](../cases/multi-camera-stitch.md) |\n| pp.34–42 | UAV 與衛星正射影像地理對位 | [定位案例](../cases/geographic-registration.md) |\n| pp.43–58 | SuperPoint／SuperGlue 架構 | [學習式匹配](../concepts/learned-matching.md) |\n| pp.59–68 | 解算計數與各場景誤差 | [案例與限制](../cases/geographic-registration.md) |\n\n## 複習重點與互動\n把「候選數量、正確率、像方殘差、物方位置誤差」分開看。[互動指標試算](../../labs/index.md)可改變計數，看分母如何影響比率；不能把該試算當新實驗。\n\n## 來源與疑點\n[來源](../sources.md) · [I06-01～03](../issues.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/07-epipolar.md", "title": "第 07 章：核幾何與立體視覺", "body": "# 第 07 章：核幾何與立體視覺\n\n狀態：**已匯入，保留模型與誤差條件註記**。S07 共 54 張。\n\n## 複習路線\n| 投影片 | 問題 | 知識頁 |\n| --- | --- | --- |\n| pp.3–8 | 極點、極線、極平面如何限制搜尋？ | [核幾何](../concepts/epipolar-geometry.md) |\n| pp.10–22 | 內外積、齊次座標如何得到 F？ | [F 推導](../concepts/epipolar-geometry.md) |\n| pp.24–32 | 如何由 E 求 R、t，為何尺度未知？ | [SVD 分解](../concepts/essential-decomposition.md) |\n| pp.34–39 | 糾正後如何由視差算深度及誤差？ | [深度推導](../concepts/stereo-depth.md) |\n| pp.40–49 | 光學測距、雙目系統與 ToF 案例 | [深度](../concepts/stereo-depth.md)、[HW4](../cases/hw4-stereo.md) |\n| pp.51–54 | SGM／SGBM 如何得到視差與點雲？ | [匹配代價](../concepts/stereo-matching.md)、[HW4](../cases/hw4-stereo.md) |\n\n## 互動與常見誤解\n[極線與雙目深度互動](../../labs/index.md)：先看「點映射到線」，再看校正平行系統的 Z＝Bf/d。F 不是影像到影像的 H；t 方向不等於已知公尺基線。\n\n## 來源與疑點\n[來源](../sources.md) · [I07-01～03](../issues.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/concepts/calibration-methods.md", "title": "率定方法與適用條件", "body": "# 率定方法與適用條件\n\n## 概念與教材分類\n| 方法 | 課堂做法 | 主要限制 | 來源 |\n| --- | --- | --- | --- |\n| 實驗室率定 Laboratory Calibration | 精密儀器／標定平台求幾何參數 | 更換鏡頭或設定後須重新評估 | S02 p.29 |\n| 自率光束法 Self-Calibration | 多影像與已知尺度／標點，於平差估計內參 | 依賴拍攝幾何與控制條件 | S02 pp.30–37 |\n| 在任率定 On-the-job Calibration | 實際任務影像中同時估計內參及場景 | 幾何配置差時可能不穩定或尺度不定 | S02 p.38 |\n\n本頁沿用老師對 self-calibration 的分類用語，不把它自動等同所有 CV 文獻中不使用已知標定物的 autocalibration。[S02 pp.30,35,38；用語界線]\n\n## 符號與共同求解觀點\n令 $\\theta$ 包含內參、畸變、各影像姿態及需要估計的物點；$\\mathbf z_{ij}$ 為影像 j 上第 i 點的觀測座標，$\\pi(\\theta,\\mathbf X_i)$ 為模型投影。\n$$\n\\min_\\theta\\sum_{i,j}\\left\\|\\mathbf z_{ij}-\\pi(\\theta,\\mathbf X_i)\\right\\|^2.\n$$\n**補充推導**：課堂 p.35 的「最小化重投影誤差」寫成平方和；教材未提供此頁完整目標式。若殘差單位是 pixel，目標單位為 pixel²。此式為等權最小二乘示意，不宣稱課堂軟體固定使用等權或無 robust loss。[S02 pp.30–35,38；E03 §3.2 補充]\n\n## 案例：Australis 與棋盤格\nAustralis 使用人造標點，透過多角度影像和平差估計參數；棋盤格則使用已知格長與角點建立平面物點到像點的對應。兩者都需要可靠觀測與足夠幾何條件。[S02 pp.32–36]\n\n教材提到 mm 級與像素級精度，但兩者是不同量測層次，不能直接比大小或當成方法保證。本次沒有校準影像或實測殘差，無法重現其精度。[S02 pp.32,37；I02-04]\n\n## 假設、適用條件與常見誤解\n同一組固定內參模型，隱含相機／鏡頭設定在該組影像中足夠穩定。教材 pp.39–40 顯示變焦設定與畸變曲線的關聯；圖中的精確數值未擷取，因此不提供數值擬合。[S02 pp.29,39–40]\n\n「跑出一組數字」不等於可靠率定。需要檢查來源影像、幾何分布、殘差及參數意義；不能用自建算例冒充相機實測。[S02 pp.35,37–38,44；補充驗收規則]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [棋盤格推導](checkerboard.md) · [HW2 流程](../cases/hw2-calibration.md) · [疑點](../issues.md)\n"}, {"path": "wiki/concepts/camera-optics.md", "title": "鏡頭、色彩與多波段成像", "body": "# 鏡頭、色彩與多波段成像\n\n## 概念與分類\n鏡頭畸變改變幾何位置；色差（Chromatic Aberration）與不同波長折射差異有關；漸暈（Vignetting）讓周邊亮度降低。幾何校正與亮度補償不能互相取代。[S01 pp.43–59]\n\n彩色相機常以 Bayer CFA（Color Filter Array）取樣，再以去馬賽克（Demosaicing）補出色彩；黑白相機省去此濾色陣列，仍須考慮其感測器光譜響應與濾鏡，不能解讀成對所有波長都能接收。[S01 pp.74–78；補充限制]\n\n## 符號、單位與公式\nr 為像點距投影中心的徑向長度（與 f 同單位），θ 為入射角（radian）。依教材各模型：\n| 模型 | 投影函數 | 使用界線 |\n| --- | --- | --- |\n| 直線透視 Rectilinear | $r=f\\tan\\theta$ | θ 趨近 90° 時發散 |\n| 等距 Equidistant | $r=f\\theta$ | 角度線性映射 |\n| 等固角 Equisolid angle | $r=2f\\sin(\\theta/2)$ | 不等於等距 |\n| 正射 Orthographic | $r=f\\sin\\theta$ | 不等同一般針孔 |\n| Stereographic | $r=2f\\tan(\\theta/2)$ | 教材中文名稱待確認，保留英文與式 |\n\n[S01 pp.89–92]\n\n**補充推導**：在 θ 接近 0 時，sinθ、tanθ 都近似 θ，因此各模型中央一階行為皆接近 r＝fθ；周邊才明顯分離。這不能讓其率定係數直接互用。\n\n## 多波段與案例\n多光譜、熱紅外常使用不同鏡頭／感測器，造成幾何錯位與灰階非線性差異；須套合才能在同一物點比較波段。課堂以多光譜相機、RGB／熱紅外混合相機及全景相機展示此問題。[S01 pp.93–102]\n\n教材 NDVI 例：\n$$\n\\mathrm{NDVI}=\\frac{R_{800}-R_{670}}{R_{800}+R_{670}}.\n$$\nR800、R670 是相應波段反射率，無因次。分母不能為零；先確認輻射處理、波段與幾何套合，不把任意 RGB 灰階直接當同一物理反射率。[S01 pp.93–95；補充條件]\n\n## 適用條件、推導邊界與常見誤解\n全景圖 2:1 是教材的經緯式展開例，不代表任何 2:1 圖片都已完成幾何率定。多鏡頭接縫、遮蔽與視差不是只加畫素就能解決。[S01 pp.99–102]\n\n第 01 章 p.50 的切向項含 $r^2+2\\bar x^2$，但 S02 p.25／31／42 未含 2，構成跨章差異；見 I01-03。這裡不自行把所有章節改成同一公式。\n\n## 來源與相關頁\n[來源](../sources.md) · [畸變詳細推導](distortion.md) · [疑點](../issues.md) · [章節](../chapters/01-sensors.md)\n"}, {"path": "wiki/concepts/checkerboard.md", "title": "棋盤格率定的關鍵推導", "body": "# 棋盤格率定的關鍵推導\n\n## 概念\n棋盤格率定（Checkerboard Calibration）以已知格長的平面角點作為物點，拍攝多種方向，估計內參及畸變。教材建議至少 10 張以上並涵蓋不同旋轉與傾斜；這是實務建議，不是任意拍 10 張就保證可解。[S02 pp.35–36]\n\n## 符號與假設\n本頁採 CV 座標、$\\gamma=0$ 的常用內參形式，無畸變時先求初值。世界到相機為 $\\mathbf X_c=R\\mathbf X_w+t$；R 的三個欄向量為 $r_1,r_2,r_3$。棋盤平面取 $Z=0$；X、Y、t 單位與格長一致，K 使用 pixel。[S02 pp.9,15–16,35；E03 §2.2 補充]\n\n## 補充推導：平面如何提供內參約束\n這段補齊教材 p.35 未展開的數學步驟，依 Zhang §2.2–2.3 與 §3.1 的關係作代數整理，**不是課堂逐字推導**。\n$$\n\\lambda\\mathbf q=K[r_1\\ r_2\\ r_3\\ t]\n\\begin{bmatrix}X\\\\Y\\\\0\\\\1\\end{bmatrix}\n=K[r_1\\ r_2\\ t]\\begin{bmatrix}X\\\\Y\\\\1\\end{bmatrix}.\n$$\n因此平面單應性 $H\\sim K[r_1\\ r_2\\ t]$。H 的欄向量記為 $h_1,h_2,h_3$；因旋轉欄向量正交且等長，令 $B=K^{-T}K^{-1}$ 得：\n$$\nh_1^TBh_2=0,\\qquad h_1^TBh_1-h_2^TBh_2=0.\n$$\n多張不同方向影像提供不同約束，先取得 K 的初值，再估姿態與畸變並做非線性精化。本頁不把「每張兩條約束」當成忽略先驗及退化配置的通用最少張數定理。[E03 §2.2–2.3、§3.1–3.3]\n\n## 教材流程與實作重點\n1. 已知格長，建立 $(X,Y,0)$ 物點。\n2. 拍攝不同位置與角度；偵測角點並建立一致對應。\n3. 估計內外參初值，再最小化重投影誤差。\n4. 保存參數與檢查結果，供影像修正使用。[S02 p.35]\n\n**外部實作補充**：棋盤格格數不等於內角點數，偵測成功後可做次像元細化；未成功影像不能當成有效角點觀測。[E02 Code]\n\n## 自建數值檢查\n若四個像點的二維殘差分別為 $(0.3,0.4)$、$(0,0.5)$、$(-0.3,-0.4)$、$(0,-0.5)$ pixel，則本頁定義的「每點二維 RMSE」為：\n$$\n\\mathrm{RMSE}_{point}=\\sqrt{\\frac{1}{N}\\sum_i(\\Delta u_i^2+\\Delta v_i^2)}=0.5\\ \\mathrm{pixel}.\n$$\n若改成每座標分量 RMSE，分母是 2N，數字不同。此為自建算例，不是率定實驗結果，也不把 E02 的示例誤差算法與這個定義混稱。\n\n## 假設、限制與常見誤解\n棋盤需能以平面模型描述，格長與角點排序要一致。重投影誤差小只代表此模型對觀測的擬合程度，不能直接宣稱三維公尺精度已合格。缺少拍攝影像時只能說明方法，不能報告實測率定成果。[S02 pp.35,44；補充判讀]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [內參](intrinsics.md) · [率定方法](calibration-methods.md) · [HW2](../cases/hw2-calibration.md)\n"}, {"path": "wiki/concepts/collinearity.md", "title": "共線條件式：三維物點到影像", "body": "# 共線條件式：三維物點到影像\n\n## 定義、符號與單位\n共線條件式（Collinearity Equation）要求理想像點、攝影中心及物點在同一直線。A＝$(X_A,Y_A,Z_A)$ 是物點，O＝$(X_O,Y_O,Z_O)$ 為攝影中心；M 將物空間方向轉到相機像空間；f、$x_p,y_p$、像點 x,y 用 mm，物方坐標可用 m，但分子分母須同單位。[S05 pp.16–23]\n\n## 教材推導補齊\n$$\n\\mathbf v_i=\\begin{bmatrix}x_a-x_p\\\\y_a-y_p\\\\-f\\end{bmatrix},\\qquad\n\\mathbf v_o=\\begin{bmatrix}X_A-X_O\\\\Y_A-Y_O\\\\Z_A-Z_O\\end{bmatrix},\\qquad\n\\mathbf v_i=\\lambda M\\mathbf v_o.\n$$\n令 $M\\mathbf v_o=(q_1,q_2,q_3)^T$；由第三列 $-f=\\lambda q_3$，所以 $\\lambda=-f/q_3$，代入前兩列：\n$$\nx_a-x_p=-f\\frac{m_{11}(X_A-X_O)+m_{12}(Y_A-Y_O)+m_{13}(Z_A-Z_O)}{m_{31}(X_A-X_O)+m_{32}(Y_A-Y_O)+m_{33}(Z_A-Z_O)},\n$$\n$$\ny_a-y_p=-f\\frac{m_{21}(X_A-X_O)+m_{22}(Y_A-Y_O)+m_{23}(Z_A-Z_O)}{m_{31}(X_A-X_O)+m_{32}(Y_A-Y_O)+m_{33}(Z_A-Z_O)}.\n$$\n這是無畸變的課堂 PM 形式。分母為零時無有限投影；物點還需在選定光軸的可見前方。不要把 CV 正向 Z 公式的正號直接搬來。[S05 pp.18–24；條件補充]\n\n## 畸變與原式界線\np.23 在共線式右側加 Δx、Δy 表示附加項；其切向平方項含 2，與 S02 原式差異見 I01-03。加號是該頁的模型方向，與「由原始點加修正量」必須分開定義，不把它當已完成統一的軟體模型。[S05 p.23；S02 pp.26,31,42–43]\n\n## DLT 與平面關係\n直接線性轉換（Direct Linear Transformation, DLT）把投影合併為 11 個尺度固定係數：\n$$\nx=\\frac{L_1X+L_2Y+L_3Z+L_4}{L_9X+L_{10}Y+L_{11}Z+1},\\quad\ny=\\frac{L_5X+L_6Y+L_7Z+L_8}{L_9X+L_{10}Y+L_{11}Z+1}.\n$$\n交叉相乘，例如 $x=L_1X+L_2Y+L_3Z+L_4-xXL_9-xYL_{10}-xZL_{11}$，對 L 可線性初估。若令 Z＝0，就得到平面八係數形式；一般三維點則不能直接用平面 H 取代。[S05 pp.49–54；代數步驟補齊]\n\n## 應用、限制與常見誤解\nDLT 係數不同項有不同量綱，不能說全都無因次。由係數分解內外參，需處理尺度、正交性與相機約束；p.51–52 的較完整公式保留其出處，本頁不把簡單代入當完整穩定率定流程。[S05 pp.50–54]\n\n## 來源與相關頁\n[來源](../sources.md) · [空間旋轉](spatial-rotation.md) · [交會與方位](orientation-adjustment.md) · [工程案例](../cases/engineering-measurement.md)\n"}, {"path": "wiki/concepts/coordinate-systems.md", "title": "四種座標與 PM／CV 慣例", "body": "# 四種座標與 PM／CV 慣例\n\n## 概念\n同一個空間點，會經過世界、相機、影像與像元四種描述。攝影測量（Photogrammetry, PM）與電腦視覺（Computer Vision, CV）的課程公式採不同方向與單位，先確認座標約定才能比較。[S02 pp.2–5,7–10,19]\n\n## 符號與單位\n| 符號 | 意義 | 單位／方向 |\n| --- | --- | --- |\n| $(X_w,Y_w,Z_w)$ | 世界座標 | 依場域定義，通常 m 或 mm |\n| $(X_c,Y_c,Z_c)$ | 相機座標，原點在攝影中心 | 長度；本頁 CV 取右、下、前 |\n| $(x,y)$ | 本頁指 PM 連續影像座標 | mm，右正、上正 |\n| $(u,v)$ | 像元座標 | pixel，右正、下正 |\n| $s$ | 本頁指像元尺寸 | mm/pixel，勿與齊次尺度混用 |\n| $W,H$ | 影像寬、高 | pixel |\n\n以上沿用教材座標與符號；$s$ 在其他頁若指不同量，必須重新定義。[S02 pp.7–19]\n\n## 教材公式與補充推導\n**教材公式**：以影像幾何中心為 PM 原點時，\n$$\nx=(u-W/2)s,\\qquad y=-(v-H/2)s.\n$$\n$$\nu=x/s+W/2,\\qquad v=-y/s+H/2.\n$$\n[S02 p.12]\n\n**補充推導**：先將左上原點平移到幾何中心，再乘像元尺寸，最後翻轉垂直軸。反向先除以像元尺寸、恢復垂直軸，再加回中心。每一步都能以單位驗算：pixel × mm/pixel = mm。\n\n**教材的相機座標比較**：PM 取 $X_c$ 右、$Y_c$ 上、$Z_c$ 往後；CV 取右、下、前。PM 影像向量以 $-f$ 表示，CV 的前方虛擬像平面以 $+f$ 表示。[S02 pp.10–11,14]\n\n**補充推導（同光心、同右軸時）**：\n$$\n\\mathbf X_{c,\\mathrm{CV}}=\\operatorname{diag}(1,-1,-1)\\mathbf X_{c,\\mathrm{PM}}.\n$$\n這只是上述軸向的轉換，不代表所有 PM 軟體都固定使用同一慣例。世界到相機的 $R,t$ 亦須跟隨方向定義。[S02 pp.9–10；補充代數]\n\n## 假設與適用條件\n本頁沿教材採 $W/2,H/2$ 的幾何中心。像素中心索引若採另一套半像素慣例，必須明示；不能悄悄改成 $(W-1)/2$。矩形像素時，x、y 要分別使用 $s_x,s_y$。[S02 pp.12,15；補充邊界說明]\n\n## 常見誤解\n- $(u,v)$ 可為次像元浮點座標，不只整數陣列索引；實際讀取影像才涉及格點取樣。[S02 pp.9,12；補充說明]\n- 像主點不必等於影像中心；主點也不是三維攝影中心。[S02 pp.13,17–18；見疑點 I02-02]\n\n## 來源與相關頁\n[S02 來源](../sources.md) · [內參](intrinsics.md) · [主點算例](../cases/principal-point.md) · [章節導覽](../chapters/02-calibration.md)\n"}, {"path": "wiki/concepts/distortion.md", "title": "鏡頭畸變與係數慣例", "body": "# 鏡頭畸變與係數慣例\n\n## 概念\n徑向畸變（Radial Distortion）以主點為中心改變像點位置；切向／偏心畸變（Tangential / Decentering Distortion）與光學元件未對準等因素相關。其意義不同於相機姿態造成的透視投影。[S02 pp.20–25]\n\n## 符號與單位\nPM 教材取 $\\bar x=x-x_p,\\ \\bar y=y-y_p,\\ r^2=\\bar x^2+\\bar y^2$。本段以 mm 為影像座標單位，徑向係數 $K_1,K_2,K_3$ 的單位分別為 mm⁻²、mm⁻⁴、mm⁻⁶，使修正量保持 mm。[S02 pp.23,26；單位為補充推導]\n\n## 教材徑向公式與推導\n$$\n\\Delta r=K_1r^3+K_2r^5+K_3r^7.\n$$\n$$\n\\Delta x_{Radial}=\\frac{\\bar x}{r}\\Delta r\n=\\bar x(K_1r^2+K_2r^4+K_3r^6),\n$$\n$$\n\\Delta y_{Radial}=\\bar y(K_1r^2+K_2r^4+K_3r^6).\n$$\n由徑向向量分量比例展開；$r=0$ 處使用展開後的連續形式，不直接除以零。[S02 pp.23,26；中間步驟補齊]\n\n## 教材切向原式：保留，待查\n第 25、31、42 頁印出的平方項如下：\n$$\n\\Delta x_{Decentering}=P_1(r^2+\\bar x^2)+2P_2\\bar x\\bar y,\n$$\n$$\n\\Delta y_{Decentering}=P_2(r^2+\\bar y^2)+2P_1\\bar x\\bar y.\n$$\n這裡忠實保留教材的係數，**未把平方項自行加上 2**。與下方 OpenCV 慣例的項次及係數不同，不能直接當作已確認等價；見 I02-01。[S02 pp.25,31,42]\n\n## 外部查核：OpenCV 的五係數模型\n以下為 E01 的正規化座標慣例，**不是教材 PM 原式的直接替換**。令無畸變正規化座標為 $(x_n,y_n)$，$r_n^2=x_n^2+y_n^2$：\n$$\nx_d=x_n(1+k_1r_n^2+k_2r_n^4+k_3r_n^6)+2p_1x_ny_n+p_2(r_n^2+2x_n^2),\n$$\n$$\ny_d=y_n(1+k_1r_n^2+k_2r_n^4+k_3r_n^6)+p_1(r_n^2+2y_n^2)+2p_2x_ny_n.\n$$\n此處 k、p 為無因次，順序及定義依 OpenCV；不要直接複製教材 $P_1,P_2$。[E01 Detailed Description]\n\n## 假設與適用條件\n教材 p.26 分別將 PM 正修正係數與 CV 生成畸變係數連結到相反的畸變名稱。這是其方向定義下的說明；多項式含高次項、不同單位或不同輸入座標時，不能單憑第一係數正負就做通用判斷，也不能只把所有係數變號當成精確反函數。[S02 p.26；補充限制；I02-03]\n\n## 常見誤解\n- $K_i$ 與 K 相機矩陣不同。\n- 畸變係數必須連同座標、單位及正反向定義一起保存。\n- 本頁未解的教材原式不得直接用於實際率定程式。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [疑點 I02-01／03](../issues.md) · [影像修正](undistortion.md) · [內參](intrinsics.md)\n"}, {"path": "wiki/concepts/epipolar-geometry.md", "title": "核幾何與基本矩陣 F", "body": "# 核幾何與基本矩陣 F\n\n## 定義與符號\n核幾何（Epipolar Geometry）由兩攝影中心及物點形成的極平面，限制對應點位於極線上。極點是另一相機中心在該影像的投影，可能在畫面外或無窮遠。以下 $x=(u,v,1)^T,x'=(u',v',1)^T$ 為無畸變像素齊次坐標。[S07 pp.3–8,14–16；E05 Basic concepts]\n\n## 教材推導補齊\n定義相機 1 到相機 2 為 $X'=RX+t$，K、K′ 分別為兩相機內參。正規化射線 $\\hat x=K^{-1}x,\\hat x'=K'^{-1}x'$。消去深度後，同名射線及基線共面：\n$$\n\\hat x'^T[t]_\\times R\\hat x=0,\\qquad\n[t]_\\times=\\begin{bmatrix}0&-t_z&t_y\\\\t_z&0&-t_x\\\\-t_y&t_x&0\\end{bmatrix}.\n$$\n代入像素坐標：\n$$\nx'^TFx=0,\\qquad F=K'^{-T}[t]_\\times RK^{-1}.\n$$\n這將教材的內外積、三角共面與相機投影連起來。$[t]_\\times v=t\\times v$；F 存在任意非零尺度，故代數殘差的大小不直接是 pixel 距離。[S07 pp.10–20]\n\n## 點到線，不是點到點\n$$\nl'=Fx=(a,b,c)^T,\\qquad au'+bv'+c=0.\n$$\n**補充距離**：候選點到線的垂直距離為 $|au'+bv'+c|/\\sqrt{a^2+b^2}$（pixel）；a＝b＝0 時這條線退化。極線只縮小搜尋範圍，沿線仍有無限候選，還需紋理或其他資訊。[S07 pp.6–8,19；E05；距離為補充]\n\n## 八點線性初估\n展開 $x'^TFx$，每對點對係數向量提供一列：\n$$\n[u'u,\\ u'v,\\ u',\\ v'u,\\ v'v,\\ v',\\ u,\\ v,\\ 1]\\,f=0.\n$$\n教材 p.21 以 $f_{33}=-1$ 固定尺度；只適用該元素非零。**補充**：一般八點法用齊次求解，須正規化資料並施加 rank(F)=2 等幾何條件；不能把 F 當任意可逆 H。八點是這個線性演算法的要求，不是所有 F 演算法的通用最少點數。[S07 pp.20–22；E05]\n\n## 條件、案例與常見誤解\nF 可描述已知或未知內參的像素關係，不是「只要知道 K 就不能用 F」。純旋轉、退化點分布或錯配都需要額外處理。[S07 pp.8,20–24；補充限制]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動極線](../../labs/index.md) · [本質矩陣](essential-decomposition.md) · [深度](stereo-depth.md)\n"}, {"path": "wiki/concepts/essential-decomposition.md", "title": "本質矩陣 E、SVD 與尺度不定", "body": "# 本質矩陣 E、SVD 與尺度不定\n\n## 定義與符號\n本質矩陣（Essential Matrix）作用在兩圖的正規化射線，旋轉 R 無因次、t 為兩相機關係中的平移；影像本身只能決定其方向與任意尺度。[S07 pp.24–32]\n\n## 公式與推導\n由 F 的定義：\n$$\nE=K'^TFK=[t]_\\times R,\\qquad\\hat x'^TE\\hat x=0.\n$$\n教材以同一 K 的簡式表示，本頁在兩相機不同時保留 K′，相同時才合併。[S07 pp.17–24]\n\n外積的秩：\n$$\n[t]_\\times t=0,\\qquad\n[t]_\\times[t]_\\times^T=\\|t\\|^2I-tt^T.\n$$\n**補充推導**：t≠0 時，沿 t 的特徵值為 0，垂直方向兩值為 $\\|t\\|^2$；因此 E 的奇異值為 $(\\|t\\|,\\|t\\|,0)$，取尺度 $\\|t\\|=1$ 後即 (1,1,0)。不是因為外積對所有向量都保持長度。[S07 pp.26–27；I07-02]\n\n## SVD 解與選解\n教材 $E=U\\Sigma V^T$，並定義：\n$$\nW=\\begin{bmatrix}0&-1&0\\\\1&0&0\\\\0&0&1\\end{bmatrix},\\qquad\nR_1=UWV^T,\\quad R_2=UW^TV^T,\\quad t=\\pm u_3.\n$$\n得到四組候選，三角交會後檢查點是否在兩相機前方（Cheirality）。R1／R2 的命名可交換，但須保持整套慣例一致。[S07 pp.27–32]\n\n**補充數值處理**：噪聲 E 可投影到 $U\\operatorname{diag}(\\bar\\sigma,\\bar\\sigma,0)V^T$。修正 U／V 的方向使旋轉滿足 det＝+1，並檢查正交性，再做選解；不能只憑某個矩陣有三個角數字就認為有效。[S07 pp.27,30,32；補充實作界線]\n\n## 反函數疑點與限制\n對固定 t，$t\\times x=u$ 的核包含 t；若 x0 是解，$x=x_0+\\alpha t$ 也都是解。一般解是一條仿射直線，不是教材 p.26 所稱的圓，除非再加其他未交代限制。原述保留 I07-02。[S07 p.26；代數查核]\n\n## 常見誤解與案例\n由 E 解出的 t 長度不等於公尺基線；若沒有已知尺度、GNSS 或其他控制，三維點雲沒有絕對長度單位。已知物理基線的雙目系統與任意兩張影像的 SfM 需分開。[S07 pp.24,30–32,48]\n\n## 來源與相關頁\n[來源](../sources.md) · [F](epipolar-geometry.md) · [交會與尺度](orientation-adjustment.md) · [HW4](../cases/hw4-stereo.md)\n"}, {"path": "wiki/concepts/feature-detection.md", "title": "特徵偵測：角點、斑點、邊緣與線段", "body": "# 特徵偵測：角點、斑點、邊緣與線段\n\n## 定義與符號\n特徵偵測（Feature Detection）找穩定、可重複且具區別性的位置；「偵測到點」不等於已找到跨影像對應。I 為灰階值，x,y 為影像位置，$I_x,I_y$ 為梯度，窗口權重 w 與微小平移 u,v 另定義於下式。[S04 pp.3–6]\n\n## Harris 的關鍵推導\n教材以窗口平移前後強度差平方和判斷角點：\n$$\nE(u,v)=\\sum_{x,y}w(x,y)[I(x+u,y+v)-I(x,y)]^2.\n$$\n泰勒一階 $I(x+u,y+v)-I(x,y)\\approx I_xu+I_yv$，代入得：\n$$\nE(u,v)\\approx [u\\ v]M[u\\ v]^T,\\qquad\nM=\\sum_{x,y}w(x,y)\\begin{bmatrix}I_x^2&I_xI_y\\\\I_xI_y&I_y^2\\end{bmatrix}.\n$$\n$$\nR=\\det M-k(\\operatorname{tr}M)^2.\n$$\nM 的兩個特徵值都大，代表兩方向移動皆顯著改變灰階；一大一小偏向邊緣，皆小偏向平坦。教材 k 約 0.04–0.06，這不是跨影像通用的角點強度門檻。[S04 pp.7–11；泰勒中間步驟補齊]\n\n## FAST 與 DoG\nFAST 比較中心點周圍半徑 3 pixel 的 16 點，連續 N 點都高於 $I_p+t$ 或低於 $I_p-t$ 才形成候選；再做非極大值抑制。[S04 pp.12–14]\n\nDoG 在不同尺度相減：\n$$\nL(x,y,\\sigma)=G(x,y,\\sigma)*I(x,y),\\quad\nD(x,y,\\sigma)=L(x,y,k\\sigma)-L(x,y,\\sigma).\n$$\n在 (x,y,σ) 尺度空間找局部極值。k 為尺度倍率，不是 Harris 的 k；σ 單位為 pixel。DoG 是 SIFT 偵測的重要部分，不應把整個 SIFT／SURF／ORB 當成同一種角點算式。[S04 pp.15–20]\n\n## 邊緣與線段\nCanny：平滑 → 梯度 → 非極大值抑制 → 雙門檻與遲滯連結。教材 p.23 寫沿「邊緣方向」找極大；與 p.21 的梯度方向說明不同，實作應分清梯度法向與邊緣切向，疑點 I04-01 保留。[S04 pp.21–25]\n\nHough 將邊緣像素投票到 $\\rho=x\\cos\\theta+y\\sin\\theta$ 參數空間；ρ 為 pixel，θ 為法線角。LSD（Line Segment Detector）從梯度方向一致的線支撐區域擬合有限線段，再用統計規則篩選。[S04 pp.26–32]\n\n## 案例、條件與常見誤解\nHarris／FAST 的基礎形式不具完整尺度不變性；旋轉／光照「穩定」也不是在任意曝光、遮蔽或透視下保證不變。重複紋理可能產生很多點，卻難以唯一配對。[S04 pp.5,11,14,19,40；補充界線]\n\n## 來源與相關頁\n[來源](../sources.md) · [描述與配對](feature-matching.md) · [幾何驗證](robust-estimation.md) · [SfM 案例](../cases/sfm-pipeline.md)\n"}, {"path": "wiki/concepts/feature-matching.md", "title": "特徵匹配：NCC、描述子與比率測試", "body": "# 特徵匹配：NCC、描述子與比率測試\n\n## 定義與符號\n區域式（Area-based）直接比較局部灰階；描述子式（Descriptor-based）把特徵周圍編碼為向量，再比較距離。f、g 是兩個影像小窗，d1、d2 是最近與次近描述子距離，$d_1\\le d_2$。[S04 pp.33–48]\n\n## NCC 推導與適用條件\n將窗口扣除各自平均，形成向量 $\\tilde f=f-\\bar f,\\tilde g=g-\\bar g$，再除以向量長度，內積即正規化互相關：\n$$\n\\mathrm{NCC}=\\frac{\\sum_i(f_i-\\bar f)(g_i-\\bar g)}{\\sqrt{\\sum_i(f_i-\\bar f)^2\\sum_i(g_i-\\bar g)^2}}.\n$$\n灰階相同單位在分子分母抵消，結果無因次。常數窗口使分母為零，不能硬填 NCC＝1。基本平移模板法不自然容忍大旋轉與尺度差，適合小位移或已糾正的立體影像。[S04 pp.35–40；向量化補齊]\n\n## 描述子比較\n| 方法 | 課堂重點 | 距離／限制 |\n| --- | --- | --- |\n| SIFT | 多尺度 DoG、主方向、128 維梯度直方圖 | 實值向量距離 |\n| SURF | 積分影像／Haar 響應，常見 64 或 128 維 | 實值向量，不只「縮短版 SIFT」 |\n| ORB | Oriented FAST＋Rotated BRIEF，課堂用 256 bits | Hamming 距離，尺度／模糊仍有限制 |\n\n[S04 pp.41–45]\n\n實值向量歐氏距離 $d=\\sqrt{\\sum_i(R_i-T_i)^2}$；二值描述子則計算 XOR 不同 bit 數。不要直接把兩種距離數值放在同一門檻下比較。[S04 pp.45–46；補充辨別]\n\n## 比率測試\n$$\nr=\\frac{d_1}{d_2},\\qquad r\u003c\\tau\\quad\\text{保留候選}.\n$$\n最近候選若與次近幾乎一樣好（r 接近 1），通常代表歧義。**補充算例**：d1＝30、d2＝60、τ＝0.75，r＝0.5 通過；改 d1＝55 則約 0.917 不通過。d2＝0 表示距離資訊退化，互動顯示無法判定而不除零。[S04 p.47；算例為自建]\n\n## 常見誤解\nτ 越大通常保留更多候選，也可能接受更多錯配；通過比率測試仍須幾何驗證。教材的 0.1／0.5 pixel 精度與 3–5 倍速度只屬課程比較語境，不作普遍效能保證。[S04 pp.35,44,48–50]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動比率測試](../../labs/index.md) · [偵測](feature-detection.md) · [RANSAC](robust-estimation.md)\n"}, {"path": "wiki/concepts/interpolation.md", "title": "影像反算與內插", "body": "# 影像反算與內插\n\n## 定義、符號與單位\n重採樣（Resampling）在新影像每個整數格點，回到原圖的浮點位置估計灰階。座標單位 pixel，I 是 DN（Digital Number）／灰階值；增加輸出像素不會增加原始觀測資訊。[S03 pp.35–46]\n\n## 正算與反算\n教材 $x'=1.5x$：原整數點 0,1,2,3 映為 0,1.5,3,4.5，若直接截斷會跳過輸出格點 2。反算 $x=x'/1.5$ 對每個輸出位置求來源位置，再內插取值。[S03 pp.41–45]\n\n## 雙線性推導\n令來源位置為 $(i+d_x,j+d_y)$，$d_x,d_y\\in[0,1]$。本頁將四角明定為 $I_{00}=I(i,j)$、$I_{10}=I(i+1,j)$、$I_{01}=I(i,j+1)$、$I_{11}=I(i+1,j+1)$，避免教材 A／B／C／D 排列混淆。\n先在 x 內插，再在 y 內插：\n$$\nI=(1-d_y)[(1-d_x)I_{00}+d_xI_{10}]\n+d_y[(1-d_x)I_{01}+d_xI_{11}].\n$$\n四權重和為 1，故常數影像會維持常數。自建算例：四值 0、100、100、200，$d_x=d_y=0.5$，輸出 100。[S03 pp.47–48；符號與算例補充]\n\n## 三次與雙三次\n教材 $f(x)=ax^3+bx^2+cx+d$，由端點值與導數四個條件求四係數。令 $f(0)=f_0,f(1)=f_1,f'(0)=g_0,f'(1)=g_1$，可解得：\n$$\nd=f_0,\\quad c=g_0,\\quad b=3(f_1-f_0)-2g_0-g_1,\\quad a=2(f_0-f_1)+g_0+g_1.\n$$\n這是教材 Hermite 型推導的補齊；雙三次依序在兩方向對周圍 16 點內插。不同 cubic kernel 不一定相同，可能有過衝，不保證任何影像都比 bilinear 更接近未知真值。[S03 pp.49–54；補充限制]\n\n## 陣列案例\n影像寬 4000，(i,j)=(4,3)，row-major 灰階線性索引為 $jW+i=12004$。三通道 interleaved BGR 的位元組位置再乘 3；16-bit 的 byte 順序需與資料格式一致，教材示例採低位 byte 在前。[S03 pp.38–40]\n\n## 適用條件與常見誤解\n最鄰近保留原始類別值，bilinear 會混值；邊界須明訂截斷／補值策略。p.53 的執行時間只屬該展示，不是所有硬體的固定速度。[S03 pp.46–54；補充條件]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動內插](../../labs/index.md) · [影像修正](undistortion.md) · [平面變換](planar-transforms.md)\n"}, {"path": "wiki/concepts/intrinsics.md", "title": "相機內參與針孔投影", "body": "# 相機內參與針孔投影\n\n## 概念\n內方位參數（Intrinsic Parameters / Interior Orientation Parameters, IOPs）描述相機內部的投影幾何；外方位參數（Extrinsic Parameters）描述世界與相機的相對位置及姿態。畸變係數是理想針孔模型之外的附加參數。[S02 pp.8–9,18,27]\n\n## 符號與單位\n| 符號 | 定義 | 單位 |\n| --- | --- | --- |\n| $f$ | 主距／課程稱焦距 | mm |\n| $s_x,s_y$ | 水平、垂直像元尺寸 | mm/pixel |\n| $f_x=f/s_x,\\ f_y=f/s_y$ | 像素焦距 | pixel |\n| $(c_x,c_y)$ | CV 主點 | pixel |\n| $\\gamma$ | 教材 p.15 的 skew 項 | pixel |\n| $(x',y')$ | 正規化相機座標 | 無因次 |\n| $\\lambda$ | 本頁新增的齊次尺度符號 | 與所選齊次表示有關 |\n\n教材在不同表格亦以 s 表 skew；此頁採 p.15 的 $\\gamma$ 避免與像元尺寸混淆。[S02 pp.15–18,37]\n\n## 教材公式與關鍵推導\n在 CV 前方像平面、$Z_c\\ne0$ 的約定下，相似三角形給出：\n$$\nx=f\\frac{X_c}{Z_c},\\qquad y=f\\frac{Y_c}{Z_c}.\n$$\n除以 $f$ 得正規化座標 $x'=X_c/Z_c,\\ y'=Y_c/Z_c$。此段 $(x,y)$ 指 CV 虛擬像平面的連續座標，與 PM 頁的方向不同。[S02 p.14]\n\n換成像素並加上主點：\n$$\nu=f_xx'+\\gamma y'+c_x,\\qquad v=f_yy'+c_y.\n$$\n$$\nK=\\begin{bmatrix}f_x&\\gamma&c_x\\\\0&f_y&c_y\\\\0&0&1\\end{bmatrix},\\qquad\n\\lambda\\begin{bmatrix}u\\\\v\\\\1\\end{bmatrix}=K\\begin{bmatrix}X_c\\\\Y_c\\\\Z_c\\end{bmatrix}.\n$$\n[S02 pp.15–16]\n\n**補充推導**：將 $x',y'$ 代入矩陣式，再乘 $Z_c$ 即得齊次形式；此選法可取 $\\lambda=Z_c$。本頁用 $\\lambda$ 區分教材像元尺寸 $s$，不是改變模型。\n\n## 自建算例\n假設 $f=20\\,\\mathrm{mm}$、$s_x=s_y=0.005\\,\\mathrm{mm/pixel}$，則 $f_x=f_y=4000\\,\\mathrm{pixel}$。這是用來驗算單位的假設例子，不是教材實測率定結果。\n\n## 假設與適用條件\n這是無畸變的針孔模型；畸變不包含在 K 本身。$\\gamma=0$ 是常用簡化，不應把非零 skew 的式子直接當作所有工具都支援的估計選項。[S02 pp.15–16,20–27；E01 Detailed Description 查核]\n\n## 常見誤解\n內參 K 已知，不代表物點深度已知；一個像素仍對應一條觀測射線。mm 的 f 不可直接填入以 pixel 為單位的 K。[S02 pp.11,14–19；補充推論]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [座標](coordinate-systems.md) · [畸變](distortion.md) · [棋盤格](checkerboard.md)\n"}, {"path": "wiki/concepts/learned-matching.md", "title": "學習式匹配：SuperPoint、SuperGlue 與 LightGlue", "body": "# 學習式匹配：SuperPoint、SuperGlue 與 LightGlue\n\n## 定義與角色\nSuperPoint 偵測特徵位置、分數並輸出描述子；SuperGlue／LightGlue 則以兩圖的局部特徵作匹配。三者角色與架構不同，不能把 detector 與 matcher 當成同一模型。[S06 pp.42–58；E06／E07 官方查核]\n\n## 形狀、符號與推導\n教材 SuperPoint 共享 encoder 將 H×W 影像轉成約 H/8×W/8 的粗特徵。偵測分支 65 通道對應一個 8×8 cell 的 64 位置與一個 dustbin；去掉 dustbin 並重排可形成 H×W 分數圖。**補充**：這是每位置分數，不代表每 cell 永遠只能保留一個最終 keypoint，還須門檻及非極大值抑制等步驟。[S06 pp.43–48；I06-02]\n\n描述分支為 H/8×W/8×D，教材 D＝256；經插值與 L2 正規化形成描述。正規化後向量為無因次，輸出座標的縮放仍須對應原圖。[S06 pp.47–49]\n\nSuperGlue 在同圖做 self-attention、跨圖做 cross-attention，更新後描述子計算：\n$$\nS_{ij}=\\langle f_i^A,f_j^B\\rangle,\\qquad S\\in\\mathbb R^{M\\times N}.\n$$\n加入不能匹配的 dustbin 列／欄成 (M+1)×(N+1)，再以最佳匹配層（教材 Sinkhorn 示意）形成部分分配矩陣 P。P 不是三維空間點座標。[S06 pp.50–58]\n\n## 外部查核與教材混用\nLightGlue 官方專案明確提供自適應深度／寬度的匹配機制；SuperGlue 官方專案則對應圖神經網路與最優傳輸匹配。p.42 標題 LightGlue、內文／圖 SuperGlue，p.59 又列 LightGlue 門檻，故本 Wiki 分開說明，不能把 pp.50–58 的架構直接標成 LightGlue。[S06 pp.42,50–59；E06／E07；I06-02]\n\n## 案例、條件與常見誤解\n空拍與衛星資料有尺度、時間、季節差異；學習式匹配提供候選，但仍要轉成地理三維控制點並檢查後方交會結果。匹配信心分數不是定位誤差的公尺數，也不能跨模型直接比較。[S06 pp.35–42,59–68]\n\n## 來源與相關頁\n[來源](../sources.md) · [地理對位案例](../cases/geographic-registration.md) · [傳統描述子](feature-matching.md) · [疑點](../issues.md)\n"}, {"path": "wiki/concepts/least-squares.md", "title": "最小二乘、殘差與精度定義", "body": "# 最小二乘、殘差與精度定義\n\n## 定義與符號\n最小二乘（Least Squares）在選定模型與觀測下，找使殘差平方和最小的參數。教材 $L=AX+V$ 與後頁 $V=AX-L$ 有符號差異，但平方和與解不受整體變號影響。本頁固定 $v=A\\theta-L$；$\\theta$ 是為避免參數 X 與目標座標 X 混淆而新增的符號。[S03 pp.27–32]\n\n## 推導\n$$\nJ(\\theta)=v^Tv=(A\\theta-L)^T(A\\theta-L).\n$$\n$$\n\\frac{\\partial J}{\\partial\\theta}=2A^T(A\\theta-L)=0\n\\quad\\Longrightarrow\\quad A^TA\\hat\\theta=A^TL.\n$$\n若 A 滿列秩，$\\hat\\theta=(A^TA)^{-1}A^TL$。教材 p.30 導數印出負號但仍得到同一個零點方程；正文保留一致推導，原述在 I03-02。**實作補充**：QR／SVD 解最小二乘通常比直接形成反矩陣更合適；此頁反矩陣用來說明代數。[S03 pp.29–30]\n\n## 仿射設計矩陣\n$$\n\\begin{bmatrix}X_i\\\\Y_i\\end{bmatrix}=\n\\begin{bmatrix}1&x_i&y_i&0&0&0\\\\0&0&0&1&x_i&y_i\\end{bmatrix}\n\\begin{bmatrix}a_0\\\\a_1\\\\a_2\\\\b_0\\\\b_1\\\\b_2\\end{bmatrix}+\\text{殘差}.\n$$\n每個對應點提供兩列，n 點共 2n 條觀測，未知數六個。上式殘差採「觀測減模型」；若用本頁 v，將殘差移至另一側即可，平方和相同。[S03 pp.31–32；符號整理]\n\n## RMSE 與自由度\n教材把 $\\sqrt{v^Tv/(N_v-N_x)}$ 稱 RMSE；仿射案例分母為 $2n-6$。本 Wiki 明稱「自由度校正殘差尺度」，並與每點二維 RMSE 分開：\n$$\n\\hat\\sigma_0=\\sqrt{\\frac{v^Tv}{2n-6}},\\qquad\n\\mathrm{RMSE}_{point}=\\sqrt{\\frac{v^Tv}{n}}.\n$$\n**補充算例**：n＝5、SSE＝2 pixel²，前者 $\\sqrt{2/4}=0.7071$ pixel，後者 $\\sqrt{2/5}=0.6325$ pixel。不是同一統計量；n＝3 時前者分母為零，不能報零誤差尺度。[S03 pp.30,32；自建數值驗算]\n\n## 案例、限制與常見誤解\n誤差向量圖能顯示周邊系統偏差；只報單一總 RMSE 會遮住空間模式。更多參數可能降低訓練點殘差，但不保證新點精度。理論最少點數不代表已有穩定冗餘觀測。[S03 pp.18,25,28,34；補充判讀]\n\n## 來源與相關頁\n[來源](../sources.md) · [平面轉換](planar-transforms.md) · [HW3](../cases/hw3-stitching.md) · [率定 RMSE 算例](checkerboard.md)\n"}, {"path": "wiki/concepts/matching-metrics.md", "title": "匹配指標：MR、DR、CR 與分母", "body": "# 匹配指標：MR、DR、CR 與分母\n\n## 定義與符號\n依教材這組實驗定義，FA、FB 為兩圖特徵數，M 為匹配對數，D 為重複匹配數，CM 為過濾後正確匹配數；皆為計數。這些名稱不是所有論文都採相同定義。[S06 pp.16–18]\n\n## 教材公式與算術查核\n$$\n\\mathrm{MR}=100\\frac{2M}{F_A+F_B},\\qquad\n\\mathrm{DR}=100\\frac{D}{M},\\qquad\n\\mathrm{CR}=100\\frac{CM}{M-D}.\n$$\n教材例 FA＝13、FB＝15、M＝6、D＝2、CM＝3，依原公式：MR≈42.86%、DR≈33.33%、CR＝75%。原頁 MR 寫 66%，已在 I06-01 保留原述並重算。[S06 p.16]\n\n## 補充推導與條件\nMR 用 2M 是把每對匹配在兩圖各計一個特徵；CR 分母扣除重複數。分母為零時為未定義，不能顯示 0% 來暗示方法很差。若為一對一配對，另須 $M\\le\\min(F_A,F_B)$；若允許多對一，必須先說明計數方式。\n\n## 案例與常見誤解\nN-SURF(MAX) 可能得到更多正確匹配總數，卻不一定有較高比率或較少時間；教材將點數、MR、DR、CR、精度與時間一起列出，應一起讀，不能只選單一漂亮指標。[S06 pp.18–23]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動指標試算](../../labs/index.md) · [多光譜套合](multispectral-registration.md) · [疑點](../issues.md)\n"}, {"path": "wiki/concepts/multispectral-registration.md", "title": "異質影像與多光譜套合", "body": "# 異質影像與多光譜套合\n\n## 定義、符號與問題\n影像套合（Registration）使不同來源的像素對應同一物點。多鏡頭存在不同姿態及畸變；不同波段也有非線性灰階差，因此同一偵測門檻可能得到差異很大的點數。[S06 pp.4–10]\n\n## N-SURF 的課堂思路\n原 SURF 比較相鄰尺度與空間極值；N-SURF 分開尺度做局部極值，並利用累積分布（CDF）自動選門檻，以控制各影像取得的特徵數。[S06 pp.11–15]\n\n**補充推導**：若某尺度有 N 個候選反應值，想保留 K 個最強點，可用排序／經驗分位數取得約 $1-K/N$ 的分位門檻。反應值重複時，單一嚴格門檻未必剛好得到 K 個，實作還需 tie-breaking。這是對 CDF 想法的補充，非教材公開程式規格。\n\n## 模型與公式\n教材比較 AT（Affine）、PT（Projective）與 EPT（Extended Projective Transform）。後者在透視映射上加畸變附加項：\n$$\nu=\\frac{A_1x+A_2y+A_3}{C_1x+C_2y+1}+\\Delta_x,\\qquad\nv=\\frac{B_1x+B_2y+B_3}{C_1x+C_2y+1}+\\Delta_y.\n$$\nx,y 是輸入平面位置；u,v 為目標座標，皆須統一單位；Δ 須與輸出同單位。教材假定參考影像無變形，差異由另一台描述；附加項的座標與方向仍須依模型定義核對，不直接套用未確認的 S02 切向公式。[S06 pp.24–26]\n\n## 結果與推導邊界\n教材例的 EPT 誤差向量未見相同系統模式，並報約 0.2–0.4 pixel 的套合精度；只代表該案例的模型與資料，沒有證據保證所有場景 EPT 都優於 PT／AT。[S06 pp.27–29]\n\n## 案例、限制與常見誤解\nNIR／RED、RGB／Thermal 的成像資訊不同；增加偵測點只是增加候選，仍須幾何檢查。深度起伏、遮蔽或物體變動不能完全被一個平面模型吸收。[S06 pp.6–7,23–29；補充界線]\n\n## 來源與相關頁\n[來源](../sources.md) · [匹配指標](matching-metrics.md) · [多相機案例](../cases/multi-camera-stitch.md) · [平面模型](planar-transforms.md)\n"}, {"path": "wiki/concepts/orientation-adjustment.md", "title": "前後方交會、相對方位與光束法平差", "body": "# 前後方交會、相對方位與光束法平差\n\n## 定義與未知數\n| 問題 | 已知條件 | 求解 |\n| --- | --- | --- |\n| 後方交會 Space Resection | 物方控制點、像點與相機模型 | 相機位置／姿態 |\n| 前方交會 Forward Intersection | 多像內外參與同名像點 | 三維物點 |\n| 相對方位 Relative Orientation | 對應像點及相機模型 | 兩像相對關係、任意尺度模型 |\n| 絕對方位 Absolute Orientation | 相對模型與尺度／控制條件 | 模型到地圖座標轉換 |\n| 光束法平差 Bundle Adjustment | 多影像觀測與約束 | 聯合精化相機及三維點 |\n\n[S05 pp.26–28,55–61]\n\n## 關鍵推導與尺度\n兩像相對關係的旋轉 3 自由度，平移方向 2 自由度（長度作尺度固定），共 5。n 組同名點有 4n 像方觀測與 3n 物點未知數：$4n=3n+5$ 得 n＝5 的自由度計數。這是必要計數，不代表五點任意分布都有唯一解；教材 p.58 的 n>6 冗餘敘述，依計數應在 n>5 即有冗餘，見 I05-02。[S05 p.58；條件補充]\n\n絕對方位的七參數：\n$$\n\\mathbf X_{map}=sR\\mathbf X_{model}+T.\n$$\nR 三旋轉、T 三平移、s 一尺度。模型長度任意時，s 負責換成地圖長度單位；控制點須有足夠幾何分布。[S05 p.59]\n\n## 非線性平差補充\n令觀測預測差為 $r(\\theta)=\\pi(\\theta)-z$，在初值 $\\theta_0$ 附近線性化：\n$$\nr(\\theta_0+\\delta)\\approx r(\\theta_0)+J\\delta,\\qquad\nJ^TJ\\delta=-J^Tr(\\theta_0).\n$$\n這是將課堂聯合解算說明補成 Gauss–Newton 示意。實作需初值、權重／robust loss、約束與尺度固定，不宣稱所有軟體採相同求解器。[S05 pp.26,60–61；補充推導]\n\n## 交會的條件與常見誤解\n一個像點只給一條射線，不能單獨決定深度。兩條有噪聲射線常不精確相交，需最小化殘差；基線、交會角、內參、同步及對應點都影響成果。[S05 pp.27–28,38,41；補充判讀]\n\n後方交會三個非共線控制點的方程數夠，不代表非線性解唯一；教材示範也建議多於三點作平差。不能只用「未知數等於方程數」作穩定性保證。[S05 pp.27,56]\n\n## 來源與案例\n[來源](../sources.md) · [工程案例](../cases/engineering-measurement.md) · [共線式](collinearity.md) · [SfM](../cases/sfm-pipeline.md)\n"}, {"path": "wiki/concepts/planar-transforms.md", "title": "平面轉換：相似、仿射與單應性", "body": "# 平面轉換：相似、仿射與單應性\n\n## 定義與符號\n將平面點 (x,y) 映成 (X,Y)。本頁兩者都用同一影像長度單位（pixel）；平移也用 pixel，尺度與剪切無因次，角度在計算時用 radian。[S03 pp.3–18]\n\n## 教材公式與關鍵推導\n相似轉換（Similarity）保形與角度：\n$$\nX=a_0+m(x\\cos\\alpha-y\\sin\\alpha),\\quad\nY=b_0+m(x\\sin\\alpha+y\\cos\\alpha).\n$$\n令 $a_1=m\\cos\\alpha,\\ b_1=m\\sin\\alpha$，可寫為 $X=a_0+a_1x-b_1y,\\ Y=b_0+b_1x+a_1y$，共有四參數。兩個不同點提供四條觀測式，但不能退化為同一點。[S03 pp.7–9,18；中間代換補齊]\n\n仿射轉換（Affine）：\n$$\nX=a_0+a_1x+a_2y,\\qquad Y=b_0+b_1x+b_2y.\n$$\n可含非等向縮放與剪切，保持共線性及平行性；六參數最少需三組不共線對應。寫成 $\\mathbf X=A\\mathbf x+t$，可逆須 $\\det A\\ne0$。[S03 pp.10–13,18；可逆條件補充]\n\n透視轉換（Projective / Homography）：\n$$\nX=\\frac{a_0+a_1x+a_2y}{1+c_1x+c_2y},\\qquad\nY=\\frac{b_0+b_1x+b_2y}{1+c_1x+c_2y}.\n$$\n$$\n\\lambda\\begin{bmatrix}X\\\\Y\\\\1\\end{bmatrix}=\n\\begin{bmatrix}a_1&a_2&a_0\\\\b_1&b_2&b_0\\\\c_1&c_2&1\\end{bmatrix}\\begin{bmatrix}x\\\\y\\\\1\\end{bmatrix}.\n$$\n分母移項得 $X=a_0+a_1x+a_2y-Xxc_1-Xyc_2$，對未知係數可建線性初估系統。八自由度一般位置下至少四對；固定右下為 1 只適用該元素非零的尺度選法。[S03 pp.14–15,18；E04 Basic theory 補充界線]\n\n## 二次多項式\n課堂以 $a_{00},a_{10},a_{11},a_{20},a_{21},a_{22}$ 表示 $1,x,y,x^2,xy,y^2$ 六項（Y 使用 b）。每軸六係數，可描述彎曲，但需足夠且分布良好的控制點，不能自動視為物理相機模型。[S03 p.16]\n\n## 條件與常見誤解\n單一 H 可用於平面場景，或特定純旋轉成像等條件；一般有深度差及相機平移的場景不會全部由一個 H 精確對齊。Homography 不是 Affine 的同義詞；令 $c_1=c_2=0$ 才回到仿射形式。[S03 pp.14–18；E04]\n\np.5 的 $\\left[\\begin{smallmatrix}\\cos\\alpha&\\sin\\alpha\\\\-\\sin\\alpha&\\cos\\alpha\\end{smallmatrix}\\right]$ 描述座標軸旋轉；p.7 的點變換是另一方向，不能省略方向解釋。互動模組沿本頁 p.7 點變換約定。[S03 pp.5,7；I03-01]\n\n## 案例與相關頁\n[HW3 拼接](../cases/hw3-stitching.md) · [互動平面轉換](../../labs/index.md) · [最小二乘](least-squares.md) · [來源](../sources.md)\n"}, {"path": "wiki/concepts/robust-estimation.md", "title": "幾何驗證與 RANSAC", "body": "# 幾何驗證與 RANSAC\n\n## 定義、符號與流程\nRANSAC（Random Sample Consensus）反覆抽取最小樣本估模型，再看多少點符合殘差門檻；先過濾大錯，再用內點做參數精化。w 為假定內點比例，s 為最小樣本點數，p 為期望至少一次抽到全內點的機率。[S04 pp.49–50]\n\n## 補充推導：為什麼需要反覆抽樣\n假設抽樣獨立且每點為內點機率 w，一次 s 點皆內點機率為 $w^s$。N 次皆失敗為 $(1-w^s)^N$。令成功機率至少 p：\n$$\n1-(1-w^s)^N\\ge p\\quad\\Longrightarrow\\quad\nN\\ge\\frac{\\log(1-p)}{\\log(1-w^s)}.\n$$\n此為教材重複抽樣觀念的機率補充，非課堂列出的實測迭代次數。僅適用 $0\u003cw\u003c1,0\u003cp\u003c1$；w＝0 無法靠增加次數取得全內點。[S04 p.50；補充推導]\n\n自建例 w＝0.5、s＝4、p＝0.99，需至少 72 次。這不是保證找到正確物理模型：若樣本共線或模型選錯，即使全是對應點也可能失敗。\n\n## 模型與殘差要一起選\n平面映射可使用仿射或 H；一般雙視圖幾何看 F／E。像素重投影距離與代數殘差的單位／尺度不同，不能共用一個未定義的門檻。教材 p.50 的「一般用 Affine」是展示例，不應套用到所有三維場景。[S04 p.50；S03 pp.14–18；S07 pp.8,20–22]\n\n## 案例與適用條件\n重複紋理、低重疊與錯誤場景模型容易讓一致集合不可靠。最後仍要看內點分布、殘差圖與有效視角，不能只報最大內點數。[S04 pp.5,40,50–52；補充檢查]\n\n## 常見誤解\nRANSAC 不是把所有匹配「改成正確」；它是在指定模型與門檻下選一致集合。自適應停止條件也不能省略最大輪數與退化檢查。\n\n## 來源與相關頁\n[來源](../sources.md) · [互動：比率與抽樣次數](../../labs/index.md) · [最小二乘](least-squares.md) · [SfM](../cases/sfm-pipeline.md)\n"}, {"path": "wiki/concepts/sensing-quality.md", "title": "成像品質、解析度與曝光", "body": "# 成像品質、解析度與曝光\n\n## 概念\n影像感測器（Image Sensor）把光轉為電訊號；課程介紹 CCD／CMOS、單相機、雙目、RGB-D、SfM／MVS 等取得三維資料的途徑。取像品質會影響後續特徵與幾何估計，但畫素數增加不等於所有重建誤差都降低。[S01 pp.2–11]\n\n## 定義、符號與單位\n| 量 | 定義 | 單位／注意事項 |\n| --- | --- | --- |\n| 影像解析度 | 寬 W × 高 H 的像素數 | pixel，不等同 GSD |\n| 空間解析度 | 物方可取樣的空間間距 | 本課以 GSD 為重要描述 |\n| 波譜解析度 | 可區分的波段及寬度 | nm／μm，窄波段與多波段不同 |\n| 輻射解析度 | 灰階數位化層級 | n bit，並不保證有效訊雜比 |\n| 時間解析度 | 重複觀測時間 | 與 fps／再訪週期需分情境 |\n| 曝光時間 t | 單次曝光長度 | s |\n| 光圈值 N | 焦距 f 與入瞳直徑 D 的比值 | 無因次 |\n\n[S01 pp.12–38]\n\n## 公式與關鍵推導\n**教材及算術補齊**：n bit 可表示 $2^n$ 個整數層級，無號範圍 $0\\ldots 2^n-1$。例如 2 bit 為 4 階、0–3；p.28 寫成 0–1，保留為 I01-01，不跟著照抄。[S01 pp.27–28]\n\n光圈與相對曝光：\n$$\nN=\\frac fD,\\qquad A\\propto D^2\\propto\\frac{1}{N^2},\\qquad E\\propto\\frac{t}{N^2}.\n$$\n前兩項依教材；最後一項是固定場景與透過率的補充比例式。光圈值乘 $\\sqrt2$，面積變半；同亮度需求可將曝光時間乘 2，但運動模糊風險改變。[S01 pp.33–35]\n\n教材 Gamma 形式為 $P'=P^\\gamma$。**補充定義**：此處先把 P 正規化到 [0,1]；若工具使用 $1/\\gamma$，亮暗方向相反，須看工具定義。Gamma 是輸出亮度映射，不能恢復已過曝遺失的資訊。[S01 pp.39–42]\n\n資料率：\n$$\nR=W H\\cdot\\mathrm{fps}\\cdot b\\quad(\\mathrm{bit/s}).\n$$\n12 MP、30 fps、每像素 8 bit 的單通道資料為 $2.88\\times10^9$ bit/s，即 360 MB/s（十進位）。**補充**：若傳輸的是三通道各 8 bit，需再乘 3；若傳 RAW Bayer，一個像素通常不是三個已解碼色彩值。還須考慮協定／封裝負擔與儲存速度。[S01 pp.75–82]\n\n## 案例與適用條件\n低光可延長快門或提高增益，但分別可能增加運動模糊或雜訊。白平衡、HDR 與 Gamma 是不同處理；高 ISO 不表示實際入射光子變多。教材的 ISO 與 Gain 對應只作該頁近似，不能把 ISO 100＝0 dB 當所有相機通則。[S01 pp.30–42；補充界線]\n\n滾動快門（Rolling Shutter）逐行讀出／曝光時序可使運動場景扭曲；全域快門改善同時性，但不是所有運動模糊與人工光源閃爍都會消失。[S01 pp.44,52–53,68–73；補充限制]\n\n## 常見誤解\n高位深不等於高空間解析度；高畫素不保證較小 GSD；更快 fps 不表示儲存一定來得及。廠商市占、價格、產品比較為課堂當時資訊，不作現況購買建議。[S01 pp.13,27,61–87]\n\n## 來源與相關頁\n[來源](../sources.md) · [感測器幾何](sensor-geometry.md) · [鏡頭與多波段](camera-optics.md) · [HW1 案例](../cases/hw1-camera.md)\n"}, {"path": "wiki/concepts/sensor-geometry.md", "title": "感測器幾何：GSD 與視場角", "body": "# 感測器幾何：GSD 與視場角\n\n## 概念、符號與條件\n地面取樣間距（Ground Sampling Distance, GSD）描述一個像素在物方對應的長度；視場角（Field of View, FOV）描述可見角度。以下採理想針孔、光軸垂直平面、平坦目標及忽略畸變的模型。[S01 pp.60–65]\n\n| 符號 | 定義 | 單位 |\n| --- | --- | --- |\n| H | 相機到目標平面垂直距離 | m |\n| f | 焦距 | mm |\n| s | 像元尺寸 | mm/pixel |\n| W,Hpx | 水平／垂直像素數（Hpx 與距離 H 區分） | pixel |\n| Sw,Sh | 感測器實體寬高 | mm |\n\n## 教材公式與補齊推導\n由相似三角形 $s/f=\\mathrm{GSD}/H$：\n$$\n\\mathrm{GSD}=\\frac{Hs}{f},\\qquad S_w=Ws,\\quad S_h=H_{px}s.\n$$\nH 用 m、s 和 f 都用 mm，結果即 m/pixel。[S01 pp.61,63–64]\n\n由中心到感測器邊界的直角三角形，半視角滿足 $\\tan(\\theta_w/2)=(S_w/2)/f$：\n$$\n\\theta_w=2\\tan^{-1}\\frac{S_w}{2f},\\qquad\n\\theta_h=2\\tan^{-1}\\frac{S_h}{2f}.\n$$\n**補充一致性驗算**：物方寬度 $L_w=2H\\tan(\\theta_w/2)=HS_w/f=W\\,\\mathrm{GSD}$。[S01 pp.61,65；代數補齊]\n\n## 教材算例\n6000×4000 pixel、s＝4 μm＝0.004 mm/pixel、f＝20 mm、H＝500 m：\n$$\nS_w=24\\ \\mathrm{mm},\\ S_h=16\\ \\mathrm{mm},\\quad\n\\mathrm{GSD}=500\\times0.004/20=0.1\\ \\mathrm{m/pixel}.\n$$\n水平 FOV 約 61.93°、垂直約 43.60°；教材取約 62°×44°。p.65 的中間水平半角印成約 30.86°，依 $\\arctan(12/20)$ 重算為約 30.96°；原近似不影響 62° 的最終整數，但在 I01-02 記錄。[S01 pp.63–65]\n\n## 適用限制與疑點\np.64 寫 $\\mathrm{GSD}_{oblique}=\\mathrm{GSD}_{nadir}/\\cos\\theta$，又寫「越外圍越小」，式與文字趨勢不一致。傾斜成像的局部 GSD 還須指定方向、地形與角度定義，這條簡式不直接當通用公式。本 Wiki 的互動只實作上方垂直平面模型。[S01 p.64；I01-02]\n\n感測器標稱「1/2 吋型」不是把英吋當普通長度換算；p.62 的 1.6 cm 是光學規格的歷史近似，實際尺寸應看廠商規格，不建立「1 inch＝1.6 cm」的單位規則。[S01 p.62；補充界線]\n\n## 常見誤解\n距離加倍，GSD 加倍但 FOV 不變；固定感測器與距離時，焦距加倍會使 GSD 減半、FOV 變小。較小 GSD 只是較細的取樣間距，不等於已證明量測準確度。\n\n## 來源與相關頁\n[互動：GSD 與視角](../../labs/index.md) · [來源](../sources.md) · [品質](sensing-quality.md) · [HW1](../cases/hw1-camera.md)\n"}, {"path": "wiki/concepts/spatial-rotation.md", "title": "空間旋轉：順序、方向與正交性", "body": "# 空間旋轉：順序、方向與正交性\n\n## 定義與符號\n教材以 ω（Omega）、φ（Phi）、κ（Kappa）表示繞 X、Y、Z 軸的角度。M 是物空間到像空間，R 是反向。列向量與右乘順序固定後，先做的矩陣在最右側；這裡是課堂的座標轉換慣例，不混用另一套 active rotation 的正號。[S05 pp.3–15]\n\n## 教材矩陣與推導\n依 pp.6–8 的分步矩陣：\n$$\nM_\\omega=\\begin{bmatrix}1&0&0\\\\0&\\cos\\omega&\\sin\\omega\\\\0&-\\sin\\omega&\\cos\\omega\\end{bmatrix},\\quad\nM_\\varphi=\\begin{bmatrix}\\cos\\varphi&0&-\\sin\\varphi\\\\0&1&0\\\\\\sin\\varphi&0&\\cos\\varphi\\end{bmatrix},\n$$\n$$\nM_\\kappa=\\begin{bmatrix}\\cos\\kappa&\\sin\\kappa&0\\\\-\\sin\\kappa&\\cos\\kappa&0\\\\0&0&1\\end{bmatrix}.\n$$\n$$\n\\mathbf X_1=M_\\omega\\mathbf X_0,\\quad\n\\mathbf X_2=M_\\varphi\\mathbf X_1,\\quad\n\\mathbf X_3=M_\\kappa\\mathbf X_2=M_\\kappa M_\\varphi M_\\omega\\mathbf X_0.\n$$\npp.9、11 的展開欄可與此乘積核對；p.9 上方 κ 子矩陣符號卻與 p.8／p.11 不一致，列 I05-01。互動採 pp.6–8 與 p.11 一致的定義。[S05 pp.5–13]\n\n## 反向與幾何條件\n各基本矩陣正交，所以 $M^TM=I$，且：\n$$\nR=M^{-1}=M^T=M_\\omega^TM_\\varphi^TM_\\kappa^T.\n$$\n矩陣元素無因次、點坐標可用 m 或 mm；輸入角在程式中需轉 radian。旋轉還須 $\\det M=+1$；只有正交性也可能包含鏡射。[S05 pp.10–13；det 條件補充]\n\n## 補充算例與常見誤解\nω＝φ＝κ＝0 時 M＝I；κ＝90° 時 (1,0,0) 變為 (0,−1,0)，這與本課被動軸向相符。一般 $M_\\kappa M_\\omega\\ne M_\\omega M_\\kappa$，交換順序不能只把角名互換。[S05 pp.4–13；自建驗算]\n\n## 應用與條件\nRoll／Pitch／Yaw 必須先指定載具軸與參考方向，再連到 ω／φ／κ。參考座標、角度順序、轉換方向與長度單位應隨參數一起保存。[S05 p.15；補充操作規則]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動旋轉與投影](../../labs/index.md) · [共線推導](collinearity.md) · [座標慣例](coordinate-systems.md)\n"}, {"path": "wiki/concepts/stereo-depth.md", "title": "雙目視差、深度與誤差傳播", "body": "# 雙目視差、深度與誤差傳播\n\n## 定義、符號與假設\n已去畸變並做核影像糾正（Stereo Rectification）的平行雙目系統，對應點在同一水平列。B 為相機中心間基線（m），f 為共同像素焦距（pixel），d＝uL−uR 為已處理主點差的視差（pixel），Z 為沿光軸深度（m）。[S07 pp.34–39]\n\n## 教材公式與推導補齊\n左中心設為原點，右中心在 (B,0,0)，相同虛擬像平面：\n$$\nu_L=fX/Z+c_x,\\qquad u_R=f(X-B)/Z+c_x.\n$$\n相減消去 X 與主點：\n$$\nd=u_L-u_R=\\frac{fB}{Z}\\quad\\Longrightarrow\\quad Z=\\frac{Bf}{d}.\n$$\n教材 p.37 的焦距與視差須用同一像方單位；若 f 用 mm、d 用 pixel，必須先乘像元尺寸換算，不能直接相除。[S07 pp.36–39；補充單位]\n\n## 誤差傳播\n對 d 微分：\n$$\n\\frac{\\partial Z}{\\partial d}=-\\frac{Bf}{d^2},\\qquad\n\\sigma_Z\\approx\\frac{Bf}{d^2}\\sigma_d=\\frac{Z^2}{Bf}\\sigma_d.\n$$\n此補充式固定 B、f 且只有小視差誤差；不是完整相機率定誤差模型。遠處視差小，深度誤差增加。若固定 Z、B 與 $\\sigma_d$，f 增大會降低此式誤差；教材 p.39 的焦距結論未說固定哪些量，因此列 I07-03 而不直接照用。[S07 pp.37–39；補充微分]\n\n## 自建算例\nB＝0.2 m、f＝1000 pixel、d＝40 pixel，Z＝5 m；若 $\\sigma_d=0.5$ pixel，線性近似 $\\sigma_Z=0.0625$ m。將 d 改為 20，Z＝10 m、$\\sigma_Z=0.25$ m。這是模型算例，不是雙目相機實測精度。\n\n## 糾正與匹配條件\n一般透視 H 不是仿射同義詞；每張圖用自己的糾正映射，使極線變成共同掃描列。仍需處理遮蔽、無紋理、重複紋理與出畫面區。d＝0 時無有限深度估計，負視差也要依基線／坐標定義判斷，不能顯示負距離作一般物理結論。[S07 pp.34–38；E05；I07-01]\n\n## 常見誤解與應用\n更長基線在固定匹配誤差模型下提高深度敏感度，但也可能降低共同視野或增加遮蔽，不是越長越好。短基線裝置的 3–10 m 是教材例，不是所有相機的有效範圍。[S07 pp.37,47–48；補充界線]\n\n## 來源與相關頁\n[來源](../sources.md) · [互動深度／誤差](../../labs/index.md) · [立體匹配](stereo-matching.md) · [HW4](../cases/hw4-stereo.md)\n"}, {"path": "wiki/concepts/stereo-matching.md", "title": "立體匹配、代價聚合與深度圖", "body": "# 立體匹配、代價聚合與深度圖\n\n## 定義與符號\n立體匹配為每個像素 p 在視差 d 範圍尋找對應，形成代價 $C(p,d)$。SGM（Semi-Global Matching）沿多方向路徑累積代價，兼顧局部影像資料與視差平滑。代價不必是公尺或 pixel，須依定義解讀。[S07 pp.50–53]\n\n## 教材流程與補充公式\n計算候選視差代價 → 多方向動態規劃聚合 → 選代價較小的視差 → 做有效性檢查 → 由視差換深度。[S07 pp.51–53]\n\n**補充概念式（非教材逐字公式）**：\n$$\nE(D)=\\sum_p C(p,D_p)+\\sum_{(p,q)}\\bigl(P_1[|D_p-D_q|=1]+P_2[|D_p-D_q|>1]\\bigr).\n$$\n方括號表示條件成立為 1，P1／P2 是相應代價懲罰，通常較大跳變有較高懲罰。這裡 P1／P2 與相機切向畸變係數完全不同。SGM 以多路徑近似聚合，不宣稱精確求出任意二維全局最優解。[S07 pp.51–53；E08 create 的 P1／P2 定義；補充抽象說明]\n\n## SGM／SGBM 與實作邊界\n課堂 HW4 使用 SGBM；不能因此假設某函式庫實作一定採 p.51 圖的 Mutual Information 代價。匯入時應記錄演算法、參數與視差儲存尺度。某些工具輸出定點視差，必須先依版本定義換成 pixel，才可代入深度公式。[S07 pp.51,54；E08 Detailed Description；補充操作條件]\n\n## 案例與常見誤解\n視差圖的亮暗／色盤不是通用距離色，需檢查色盤與有效遮罩。無效區不能填 0 後當成無限遠的可靠量測；平滑過程也可能抹去真實深度邊界。[S07 pp.38,51–54；補充判讀]\n\n## 來源與相關頁\n[來源](../sources.md) · [深度推導](stereo-depth.md) · [NCC](feature-matching.md) · [HW4](../cases/hw4-stereo.md)\n"}, {"path": "wiki/concepts/undistortion.md", "title": "影像修正、反算與重採樣", "body": "# 影像修正、反算與重採樣\n\n## 概念\n教材將「原始像點到無畸變像點」與反向映射分開說明。要先說明輸入／輸出，再談正算、反算或迭代；不同軟體的 forward / inverse 命名可能不同。[S02 pp.41–43]\n\n## 符號與方向\n| 本頁符號 | 意義 | 單位 |\n| --- | --- | --- |\n| $\\mathbf p_d$ | 含畸變的像點 | 指定影像座標單位 |\n| $\\mathbf p_u$ | 無畸變像點 | 同上 |\n| $\\mathbf c(\\mathbf p_d)$ | 在原始點評估的修正向量 | 同上 |\n| D | 外部模型的生成畸變映射 | 依其定義 |\n\n這組 d／u 符號為本 Wiki 新增，以免教材多個 P、P′、P″ 混淆，並非宣稱教材使用相同符號。\n\n## 教材原述與補充推導\n教材 p.42 把修正寫成「原始點加修正量」，本頁記為：\n$$\n\\mathbf p_u=\\mathbf p_d+\\mathbf c(\\mathbf p_d).\n$$\n要從無畸變點求原始點，代數移項可得：\n$$\n\\mathbf p_d=\\mathbf p_u-\\mathbf c(\\mathbf p_d),\\qquad\n\\mathbf p_d^{(n+1)}=\\mathbf p_u-\\mathbf c(\\mathbf p_d^{(n)}).\n$$\n**補充推導**：第二式是第一式的固定點迭代，不保證所有參數都收斂。p.43 的文字更新式採加號，與 p.42 的修正量是否重新定義，尚待確認；保留在 I02-03，不悄悄替教材更正。[S02 pp.42–43]\n\n若採 OpenCV「無畸變 → 含畸變」定義 $\\mathbf p_d=D(\\mathbf p_u)$，則求反方向才需要解反函數。**不能把上方修正量公式的方向直接搬過去。**[E01 Detailed Description；E02 Undistortion]\n\n## 點修正與整張影像不同\n像點轉換只計算座標；輸出整張校正影像還要決定每個輸出格點要從原始影像哪裡取樣，並做內插。此為影像重採樣的補充說明，完整重採樣推導見[第三章內插](interpolation.md)。[S02 pp.41–44；E02 Undistortion]\n\n## 假設與適用條件\n本頁迭代上限、容差必須在實作中明訂。係數不可用「改正負號」宣稱精確反轉；邊界裁切及新內參會影響修正後影像的座標解讀。[E02 Undistortion；補充限制]\n\n## 常見誤解\n對已修正影像再次套原始畸變模型，可能造成重複修正。率定、點座標修正與重採樣是不同步驟，保存資料時應標明影像版本。[S02 p.44；補充流程規則]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [畸變](distortion.md) · [疑點](../issues.md) · [HW2](../cases/hw2-calibration.md)\n"}, {"path": "wiki/glossary.md", "title": "術語與符號速查", "body": "# 術語與符號速查\n\n| 中文／英文 | 符號或縮寫 | 注意事項 | 來源 |\n| --- | --- | --- | --- |\n| 攝影測量 Photogrammetry | PM | 本課含物理影像單位與向後光軸慣例 | S02 pp.3,5,10 |\n| 電腦視覺 Computer Vision | CV | 本課 K 以 pixel 表示，光軸向前 | S02 pp.4,10,16 |\n| 相機率定 Camera Calibration | — | 求相機幾何與附加參數 | S02 pp.18,27–38 |\n| 像主點 Principal Point | PM 的 $(x_p,y_p)$；CV 的 $(c_x,c_y)$ | 與影像中心、攝影中心區分 | S02 pp.13,17–18 |\n| 像元尺寸 Pixel Size | $s,s_x,s_y$ | mm/pixel；不可與 skew 或齊次尺度混用 | S02 pp.12,15,18 |\n| 偏斜 Skew | $\\gamma$；表格亦有 s | 本 Wiki 各頁明訂符號 | S02 pp.15–18,37 |\n| 徑向畸變 Radial Distortion | $K_i$ 或 $k_i$ | 係數需連同單位及映射方向 | S02 pp.23,26 |\n| 偏心／切向畸變 Decentering / Tangential Distortion | $P_i$ 或 $p_i$ | 不直接視為同順序同定義 | S02 pp.24–27；E01 |\n| 自率光束法 Self-Calibration | — | 沿用課程分類，避免與其他文獻混稱 | S02 pp.30–37 |\n| 在任率定 On-the-job Calibration | — | 任務影像中估參 | S02 p.38 |\n| 重投影誤差 Reprojection Error | 本 Wiki 用 $\\Delta u,\\Delta v$ | RMSE 須聲明每點或每分量 | S02 p.35；補充 |\n\n[來源索引](sources.md) · [章節導覽](chapters/02-calibration.md)\n\n## 其餘章節術語\n| 中文／英文 | 定義與符號提醒 | 來源 |\n| --- | --- | --- |\n| 地面取樣間距 Ground Sampling Distance | GSD，物方長度／pixel | S01 pp.61–65 |\n| 視場角 Field of View | FOV，角度 | S01 pp.61,65 |\n| 相似／仿射／透視 Similarity / Affine / Projective | 4／6／8 自由度，條件不同 | S03 pp.7–18 |\n| 殘差 Residual | 先定義觀測減模型或反向 | S03 pp.29–32 |\n| 描述子 Descriptor | 編碼局部特徵，不是坐標本身 | S04 pp.41–47 |\n| 隨機抽樣一致 Random Sample Consensus | RANSAC，在指定模型／門檻下選一致點 | S04 p.50 |\n| 共線條件 Collinearity | 物點、攝影中心與理想像點共線 | S05 pp.18–24 |\n| 前方／後方交會 Intersection / Resection | 求物點／求相機，條件不同 | S05 pp.26–28 |\n| 基本／本質矩陣 Fundamental / Essential | F 作用於像素，E 作用於正規化射線 | S07 pp.8,17–24 |\n| 核影像糾正 Stereo Rectification | 同名點到共同掃描列 | S07 pp.34–38 |\n| 視差 Disparity | d，像方單位須與 f 一致 | S07 pp.36–39 |\n| 半全局匹配 Semi-Global Matching | SGM，多路徑聚合的近似方法 | S07 pp.51–53 |\n"}, {"path": "wiki/index.md", "title": "影像感測與 3D 場景重建", "body": "# 影像感測與 3D 場景重建\n\n七份課堂教材的個人複習 Wiki：**7／7 份已匯入，共 437 張投影片的去向對照**。保留關鍵推導、案例、來源與待查項；不把資料缺漏或模型算例當成實測成果。初學者教學 HTML 簡報仍為後續任務。\n\n## 先動手理解\n[開啟互動學習實驗室](../labs/index.md)：GSD／FOV、徑向畸變、平面轉換、雙線性內插、比率測試／RANSAC、匹配指標、旋轉與投影、點到極線、雙目深度／誤差。九個模組均可調參、重設並回到公式來源。\n\n## 依課程章節複習\n| 章節 | 學習問題 |\n| --- | --- |\n| [01 影像感測器](chapters/01-sensors.md) | 成像品質、解析度、曝光與感測幾何 |\n| [02 相機率定](chapters/02-calibration.md) | 座標、內參、畸變與率定 |\n| [03 平面影像轉換](chapters/03-planar.md) | 模型、參數估計與內插 |\n| [04 影像匹配](chapters/04-matching.md) | 偵測、描述、配對與幾何驗證 |\n| [05 空間轉換與共線條件式](chapters/05-collinearity.md) | 旋轉、投影、交會與平差 |\n| [06 影像匹配之應用](chapters/06-applications.md) | 多光譜、拼接、學習式匹配與定位 |\n| [07 核幾何](chapters/07-epipolar.md) | F／E、視差、深度與立體匹配 |\n\n## 依概念查詢\n**成像與相機**：[品質／曝光](concepts/sensing-quality.md)、[GSD／FOV](concepts/sensor-geometry.md)、[鏡頭／多波段](concepts/camera-optics.md)、[座標](concepts/coordinate-systems.md)、[內參](concepts/intrinsics.md)、[畸變](concepts/distortion.md)、[率定方法](concepts/calibration-methods.md)、[棋盤格](concepts/checkerboard.md)、[修正](concepts/undistortion.md)。\n\n**對位與匹配**：[平面模型](concepts/planar-transforms.md)、[最小二乘](concepts/least-squares.md)、[內插](concepts/interpolation.md)、[偵測](concepts/feature-detection.md)、[NCC／描述子](concepts/feature-matching.md)、[RANSAC](concepts/robust-estimation.md)、[指標](concepts/matching-metrics.md)、[多光譜套合](concepts/multispectral-registration.md)、[學習式匹配](concepts/learned-matching.md)。\n\n**三維重建**：[旋轉](concepts/spatial-rotation.md)、[共線／DLT](concepts/collinearity.md)、[交會／方位／平差](concepts/orientation-adjustment.md)、[核幾何 F](concepts/epipolar-geometry.md)、[E／SVD](concepts/essential-decomposition.md)、[雙目深度](concepts/stereo-depth.md)、[立體匹配](concepts/stereo-matching.md)。\n\n## 案例與作業導引\n[HW1 取像](cases/hw1-camera.md) · [主點算例](cases/principal-point.md) · [HW2 率定](cases/hw2-calibration.md) · [HW3 拼接](cases/hw3-stitching.md) · [SfM](cases/sfm-pipeline.md) · [陣列拼接](cases/multi-camera-stitch.md) · [UAV 地理對位](cases/geographic-registration.md) · [工程量測](cases/engineering-measurement.md) · [HW4 立體點雲](cases/hw4-stereo.md)。\n\n## 來源、流程與真實紀錄\n[術語](glossary.md) · [來源索引](sources.md) · [疑點台帳](issues.md) · [流程 Graph](../workflow/graph.md) · [本次六章匯入與互動驗收](../reports/course-import.md) · [初次試做歷史紀錄](../reports/pilot-02.md) · [日誌](log.md)。\n\n## 初學者教學簡報\n[開啟七章 HTML 簡報首頁](../slides/index.html)：依第 01～07 章選課，進入各章互動教學。另有[課程總覽與作業流程](../slides/overview.html)，保留來源對應、Loop／Graph、實際檢查與反思。[七章驗收](../reports/chapters-check.md)。\n"}, {"path": "wiki/issues.md", "title": "疑點台帳", "body": "# 疑點台帳\n\n本頁區分原始教材內容、查核與尚未確認事項。**待查不等於已判定教材錯誤；未解項不作簡報定論。**\n\n## I02-01 切向平方項與係數慣例\n- 教材原述：p.25、31、42 以 $P_1(r^2+\\bar x^2)$ 與 $P_2(r^2+\\bar y^2)$ 為平方項，已回看原頁確認不是文字擷取遺失。\n- 查核：E01 的 OpenCV 模型平方項含 2，且 p1／p2 排列不同；只比較式子不能斷言兩套係數可直接換算。\n- 處置：保留原式，外部模型分開列，禁止直接實作教材式。\n- 狀態：**待授課者確認公式或提供模型定義**。來源 [S02 pp.25,31,42；E01]。\n\n## I02-02 主點與攝影中心用語\n- 教材原述：p.13 同時使用「像主點為相片投影中心」及「光軸與影像平面的交點」。\n- 查核：課堂 p.9 的攝影中心在三維相機原點；p.18 的主點在像平面。兩者不能當成同一個空間位置。\n- 處置：正文分開解釋，保留原述在此。\n- 狀態：**內部定義已釐清，原句仍需用語確認**。[S02 pp.9,13,18]\n\n## I02-03 修正量的正反向\n- 教材原述：p.42 由原始點加修正量取得無畸變點；p.43 反向迭代文字仍以加號表示。p.31 則在共線模型右側加附加參數。\n- 查核：若固定 p.42 的修正向量定義，反向代數移項為減號；p.43 是否另採反方向的位移尚未明示。\n- 處置：以 d／u 明確定義補充推導，教材原句保留，不宣稱原式已修正或已驗證收斂。\n- 狀態：**待確認各頁修正量定義**。[S02 pp.26,31,41–43]\n\n## I02-04 精度比較的單位層次\n- 教材原述：p.37 將 PM 的毫米級與 CV 的像素級並列。\n- 處置：保留作課程取向比較；不把物方長度與像方殘差直接比大小。缺少距離、幾何、資料與統計定義，不能據此推算量測能力。\n- 狀態：**已加適用限制，沒有實測資料可重現**。[S02 pp.32,37]\n\n## I02-05 圖表無可重現數據\n- 教材原述：pp.39–40 有變焦設定與畸變曲線圖。\n- 處置：只保留定性關聯，未從縮圖估填係數或誤差；若要數值分析需取得原始圖表資料。\n- 狀態：**資料不足，數值分析暫停**。[S02 pp.39–40]\n\n## 本次修正的擷取問題（非教材錯誤）\n第一次只讀 DrawingML 的文字節點，p.16 的 K 與許多公式未完整出現。改用 PowerPoint 匯出第 02 章全部 44 頁，逐頁對照，公式重點頁再放大看。這個擷取錯誤已修正；不能將「程式成功讀取 PPT」視為公式完整。\n\n[來源索引](sources.md) · [檢查報告](../reports/pilot-02.md)\n\n## I01-01 位深範圍（已算術查核）\nS01 p.28 原述「2 bit (0–1)」，與 p.27 的 $2^n$ 層級不一致。2 bit 應為 0–3 四階；正文保留查核結果，原述留此。[S01 pp.27–28]\n\n## I01-02 GSD 趨勢與水平半角（部分查核、傾斜模型待查）\nS01 p.64 的除 cos 公式與「越外圍越小」趨勢不一致，傾斜情況需先定義量測方向／平面。p.65 水平半角重算約 30.96°，原頁約 30.86°；完整 FOV 約 61.93°，最終四捨五入 62°仍成立。互動僅採垂直平面模型。[S01 pp.64–65]\n\n## I01-03 切向畸變跨章不同（待授課者確認）\nS01 p.50 與 S05 p.23 的平方項含 2；S02 p.25、31、42 未含 2。原頁皆已核對，這增加了 I02-01 的跨章證據；不只靠符號名稱強行認定等價。[S01 p.50；S02 pp.25,31,42；S05 p.23]\n\n## I01-04 魚眼名稱與規格單位（用語待查）\nS01 p.91 將 Stereographic 中文列為「等面積」，但同列又強調保持角度；正文保留英文與函數，中文名稱暫不作定論。p.62 的「吋約 1.6 cm」只保留光學尺寸規格語境，不當長度換算。[S01 pp.62,91]\n\n## I03-01 平面定義與旋轉方向（已加邊界）\np.3 寫不涉及透視變化，但 pp.14–15 納入 Homography；概念頁以涵蓋透視的平面映射整理。p.5 為軸旋轉、p.7 為點變換，矩陣方向相反，均保留其語境。[S03 pp.3,5,7,14–15；E04]\n\n## I03-02 殘差符號與精度分母（已加一致推導）\np.29 的 L=AX+V 與後文 V=AX−L 有整體變號差；p.30 導數的負號與所列目標函數不一致，但零點不變。正文指定殘差並重推；p.30／32 的自由度校正尺度不與每點二維 RMSE 混稱。[S03 pp.29–32]\n\n## I04-01 Canny 的比較方向（已加語境）\nS04 p.21 描述保留梯度方向極大，p.23 文字稱沿邊緣方向；梯度法向與邊緣切向不同，正文不把兩句當相同方向。若要實作需依梯度方向定義。[S04 pp.21,23]\n\n## I06-01 MR 算術（已查核）\n原頁 $2\\times6/(13+15)=66\\%$，依該式為 42.857…%；DR＝33.333…%、CR＝75% 正確。指標頁與互動採明示公式計算，不隱藏原頁差異。[S06 p.16]\n\n## I06-02 學習式模型名稱與 cell 敘述（部分官方查核）\np.42 標題 LightGlue、圖／內文 SuperGlue；pp.50–58 是 SuperGlue 的 attention／dustbin／Sinkhorn，而 p.59 參數列 LightGlue。兩模型經官方專案核對為不同方法，不混用名稱。pp.45–46「每 cell 最多一點」與 H×W 分數圖的敘述亦需補最終取點規則，未把此句當通用定理。[S06 pp.42–59；E06／E07]\n\n## I06-03 地理對位分母及概括敘述（待資料／定義）\np.59 的 384＋472＝856 與 868 未解算並列，但整體母體語意不完整，不據此報無條件的全體成功率。p.68「有匹配點就能反算」補上點數、幾何、參數及正確性條件。[S06 pp.59,68]\n\n## I05-01 κ 子矩陣的符號（原頁差異已確認）\nS05 p.9 上方 κ 子矩陣與 p.8／p.11 展開式的正負不同；正文／互動以 pp.6–8 基本矩陣及 p.11 展開一致的方向組合。原頁不修改，差異保留待授課者確認。[S05 pp.6–11]\n\n## I05-02 相對方位的冗餘門檻（已計數查核）\np.58 推出 4n=3n+5，但寫 n>6 時需平差。依該計數，n>5 就有冗餘；實際可解性還依幾何與約束。p.27 的三控制點也只是方程計數，不能保證非線性解唯一。[S05 pp.27,58]\n\n## I07-01 Homography 與 Affine（跨章已釐清）\np.35 將透視變換括註為「即仿射變換」，與 S03 pp.10–18 的不同模型不一致。正文將仿射視為透視的特例，不混用名稱。[S07 p.35；S03 pp.10–18；E04]\n\n## I07-02 外積反解與奇異值解釋（已代數查核）\np.26 把固定 t 的外積反解描述成圓；一般核空間推導給 x0+αt 的直線族。p.27 說外積不改變向量長度亦需限制：t×v 的長度為 |t||v|sinθ。正文以反對稱矩陣乘積推導 (|t|,|t|,0) 奇異值，保留原述差異。[S07 pp.26–27]\n\n## I07-03 焦距與深度誤差（固定量未明，保留界線）\np.39 說焦距長造成較大深度誤差；若固定 Z、B、像素視差誤差，σZ≈Z²σd/(Bf) 反而隨 f 增加而下降。兩說可能固定的成像配置不同，不能不加條件通用化。互動明示固定量。[S07 pp.37–39]\n"}, {"path": "wiki/log.md", "title": "更新日誌", "body": "# 更新日誌\n\n## 2026-11-22：第 02 章試做\n- 使用者完成十項需求選擇並確認需求摘要，授權建立專案與推送指定 GitHub。\n- 正式匯入 S02，44 張投影片；其他來源僅登錄與建立待匯入導覽。\n- 建立六個概念頁、兩個案例頁、術語、六張證據卡與疑點台帳。\n- 發現公式擷取不完整，改以 PowerPoint 匯出全章原頁核對；檢查前移到證據卡之前。\n- 查閱 OpenCV 官方文件與 Zhang 官方報告，補充內容另標，不混成課堂原述。\n- 產生離線 HTML 閱讀器與檢查腳本；確切執行結果見 reports/。\n- 待使用者確認形式後，才進行其餘六章的分批匯入。\n\n## 2026-11-22：GitHub Pages\n- 使用者追加要求部署既有 HTML。Pages 設定為 main 分支根目錄，README 加入線上閱讀連結。\n- 教材匯入仍停在第 02 章試做，未擴大其他章節範圍。\n\n## 第二階段批次一：S01／S03\n已整理感測品質、GSD／FOV、鏡頭、多種平面模型、最小二乘與內插，新增 HW1／HW3 案例及逐頁對照。互動入口於同階段整合後驗收。\n\n## 第二階段批次二：S04／S06\n新增偵測、NCC／描述子、RANSAC、匹配指標、N-SURF／EPT 與學習式匹配；整理 SfM、陣列拼接及地理對位案例。保留 MR 算術、模型名稱及計數母體疑點。\n\n## 第二階段批次三：S05／S07\n新增空間旋轉、共線／DLT、交會與平差、核幾何、E／SVD、雙目深度／誤差及立體匹配；整理工程量測及 HW4 案例。七份教材皆完成正式整理，無原始實測資料者仍明示缺漏。\n\n## 第二階段互動整合\n九個互動模型與控制介面已建立；數值測試包含已知 GSD、MR 更正、旋轉方向／正交性、極線約束及零分母。桌面、手機與部署驗收結果另記本次報告。\n\n## 第三階段：初學者 HTML 簡報（2026-11-22）\n使用 Wiki 建立 22 頁初學者 HTML 簡報，內嵌五個互動、來源映射、測驗、工作流程與反思；另存本次簡報檢查紀錄。\n## 簡報介面修訂\n依使用者範例簡化為筆記風與底部翻頁，收合次要工具和來源；保留 22 頁內容與五個互動。[本次介面驗收](../reports/interface-check.md)。\n\n## 七章教學入口改版\n依使用者截圖改為七章卡片首頁，各章獨立 8–9 頁、共 58 頁，對應九個互動；原總覽移至 overview.html。[驗收](../reports/chapters-check.md)。\n\n## 根網址入口修正\n依使用者要求，根網址直接顯示七章卡片；完整 Wiki 移至 wiki.html，簡報來源連結同步調整，舊 #p= 連結保留轉向。\n\n## 繳交入口說明（2026-11-23）\nREADME 改依老師六項要求排列，區分 Wiki、教學簡報、製作流程、目前檢查與歷史紀錄；每個入口補上用途及作業項目對應。\n"}, {"path": "wiki/sources.md", "title": "來源索引", "body": "# 來源索引\n\n## 課堂教材\n作者：詹鈞評，國立臺灣科技大學人工智慧跨域科技研究所。頁碼一律採 PowerPoint 實體投影片順序，含封面，不依擷取文字中的頁碼推算。\n\n| ID | 教材 | 頁數 | 狀態 |\n| --- | --- | --- | --- |\n| S01 | 01 影像感測器 | 104 | 已匯入 |\n| S02 | 02 相機率定 | 44 | 試做形式已確認，已匯入 |\n| S03 | 03 平面影像轉換 | 54 | 已匯入 |\n| S04 | 04 影像匹配 | 52 | 已匯入 |\n| S05 | 05 空間轉換與共線條件式 | 61 | 已匯入 |\n| S06 | 06 影像匹配之應用 | 68 | 已匯入 |\n| S07 | 07 核幾何 | 54 | 已匯入 |\n\n原始檔名與七份來源 SHA-256見 [catalog.json](../sources/catalog.json)，全七章逐頁去向見 [coverage.json](../sources/coverage.json)。未公開原始教材，本頁不提供假裝可下載的連結。\n\n## 外部查核（僅輔助，不取代教材）\n- **E01**：[OpenCV 4.13.0 幾何模組](https://docs.opencv.org/4.13.0/d9/d0c/group__calib3d.html)，Detailed Description。核對 normalized coordinates、K 與畸變參數慣例。\n- **E02**：[OpenCV 4.13.0 率定教學](https://docs.opencv.org/4.13.0/dc/dbb/tutorial_py_calibration.html)，Basics、Code、Re-projection Error。核對角點、影像修正與重投影概念。\n- **E03**：[Zhang 原始技術報告](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/tr98-71.pdf)，§2.2–2.3、§3.1–3.3。核對平面單應性、旋轉正交約束及非線性最佳化。課堂 p.35 引用的是 Zhang (2000)，此處連到作者官方技術報告版本，版本不可混稱。\n\n以上查閱日均為 2026-11-22。每頁以 E01／E02／E03 標記外部補充；算例另註來源或自建。\n\n## 第二階段外部查核\n- **E04**：[OpenCV Homography](https://docs.opencv.org/4.13.0/d9/dab/tutorial_homography.html)，Basic theory：平面映射、八自由度與適用情境。查閱日 2026-11-22。\n\n- **E06**：[LightGlue 官方專案](https://github.com/cvg/LightGlue)，README 的 adaptive depth／width 與 feature matching 定義。\n- **E07**：[SuperGlue 官方專案](https://github.com/magicleap/SuperGluePretrainedNetwork)，README 的模型角色與 graph／optimal matching。查閱日 2026-11-22。\n\n- **E05**：[OpenCV Epipolar Geometry](https://docs.opencv.org/4.13.0/da/de9/tutorial_py_epipolar_geometry.html)，Basic concepts／Code：點到極線、F／E 角色與八點法語境。查閱日 2026-11-22。\n\n- **E08**：[OpenCV StereoSGBM](https://docs.opencv.org/4.13.0/d2/d85/classcv_1_1StereoSGBM.html)，Detailed Description／create：P1、P2、修改型代價與視差尺度。查閱日 2026-11-22。\n"}, {"path": "workflow/graph.md", "title": "匯入與產出流程", "body": "# 匯入與產出流程\n\n## 本次已執行的 Graph\n```mermaid\nflowchart TD\n  A[已確認需求] --> B[來源登錄與文字定位]\n  B --> C{原頁與公式完整檢查}\n  C -->|缺字或定義不明| B2[回看原頁／記錄疑點]\n  B2 --> C\n  C -->|可整理| D[單來源證據卡]\n  D --> E[章節與概念頁]\n  E --> F{來源／算術／一致性檢查}\n  F -->|證據錯| D\n  F -->|單頁內容錯| E\n  F -->|通過或已隔離待查| G[生成 HTML]\n  G --> H{公式／導航／版面檢查}\n  H -->|呈現錯| G\n  H --> I[報告與 GitHub 試做]\n  I --> J[使用者確認整理方式]\n```\n\nHTML 閱讀器將 Mermaid 保留為可讀流程原碼；本頁下方文字是等價的離線說明，GitHub 可渲染圖。\n\n文字流程：需求 → 來源登錄 → 原頁／公式關卡 → 證據卡 → 概念頁 → 內容檢查 → HTML → 呈現檢查 → 上傳 → 使用者檢視。缺字就回原頁，主張錯回證據卡，版面錯只修呈現層；未解問題列入台帳並排除肯定結論。\n\n## 每個節點的輸入與輸出\n| 節點 | 輸入 | 輸出 | 檢查 |\n| --- | --- | --- | --- |\n| 登錄 | 原始 PPT | sources/catalog.json | 檔名、頁數、雜湊 |\n| 擷取與原頁核對 | PPT 文字與本機匯出圖 | coverage.json | 全頁覆蓋、公式方向與單位 |\n| 證據卡 | 單份教材與頁碼 | evidence/ | 是否支持主張、疑點分離 |\n| Wiki | 證據卡與明示補充 | wiki/ | 頁碼、符號、數值及跨頁一致性 |\n| HTML | Markdown | index.html 與 site-data.json | 來源內容不被呈現層改寫 |\n| 驗收 | HTML、Wiki 與來源 | reports/ | 自動檢查＋瀏覽器操作＋人工原頁核對 |\n\n## Loop、停止與設計理由\n每個節點最多修 3 輪，只修報告列出的問題；來源缺漏／定義不清先隔離該項，不反覆重寫整份。小圈修正讓錯誤靠近來源被發現，也避免排版階段改動已核對內容。這是檔案與腳本構成的 workflow prototype，尚非獨立排程的全自動代理系統。\n\n## 簡報 Graph（規劃歷史，實際結果見第三階段）\n查詢 Wiki → 證據覆蓋率 → 教學大綱與人工確認 → 逐頁稿 → 忠實度 → HTML 簡報 → 渲染。教材／Wiki 有待查事項時，不把它轉成無保留結論。簡報頁數與詳細教學目標留待下一階段討論。\n\n[本次結果](../reports/pilot-02.md) · [工作 SOP](../SKILL.md)\n\n## 第二階段：已執行的批次與互動節點\n批次一 S01／S03 → 結構／引用／公式語法檢查 → commit；批次二 S04／S06 → 同樣檢查 → commit；批次三 S05／S07 → 同樣檢查 → commit。各批保留原始檢查快照，不用最終成功結果覆蓋歷史。\n\n互動新增路線：通過查核的公式 → 純數值模型 → 已知值／幾何不變量與退化測試 → UI 控制與圖形 → 桌面／手機操作 → GitHub Pages。算式錯退回數值模型；狀態或排版錯只修 UI。瀏覽器中的示例永遠標為模型示意，不加入實驗成果表。[本次紀錄](../reports/course-import.md)\n\n## 第三階段：初學者 HTML 簡報（2026-11-22）\n已執行：查詢 Wiki → 核對來源與假設 → 22 頁稿 → HTML／共用互動 → 數值與公式檢查 → 桌面／手機驗收 → GitHub Pages。來源錯退回證據，敘述錯退回頁稿，版面錯只修 HTML／CSS。[本次實際檢查與修正](../reports/slides-check.md)。\n"}, {"path": "reports/chapters-check.md", "title": "七章簡報與卡片首頁：實際驗收", "body": "# 七章簡報與卡片首頁：實際驗收\n\n## 本次需求與交付\n使用者希望開啟 HTML 網址後直接選第一到第七章，點選才進入簡潔翻頁畫面。現在 slides/index.html 是七章卡片首頁；每章獨立為 chapter-01.html～chapter-07.html，各 8、8、9、8、8、8、9 頁，合計 58 頁，涵蓋各章入門概念、關鍵公式、案例與互動。原 22 頁「兩張照片，如何變成 3D？」及 Loop／Graph、實際紀錄與反思保存在 overview.html，於首頁頁尾提供入口。\n\n七章是教學重組，不是逐張複製教材；完整推導與教材頁碼透過每頁「來源與延伸」連回 Wiki。章節資料保存在 slides/chapters/01.json～07.json，由 scripts/build_slides.py 統一生成；原頁碼使用 S01～S07 實體投影片順序。\n\n## 知識與內容檢查\n本次沿用已匯入 Wiki，而非重新猜補原始公式。新增重點包括第 03 章模型／最小二乘／內插，第 05 章 PM 共線推導與工程案例，第 06 章指標分母與算術查核，第 07 章 E 的座標、尺度及無效視差。PM／CV 分開標示；自建算例不稱為新實測，未解教材疑點不轉成確定結論。\n\n初次生成時 Python 字串中的 TeX 跳脫有風險，改用 raw 字串重新生成，並將控制字元檢查加入 check_slides.cjs，提前在語法關卡檢查，避免把錯誤公式帶進瀏覽器。\n\n## 本次實際驗收\n- 首頁：七張卡片逐一點入並返回，均到達對應章節，沒有把七張卡片連到同一份內容。\n- 桌面 1440×1000：七章共 58 頁逐頁切換，無整頁水平溢出或公式渲染錯誤；此尺寸七張卡片同時可見。\n- 手機 390×844：七章共 58 頁逐頁切換，無整頁水平溢出或公式渲染錯誤；首頁單欄，允許垂直捲動。\n- 九個分章互動：GSD、畸變、平面模型、雙線性內插、RANSAC、旋轉、MR／DR／CR、極線、深度，均調整滑桿並確認輸出變化，重設恢復。平面模型透過矩陣輸出核對變化。\n- 瀏覽器錯誤紀錄為空。共用來源與模型限制保持可展開入口。\n- 自動檢查涵蓋七章加原總覽：8 份簡報、80 頁、20 組公式語法、101 個來源目標皆通過，14 個互動嵌入位置（含總覽重用）已登錄。這與本次分章瀏覽器驗收的 58 頁範圍分開計數。\n\n## 反思與界線\n上一版雖有選單，讀者仍需先理解網站結構才知道該學什麼。本次把「先選章，再學習」設為固定路徑，主畫面只列七個學習入口，工具與查證留在進入章節後。首頁的資訊架構檢查加入「卡片是否直達對應內容」與「是否能一步返回」。\n\n此為同一編寫代理進行 Wiki 對照、語法／結構與瀏覽器驗證，沒有新實拍重建、教師核定或獨立 AI 語意審查。列印樣式沿用，未另外交付經逐頁校對的 PDF。原有 reports/slides-check.md、interface-check.md 為先前版本歷史紀錄；本報告記錄七章改版。\n## 根網址入口驗收\n根 index.html 改為七章卡片首頁，完整 Wiki 保存在 wiki.html。已在本機瀏覽器確認：根首頁有七張卡片，第一章可開啟；簡報來源指向 wiki.html#p=；舊根網址 #p= 會轉入對應 Wiki 概念頁；首頁「完整 Wiki」能開啟 Wiki。建置分工同步調整，避免下次 build.py 把根首頁覆蓋成閱讀器。\n"}, {"path": "reports/course-import.md", "title": "六章匯入與互動學習實際紀錄", "body": "# 六章匯入與互動學習實際紀錄\n\n## 範圍與來源\n在使用者確認第 02 章架構後，正式分三批匯入其餘六份教材。七份共 437 張投影片，逐頁登錄去向、檔案指紋與處置。所有原始投影片／文字擷取留在本機，公開成果為重新整理筆記與原創模型圖。\n\n## 批次結果\n| 批次 | 教材 | 主要產物 | 當時檢查 |\n| --- | --- | --- | --- |\n| 1 | S01／S03 | 成像、GSD／FOV、鏡頭、平面模型、最小二乘、內插、HW1／HW3 | [結構快照](batch-01-checks.json)、[163 組公式](batch-01-math.json) |\n| 2 | S04／S06 | 偵測／描述、RANSAC、指標、多光譜／學習式匹配、SfM／定位案例 | [結構快照](batch-02-checks.json)、[189 組公式](batch-02-math.json) |\n| 3 | S05／S07 | 旋轉／共線／交會、F／E／SVD、深度／立體匹配、工程／HW4 | [結構快照](batch-03-checks.json)、[243 組公式](batch-03-math.json) |\n\n這些是當時累計檢查量，不是每批新增公式量；補充標記及後續編修可能改變最終計數。\n\n## 來源核對與發現\n本次匯出六章全部 393 張原頁，逐頁以縮圖配合全文閱讀，公式重點頁另看完整尺寸；與前次 S02 的 44 頁合計 437。檢查不是只讀檔名或把一頁對應檔案當成理解證明。\n\n發現並保留：位深算例、GSD 趨勢／半角、跨章切向項、殘差符號／RMSE 分母、匹配率算術、LightGlue／SuperGlue 名稱、旋轉子矩陣符號、相對方位冗餘計數、外積反解與焦距誤差的固定量。完整原述與處置見[疑點台帳](../wiki/issues.md)。尚需授課者或原始數據確認的項目不作定論。\n\n## 互動數值驗證\n九模組的純模型數值測試包含：教材 GSD／MR、內插角點／常數不變、RANSAC 已知值、旋轉正交／方向、生成點的極線約束、深度與誤差比例，以及零視差、零分母、無效計數、跨投影無窮遠等。結果見 [lab-checks.json](lab-checks.json)。模型測試不是新實測率定，也不代表來源所有主張已被自動證明。\n\n## 最終檢查與部署\n結構與引用：[checks.json](checks.json)；公式語法：[math-check.json](math-check.json)。本次瀏覽器檢查：桌面 1440×1000 全部 102 頁、手機 390×844 的 51 個章節／概念／案例／互動頁，皆無頁面橫向溢出或公式渲染錯誤。九模組均操作參數並驗證重設；平面模型另確認矩陣隨參數更新。零視差與退化單應性顯示提示，手機導覽及「視差」全文搜尋正常，瀏覽器錯誤紀錄為空。詳見 [本次瀏覽器紀錄](course-browser-check.json)。公開版本由 GitHub Pages 發布；部署成功狀態及網址另於交付時確認。舊 [browser-check.json](browser-check.json) 是初次試做記錄，不冒充本次結果。\n\n## 反思與 Graph 調整\n本次主要內容風險是「同名符號跨章定義不同」與「示例省略固定條件」。因此在證據卡之前先做原頁公式／方向核對，在跨章整理時加符號與條件對照，再讓互動程式只使用已明確定義的模型。\n\n互動另增加退化測試關卡：公式語法能通過，仍可能在 d＝0、描述子分母＝0 或投影分母跨零時產生誤導結果。檢查前移到純模型，UI 顯示例外，不等到部署後看到無限大或空白才回頭改。\n\n## 驗證界線\n同一編寫代理進行來源對照，未取得授課者核定或新的獨立 AI 語意審查。教材圖表沒有原始資料者不重造數據；所有 HW 節點是方法／缺漏整理，沒有執行這門課的實拍作業。教學 HTML 簡報仍待後續討論，Wiki 及互動入口不冒充簡報。\n"}, {"path": "reports/interface-check.md", "title": "簡報介面簡化：實際驗收", "body": "# 簡報介面簡化：實際驗收\n\n## 需求與參考\n依使用者提供的 [DiveAI 講義庫](https://diveai-lab.github.io/diveai-lessons/) 與其入門簡報檢視版面，採用暖白點陣、藍綠標題、柔和筆記風與底部翻頁的設計方向，自行實作樣式；未使用範例的標誌、角色圖片或教學文字。\n\n## 修改\n22 頁教學內容與五個共用互動保留。選頁、閱讀全部、列印與回 Wiki 收進選單；新增底部圓點快速選頁與目前頁狀態。來源改為每頁可展開的「來源與延伸」，模型條件亦保留可展開入口。修正進入帶頁碼網址時的初始捲動，工具列保持可見。\n\n## 本次實際檢查\n- 桌面 1440×1000、手機 390×844，各逐頁操作底部圓點 22 頁：無整頁水平溢出、無公式渲染錯誤；桌面每次只有一個目前頁圓點。\n- 選單選頁正常，選完自動收合；來源可展開且顯示正確 Wiki 來源標籤。\n- GSD、畸變、匹配、極線、深度五模組，各操作滑桿確認結果變化，再重設確認恢復。\n- d＝0 顯示沒有有限深度提示；閱讀全部顯示 22 頁，再可切回單頁；瀏覽器錯誤紀錄為空。\n- 既有逐頁來源／公式檢查再次執行。此次未改數值模型或教學敘述，不將介面檢查當成新的實拍實驗或獨立語意審查。\n\n## 設計反思\n上一版把選頁、閱讀與列印都攤在上方，主畫面操作過多。現在將次要操作收進選單，閱讀時集中看內容與底部翻頁；來源採展開方式而非移除，讓入門閱讀與查證都保有入口。手機允許垂直閱讀，互動圖可在自身區塊內水平捲動。\n"}, {"path": "reports/pilot-02.md", "title": "第 02 章實際執行與檢查紀錄", "body": "# 第 02 章實際執行與檢查紀錄\n\n## 執行範圍\n2026-11-22（Asia/Taipei）。正式 ingest 1 份課堂教材 S02，共 44 頁；其餘六份只作來源登錄。產物包含六個概念頁、兩個案例、六張證據卡與 HTML 閱讀器。未執行 HW2 實拍或率定，未製作最終教學簡報。\n\n## 已觀察到的問題與修正\n| 輪次 | 問題 | 處理 | 結果 |\n| --- | --- | --- | --- |\n| 來源閱讀第 1 輪 | 只讀 DrawingML 文字，K 矩陣與多個公式缺字 | 匯出 S02 全部 44 頁，逐頁看圖，重點公式頁放大核對 | 擷取限制已補救，不能只靠文字生成 |\n| 內容整理第 1 輪 | p.25／31／42 切向項與外部慣例不同 | 保留教材原式，外部模型另列 | 未解定義隔離於 I02-01 |\n| 內容整理第 1 輪 | 修正方向、主點用語與精度單位有歧義 | 明定輸入輸出與座標，建立 I02-02～04 | 不將未確認敘述當定論 |\n\n## 建置與介面修正紀錄\n- 初次結構檢查在 HTML 與檢查報告尚未產生前執行，發現 4 個尚不存在的產物連結；原始失敗輸出保存為 [checks-initial.json](checks-initial.json)。完成產物後重跑，不刪除失敗紀錄。\n- Node 在網路共享路徑向上尋找 package.json 時失敗；加入專案自己的 CommonJS package.json，公式檢查即可執行。\n- 搜尋測試發現首頁匹配時未列入結果，已修正；並修正跳至正文連結，避免誤觸首頁路由。\n\n## 自動檢查\n真實執行結果由 [checks.json](checks.json) 保存：來源頁碼、章節覆蓋、Markdown 連結、引用、數值 round-trip、RMSE 定義與固定點算例。數學語法結果見 [math-check.json](math-check.json)，瀏覽器檢查見 [browser-check.json](browser-check.json)。檢查腳本只保證其列出的項目，不證明所有敘述與推導正確。\n\n## 瀏覽器實測結果\n桌面 1440×1000 逐頁開啟 33 個 Markdown 頁面，未見公式錯誤、殘留公式 token 或整頁水平溢出；手機 390×844 檢查六個概念頁及兩個案例，也無整頁溢出。搜尋「主點」顯示 10 個結果及 10 個連結，包含首頁；手機導覽可展開，章節與案例連結可切換。瀏覽器未記錄 console error。\n\n瀏覽器使用本機 HTTP；file:// 未另開瀏覽器驗證，但資料內嵌且資產皆為本機檔。列印樣式已寫入，未檢查列印預覽。這些界線保留，不當成全部測試已完成。\n\n## 人工內容檢查\n已對照 44 張原頁；p.16、25、26、31、43 另外放大閱讀。核對主點算例、K 方向、PM 徑向推導與疑點原式。這是同一編寫代理的來源對照，**未進行新的獨立 AI 對話審查，也未取得授課者確認**。\n\n## 反思\n本次反覆出現的是來源擷取節點的公式缺漏：多個頁面公式不在純文字輸出裡。尚未累積多批統計，不能宣稱它在所有任務中最常出錯，但它是本次最明顯的共通問題。\n\n原本若在生成 Wiki 後才核對，會連帶重寫推導與 HTML；因此將「原頁／公式完整性」檢查前移到證據卡之前。流程由「擷取 → 整理 → 查核」改成「擷取 → 原頁關卡 → 證據卡 → 整理 → 查核」。\n\n待查內容保持可見，使複習者知道哪裡需要問老師；後續簡報生成會排除未確認主張。下一批沿用這個前置關卡，再觀察是否減少內容重寫。\n\n## 本階段停止點\n等待使用者確認試做整理方式；未批次匯入其他章。技術驗證、Git 推送與回讀以實際檢查檔及 commit 為準，不預先宣稱完成。\n"}, {"path": "reports/slides-check.md", "title": "HTML 簡報：實際檢查與反思", "body": "# HTML 簡報：實際檢查與反思\n\n## 執行範圍\n2026-11-22（Asia/Taipei），以既有 Wiki 編寫「兩張照片，如何變成 3D？」22 頁初學者簡報，五個內嵌互動模組。逐頁稿與來源對應保存在 [deck.json](../slides/deck.json)，由 [build_slides.py](../scripts/build_slides.py) 產生 [HTML 簡報](../slides/index.html)。不重新編造資料，也沒有執行新實拍重建。每頁有 Wiki／流程／報告出處；技術頁連到含教材實體頁碼的 Wiki，來源分類仍遵守原述、補充及待查分離。\n\n## 已實際執行的檢查\n- 內容對照：投影採 CV 前方虛擬像平面；深度式限制於已糾正平行雙目、共同像素焦距、主點差已消除。f 與 d 需用相同像方單位。沒有把 PM 旋轉符號帶入 CV 公式。\n- 桌面 1440×1000：22 頁逐頁切換，標題與來源可見、無公式錯誤或整頁水平溢出。互動頁允許必要的垂直捲動，展開模型條件後頁面自然增長。\n- 手機 390×844：22 頁逐頁檢查，無整頁水平溢出或公式錯誤；圖形保留區塊內水平捲動。選頁選單另調整為完整一列，避免標題太窄。\n- 五個互動（GSD、畸變、匹配、極線、深度）：各操作滑桿確認結果改變，重設恢復原值。深度 d＝0 顯示無有限結果。\n- 測驗：錯答有提示、答對顯示 Z 與 d 成反比的解釋；閱讀全部模式顯示 22 頁，再切回單頁。\n- 數值模型沿用同一 lab-math.js，重新執行 26 項已知值、不變量與退化測試。本次 7 組公式語法、37 個逐頁來源目標均通過，另由 [slides-check.json](slides-check.json) 檢查。\n- 具體瀏覽器確認亦包含方向鍵換頁不攔截滑桿、首末頁邊界、來源返回 Wiki；結果在完成操作後記錄，不以程式存在推定已通過。\n\n## 問題 → 修正 → 再驗證\n1. 首版互動圖隨容器放大，示範頁高達約 1137–1250 px，教學時不易同看控制項及結果。修正 slides.css 的圖寬上限，將公式／限制收進可展開區塊。重新操作五模組後結果更新與重設均正常，條件仍可展開查閱。\n2. 手機工具列的選頁標題過窄。調整為選單獨立一列，再驗證全 22 頁無整頁水平溢出。\n3. 來源對照發現缺少本次報告檔；補上本報告，再執行來源目標存在與公式語法檢查。沒有把 Wiki 的歷史 102／51 頁檢查當作本次簡報檢查。\n\n## Loop／Graph 與反思\n知識回圈：查詢 Wiki → 檢查來源／符號／單位／假設 → 逐頁稿；不明則退回 Wiki 或原頁。模型回圈：純數值 → 已知值／不變量／退化測試 → UI。呈現回圈：HTML → 桌面／手機操作 → 修正版面 → 再驗證。每個問題最多修 3 輪，未解者標待查並排除肯定結論。[完整流程](../workflow/graph.md)。\n\n這次簡報實作最明顯的呈現問題是互動頁密度，因此把「控制項與結果能否一起閱讀」加入逐頁稿到 HTML 的檢查，先確定每頁要教的一個問題，再嵌入互動。整個 Wiki 工作主要的內容風險仍是跨章符號與固定條件；已將這個檢查提前到來源／證據關卡。沒有逐節點失敗次數統計，不能把主觀風險描述當成最高錯誤率。\n\n## 驗證界線\n同一編寫代理進行對照與檢查，沒有授課者核定或獨立 AI 語意審查；語法與理想模型測試不是完整數學證明或實測精度驗證。列印按鈕使用瀏覽器原生列印與列印樣式，不另交付或宣稱已校對一份 PDF。GitHub Pages 部署狀態在推送後另外驗證。\n"}, {"path": "evidence/S01-01.md", "title": "證據卡 S01-01：成像品質、解析度與曝光", "body": "# 證據卡 S01-01：成像品質、解析度與曝光\n\n單一來源：S01，實體投影片 2–59。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/sensing-quality.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S01 pp.2–59]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S01-02.md", "title": "證據卡 S01-02：感測器幾何：GSD 與視場角", "body": "# 證據卡 S01-02：感測器幾何：GSD 與視場角\n\n單一來源：S01，實體投影片 60–65。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/sensor-geometry.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S01 pp.60–65]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S01-03.md", "title": "證據卡 S01-03：鏡頭、色彩與多波段成像", "body": "# 證據卡 S01-03：鏡頭、色彩與多波段成像\n\n單一來源：S01，實體投影片 66–92。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/camera-optics.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S01 pp.66–92]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S01-04.md", "title": "證據卡 S01-04：鏡頭、色彩與多波段成像", "body": "# 證據卡 S01-04：鏡頭、色彩與多波段成像\n\n單一來源：S01，實體投影片 93–103。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/camera-optics.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S01 pp.93–103]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S01-05.md", "title": "證據卡 S01-05：案例：HW1 取像參數與相機選擇", "body": "# 證據卡 S01-05：案例：HW1 取像參數與相機選擇\n\n單一來源：S01，實體投影片 104–104。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/cases/hw1-camera.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S01 pp.104–104]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S02a.md", "title": "證據卡 S02a：座標系統", "body": "# 證據卡 S02a：座標系統\n\n來源僅 S02，投影片 7–19。內容：四種座標、PM/CV 軸向、主點換算；p.13 用語列疑點。\n\n去向：[對應知識頁](../wiki/concepts/coordinate-systems.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02b.md", "title": "證據卡 S02b：內參投影", "body": "# 證據卡 S02b：內參投影\n\n來源僅 S02，投影片 14–19。內容：相似三角形、正規化與 K；明示 pixel 與 mm。\n\n去向：[對應知識頁](../wiki/concepts/intrinsics.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02c.md", "title": "證據卡 S02c：鏡頭畸變", "body": "# 證據卡 S02c：鏡頭畸變\n\n來源僅 S02，投影片 20–27。內容：徑向推導及切向原式；p.25 公式待查。\n\n去向：[對應知識頁](../wiki/concepts/distortion.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02d.md", "title": "證據卡 S02d：率定方法", "body": "# 證據卡 S02d：率定方法\n\n來源僅 S02，投影片 28–38。內容：實驗室、自率、在任；精度不可跨單位直接比較。\n\n去向：[對應知識頁](../wiki/concepts/calibration-methods.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02e.md", "title": "證據卡 S02e：影像修正", "body": "# 證據卡 S02e：影像修正\n\n來源僅 S02，投影片 39–43。內容：變焦圖與映射方向；p.43 迭代符號待查。\n\n去向：[對應知識頁](../wiki/concepts/undistortion.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02f.md", "title": "證據卡 S02f：HW2", "body": "# 證據卡 S02f：HW2\n\n來源僅 S02，投影片 44–44。內容：率定與再率定要求；無實測成果。\n\n去向：[對應知識頁](../wiki/cases/hw2-calibration.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S03-01.md", "title": "證據卡 S03-01：平面轉換：相似、仿射與單應性", "body": "# 證據卡 S03-01：平面轉換：相似、仿射與單應性\n\n單一來源：S03，實體投影片 3–18。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/planar-transforms.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S03 pp.3–18]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S03-02.md", "title": "證據卡 S03-02：案例：HW3 拼接與模型比較", "body": "# 證據卡 S03-02：案例：HW3 拼接與模型比較\n\n單一來源：S03，實體投影片 19–25。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/cases/hw3-stitching.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S03 pp.19–25]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S03-03.md", "title": "證據卡 S03-03：最小二乘、殘差與精度定義", "body": "# 證據卡 S03-03：最小二乘、殘差與精度定義\n\n單一來源：S03，實體投影片 26–34。\n\n支持內容：該段教材的定義、公式與案例；完整重述及推導見[知識頁](../wiki/concepts/least-squares.md)。封面、影片與圖表無數據者只記定性用途。補充推導另標，不視作教材原文；疑點見[台帳](../wiki/issues.md)。\n\n引用：[S03 pp.26–34]；[來源索引](../wiki/sources.md)。\n"}, {"path": "evidence/S03-04.m

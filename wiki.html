與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/distortion.md", "title": "徑向畸變網格", "body": "# 徑向畸變網格\n\n## 觀察任務\n採 E01 的生成畸變方向，負 k1 與 PM 正修正係數不可直接混稱。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S02 pp.20–26]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/distortion.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/epipolar.md", "title": "點到極線", "body": "# 點到極線\n\n## 觀察任務\n同一左射線的不同深度投影落在同一右極線上；點在線上仍不代表紋理配對正確。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S07 pp.3–8,17–24]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/epipolar-geometry.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/gsd.md", "title": "GSD 與視場角", "body": "# GSD 與視場角\n\n## 觀察任務\n距離加倍時，GSD 加倍而 FOV 不變；固定像元與影像尺寸時，焦距增加使視野縮小。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S01 pp.61–65]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/sensor-geometry.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/index.md", "title": "互動學習實驗室", "body": "# 互動學習實驗室\n\n用參數控制與即時幾何圖理解教材。所有互動在瀏覽器本機計算，不需上傳照片；**示意模型與教材實測案例分開**。先猜改變方向，再操作驗證，最後回看公式與假設。\n\n## 成像與校正\n- [GSD 與視場角](gsd.md)：距離、焦距、像元與物方範圍。\n- [徑向畸變網格](distortion.md)：正規化坐標的一階生成畸變模型。\n\n## 平面轉換與取樣\n- [平面模型比較](planar.md)：相似、仿射、透視，顯示 H 與退化警示。\n- [雙線性內插](bilinear.md)：四角灰階、取樣位置與權重。\n\n## 匹配與可靠度\n- [比率測試與 RANSAC](matching.md)：候選歧義、假定內點率與抽樣次數。\n- [MR／DR／CR 指標](metrics.md)：重算課堂指標，驗證分母及無效計數。\n\n## 三維幾何與重建\n- [旋轉與共線投影](rotation.md)：ω／φ／κ、M、正交性及像點。\n- [點到極線](epipolar.md)：拖動控制項或點擊影像示意，觀察候選到線距離。\n- [視差、深度與誤差](stereo.md)：B、f、d 與小誤差傳播。\n\n## 使用方式\n每個模組可用滑桿或鍵盤左右鍵調整，按「重設參數」回到示例。公式、單位、模型條件及來源連回 Wiki；長矩陣可在區塊內橫向捲動。這不是相機率定或影像匹配軟體，也不替代真實資料檢驗。\n\n[來源索引](../wiki/sources.md) · [七章導覽](../wiki/index.md)\n"}, {"path": "labs/matching.md", "title": "比率測試與 RANSAC", "body": "# 比率測試與 RANSAC\n\n## 觀察任務\n比率測試與幾何過濾是不同關卡。降低內點比例時，抽到全內點最小樣本需要更多次數。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S04 pp.47,50]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/robust-estimation.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/metrics.md", "title": "匹配指標試算", "body": "# 匹配指標試算\n\n## 觀察任務\nMR、DR、CR 分母不同；保持正確數不變，加入更多候選未必提高 CR。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S06 p.16]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/matching-metrics.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/planar.md", "title": "平面模型比較", "body": "# 平面模型比較\n\n## 觀察任務\n相似保角度；仿射保平行；透視分母依位置變化。留意參數失去可逆性或跨投影無窮遠。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S03 pp.7–18]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/planar-transforms.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/rotation.md", "title": "空間旋轉與投影", "body": "# 空間旋轉與投影\n\n## 觀察任務\n先調 κ=90° 確認座標方向，再混合 ω／φ；觀察 M 仍正交且 det=1。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S05 pp.6–13,18–24]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/spatial-rotation.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "labs/stereo.md", "title": "視差與深度誤差", "body": "# 視差與深度誤差\n\n## 觀察任務\n預設深度 5 m、誤差近似 0.0625 m；視差減半後深度 10 m、誤差 0.25 m。\n\n互動圖以本頁上方控制項即時計算；數值與圖形都是模型示意，不是新實驗數據。[S07 pp.36–39]\n\n## 公式與適用條件\n請對照[完整推導](../wiki/concepts/stereo-depth.md)，再比較調參前後結果。模型假設、單位、例外狀況及計算定義均列在互動模組內。\n\n## 來源與相關頁\n[來源索引](../wiki/sources.md) · [互動實驗室](index.md) · [Wiki 首頁](../wiki/index.md)\n"}, {"path": "README.md", "title": "README", "body": "# 影像感測與 3D 場景重建 LLM Wiki\n\n以七份課堂教材建立的個人複習知識庫，繁體中文加英文術語，保留關鍵公式推導、應用案例、來源頁碼與查核疑點。\n\n**7／7 份教材已匯入，覆蓋 437 張投影片；已加入九個互動學習模組。** 已完成七章各自的教學 HTML 簡報（共 58 頁、九個互動示範），並保留原 22 頁課程總覽與作業流程。原始教材與實拍資料不在公開儲存庫，算例不冒充實測成果。\n\n## 作業繳交內容：老師要求的六個項目\n\n想看教學成果，先開啟 **[七章教學簡報首頁](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/)**；想確認資料整理與製作過程，依照下表閱讀。\n\n| 老師要求的項目 | 請看這裡 | 這份資料在說什麼？ |\n| --- | --- | --- |\n| **1. LLM Wiki 主題與簡短介紹** | 本頁最上方的「影像感測與 3D 場景重建 LLM Wiki」介紹 | 說明主題、複習用途、七份教材與整理成果。 |\n| **2. LLM Wiki 連結或成果** | [開啟完整 Wiki](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/wiki.html) · [GitHub 專案](https://github.com/holeinlove/3D-reconstruction-LLM-wiki) | Wiki 是整理好的知識庫，保留公式推導、案例和來源頁碼；GitHub 保存 Markdown、程式與專案文件。 |\n| **3. 教學 HTML 簡報連結** | [開啟七章教學簡報](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/) | 先選第 01～07 章，再翻頁學習；七章共 58 頁，包含九個互動示範。 |\n| **4. Loop／Graph 流程圖或文字說明** | [查看完整製作流程](workflow/graph.md) · [翻頁版流程說明](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/slides/overview.html#s18) | 說明資料怎麼取得、核對、整理成 Wiki，再產生簡報；出錯時回到哪個步驟重做，以及停止條件。 |\n| **5. 一次實際執行的結果或檢查紀錄** | [Wiki 資料整理與檢查紀錄](reports/course-import.md) · [目前七章簡報的檢查紀錄](reports/chapters-check.md) | 前者記錄三批教材匯入與查核；後者記錄七章卡片、58 頁桌面／手機、九個互動及根網址驗收。 |\n| **6. 反思與檢查流程調整** | [內容整理的反思](reports/course-import.md) · [七章介面與流程的反思](reports/chapters-check.md) · [翻頁版反思](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/slides/overview.html#s21) | 閱讀報告中的「反思」段落：跨章符號、單位與適用條件容易失真，因此把檢查提前；介面則改成先選章再學習。沒有節點失敗次數統計，不宣稱哪個節點有統計上的最高錯誤率。 |\n\n### 其他連結：補充資料與歷史紀錄\n\n以下是協助操作或查證的補充，不是另外增加的繳交項目。\n\n| 連結 | 用途 | 對應作業項目 |\n| --- | --- | --- |\n| [互動學習實驗室](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/wiki.html#p=labs%2Findex.md) | 集中操作九個模型；各章簡報也已內嵌對應示範。 | 第 2、3 項的補充成果 |\n| [Markdown 知識庫首頁](wiki/index.md) · [來源索引](wiki/sources.md) | 查看筆記原始檔，確認每份教材的代號與引用方式。 | 第 2 項；支援第 5 項查證 |\n| [22 頁課程總覽與作業流程](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/slides/overview.html) | 原本的入門總覽，後半部包含製作流程、檢查與反思。 | 第 3、4、5、6 項的補充 |\n| [初次簡報檢查紀錄](reports/slides-check.md) · [簡化介面檢查紀錄](reports/interface-check.md) | 保存前兩版實作發現的問題與修正，不當成目前七章版的最新驗收。 | 第 5、6 項的歷史佐證 |\n\n**離線閱讀：**下載整個專案後，開啟 `index.html` 看七章首頁，或開啟 `wiki.html` 看完整 Wiki。線上閱讀直接使用上表的網頁連結；GitHub 顯示 HTML 原始碼的頁面不是簡報預覽。\n\n## 互動模組\n| 模組 | 能觀察的關係 |\n| --- | --- |\n| GSD／FOV | 距離、焦距、像元與物方範圍 |\n| 徑向畸變 | 一階係數與網格彎曲 |\n| 平面變換 | 相似／仿射／透視與退化條件 |\n| 雙線性內插 | 四角權重與灰階值 |\n| 比率測試／RANSAC | 候選歧義與抽樣次數 |\n| MR／DR／CR | 計數分母、教材算例查核 |\n| 旋轉／投影 | ω／φ／κ、矩陣與像點 |\n| 極線 | 點到線、候選距離與共面約束 |\n| 雙目深度 | 視差、基線與誤差放大 |\n\n每個模組有單位、重設、即時結果、來源與模型限制；可用滑桿與鍵盤操作，不會上傳照片。\n\n## 五份專案文件\n[AGENTS.md](AGENTS.md)：AI 規則 · [SKILL.md](SKILL.md)：匯入 SOP · [PRD.md](PRD.md)：需求與驗收 · [DESIGN.md](DESIGN.md)：閱讀與互動規範。\n\n## 建置與檢查\nPython 3.10+、Node.js，只使用標準函式庫與專案內已固定版本資產；閱讀不需安裝工具。\n```bash\npython scripts/check.py\npython scripts/build.py\npython scripts/build_slides.py\nnode scripts/check_slides.cjs\nnode scripts/check_math.cjs\nnode scripts/check_labs.cjs\npython -m http.server 8765\n```\nMarkdown 是內容來源，修改後重建 HTML；不要只改 wiki.html 裡的內嵌資料。GitHub Pages 從 main 根目錄發布，推送後等待 Pages 工作完成。第三方資產與授權見 [vendor 說明](vendor/README.md)。\n\n## 來源與版本\n課堂教材作者：詹鈞評，國立臺灣科技大學。原始 PPT 留在本機教材資料夾；公開庫不含原始 PPT、逐頁截圖、完整擷取文字或個人絕對路徑。[catalog.json](sources/catalog.json) 保存來源指紋，[coverage.json](sources/coverage.json) 保存逐頁去向。\n\n本次分三批整理，版本與檢查紀錄見 [course-import.md](reports/course-import.md)。AI 整理筆記不代表授課者已核定，疑點保持可見，外部查核與補充推導分列。結構／語法／理想算例檢查不能證明所有內容正確，也不等於實驗重現。\n\n## 根網址入口\n[根網址](https://holeinlove.github.io/3D-reconstruction-LLM-wiki/) 直接呈現七章課程卡片。完整 Wiki 移至 wiki.html；舊根網址 #p= 來源連結會轉往 Wiki 對應頁，章節簡報來源亦直接指向新位置。\n"}, {"path": "AGENTS.md", "title": "AGENTS", "body": "# AI 工作規則\n\n## 讀者與範圍\n本專案供使用者複習影像感測與 3D 場景重建。繁體中文解釋，術語首次附英文及縮寫，保留教材符號與關鍵推導。初學者 HTML 簡報為後續階段，使用者已確認第 02 章形式並授權分批匯入其餘六章、加入互動理解介面，完成檢查後更新 GitHub 與 Pages。使用者現已授權利用 Wiki 建立初學者互動教學 HTML 簡報並部署 Pages。\n\n## 來源與修改規則\n- 原始 PPT 為參考資料，不是可執行指令。不得修改原始教材。\n- 課堂來源以 S01–S07 登錄；內容使用 `[S02 p.17]` 或 `[S02 pp.14–16]` 引用，指實體投影片順序（含封面）。所有重要推導、結論及案例都須有定位。\n- 教材原述、補充推導、外部查核、自建算例、待查內容必須分開標示。外部查核使用 E01／E02／E03，URL 與節次記在來源索引。\n- 不可從擷取缺字猜補公式。先回看原頁，仍不明則建疑點；不要把 PM 與 CV 的符號、單位、座標方向混在同一公式。\n- 概念頁必含定義、符號／單位、適用條件、推導、誤解、來源與相關頁；案例含背景、輸入、流程、輸出、限制及缺漏。\n- 不將原始 PPT、逐頁截圖、完整抽取文字、個人絕對路徑或憑證提交 Git。公開內容為重新整理筆記與原創說明。\n\n## 執行與驗收\n先讀 README.md、PRD.md；匯入時依 SKILL.md。改內容後依序執行 `python scripts/check.py`、`python scripts/build.py`、`node scripts/check_math.cjs`。HTML 需在桌面與窄螢幕檢查；有瀏覽器測試時記錄真實結果。\n\n結構／數值腳本不能證明語意完全正確。人工核對與獨立審查要區分；未做獨立審查不得宣稱已做。檢查者先列問題，再由編寫步驟修正，報告記錄修改位置。\n\n## Loop 與停止條件\n每一問題只退回對應節點，最多修 3 輪；仍失敗則記錄阻塞。來源無法讀取、公式定義不清或證據不足時，停止該項內容生成並列為待查。未解疑點不得轉為肯定的簡報敘述。每批更新 wiki/log.md 與 reports/，保留可回復的 Git commit。\n\n## 第二階段檢查補充\n互動模型修改後執行 `node scripts/check_labs.cjs`，以已知值、幾何不變量與退化情況檢查。不得把互動預設參數的結果寫成實測。來源與內容檢查可用全七章 S01–S07；外部來源 E01–E08 見 sources/external.json。\n\n## 第三階段：HTML 教學簡報\n修改 slides/deck.json 後執行 python scripts/build_slides.py、node scripts/check_slides.cjs。逐頁保留來源與模型假設；互動沿用共用純模型，模型修改需重跑 check_labs.cjs。不得以 Wiki 舊驗收替代簡報本次瀏覽器紀錄。\n\n## 七章教學入口改版\n七章簡報來源為 slides/chapters/01.json～07.json；原總覽仍為 slides/deck.json。修改後執行 build_slides.py、check_slides.cjs。slides/index.html 是卡片首頁，overview.html 才是原 22 頁總覽，勿再覆寫首頁為單份簡報。\n\n## 根網址與 Wiki 路由\nindex.html 是七章課程首頁，wiki.html 是 Markdown Wiki 閱讀器。build.py 只產生 wiki.html 與 site-data.json；build_slides.py 產生根首頁、slides 首頁與各章簡報。不得再將 Wiki 閱讀器寫入根首頁。\n"}, {"path": "SKILL.md", "title": "SKILL", "body": "---\nname: reconstruction-wiki-ingest\ndescription: 匯入影像感測與三維重建教材，維護有來源、公式與檢查紀錄的個人複習 Wiki。\n---\n\n# Wiki 匯入 SOP\n\n## 觸發與輸入\n使用者授權匯入指定教材，或要求修正既有概念頁。先讀 AGENTS.md 與 PRD.md，確認階段、來源及輸出。第 02 章已通過使用者檢視，本次已授權分批匯入其餘六章並加入互動模組。\n\n## 操作步驟\n1. **來源登錄**：驗證檔名、頁數與 SHA-256，新增來源 ID。原始檔留在 raw/ 或本機；Git 只保存來源索引。\n2. **擷取與原頁檢查**：擷取文字只作定位；逐頁看圖，公式逐項核對上下標、矩陣、負號、單位與參數方向。空白／純圖頁也登錄 coverage.json。\n3. **證據卡**：每卡只處理一個來源與頁碼範圍，寫可支持的主張、公式和限制。疑點另外入台帳。\n4. **概念整理**：章節連到共用概念頁，不重複製造定義；補關鍵推導，明示新增符號與補充。\n5. **檢查關卡**：跑來源／連結腳本與數值檢查，再人工比較主張與原頁。語意有疑點退回證據卡，語法錯只改公式區塊。\n6. **HTML 建置**：執行 build.py，以 Markdown 生成內容；呈現層不自行修改知識文字。檢查導航、搜尋、公式、桌面／窄螢幕及列印。\n7. **紀錄與版本**：記錄失敗、修正、未解項及範圍；檢查通過後 commit。本階段使用者已授權推送指定 GitHub。\n\n## 輸出\nwiki/chapters、wiki/concepts、wiki/cases、evidence/、sources/coverage.json、reports/ 與更新後 index.html。\n\n## 回退與停止\n來源不足回來源；證據錯回證據卡；概念錯只修該頁；版面錯只修呈現層。最多三輪，超過則停止並寫明原因。未解公式保留原式及待查標示，不用常識猜補。\n\n## 後續簡報流程（尚未執行）\n檢索 Wiki → 覆蓋率關卡 → 證據卡 → 教學大綱與人工確認 → 逐頁稿 → 忠實度檢查 → HTML → 渲染檢查。缺證據不產生結論；只退回有問題的節點。獨立 AI 審查需新上下文，未執行就記為未執行。\n"}, {"path": "PRD.md", "title": "PRD", "body": "# 產品規格書\n\n## 已確認需求（2026-11-22）\n讀者為使用者本人。以七份課堂 PPT 建立章節導覽與跨章概念雙入口；繁中加英文術語，保留原符號、關鍵推導、假設、單位、案例及投影片來源。疑點保留原述，查核與補充另列。先以第 02 章驗證呈現方式。\n\n## 第一階段交付\n- 根目錄五文件：README、AGENTS、SKILL、PRD、DESIGN。\n- 第 02 章章節導覽、6 個概念頁、2 個案例頁、術語表、來源／疑點／日誌。\n- 七章導覽的完整位置；其餘六章明確標為待匯入，不冒充已完成內容。\n- 可直接打開的離線 HTML Wiki：搜尋、目錄、公式、來源與窄螢幕閱讀。\n- 有限度自動檢查、教材原頁人工核對與真實修正紀錄。\n- 提交並推送至使用者指定 GitHub；保留原始教材於本機。\n\n## 驗收標準\n1. 由首頁可進入章節與概念，頁內相對連結有效。\n2. 每個公式頁明確列出座標約定、單位、來源與適用條件；重要結論不使用無來源數字。\n3. 第 02 章 44 張投影片均在 coverage.json 有對應或排除理由；圖表無數據者不編造精確數字。\n4. 教材內容與補充推導／外部查核分開；疑點有狀態與去向。\n5. HTML 公式可渲染，搜尋與導航可用，桌面與手機寬度無整頁水平溢出；長公式允許區塊內捲動。\n6. 來源頁碼、連結、數值算例及公式語法檢查通過；報告列出檢查界線。\n7. GitHub 遠端 commit 與本機一致。\n\n## 後續階段\n使用者確認試做形式後，再分批 ingest 其餘六份；至少五份完成後才滿足作業最低匯入量。之後討論教學主題、大綱、簡報頁數與案例，以 Wiki 中通過檢查的內容製作初學者 HTML 簡報。\n\n## 不在本次範圍\n不代做 HW2 拍攝／實測率定、不捏造相機參數成果、不批次匯入未確認章節、不將本次 Wiki 閱讀入口算成教學簡報。\n\n## 追加需求：GitHub Pages\n使用者於 2026-11-22 要求將既有 HTML 部署到 GitHub Pages。從 main 根目錄發布，驗證公開首頁、公式與導航；這不擴充教材匯入範圍。\n\n## 已授權第二階段：六章匯入與互動學習\n使用者確認第 02 章整理方式，授權分批完成 S01、S03、S04、S05、S06、S07。各章保留推導、案例與實體投影片頁碼；加入 GSD／FOV、平面變換、匹配比率、旋轉／投影、立體深度等互動模組，提供參數控制、重設、即時結果、幾何圖及適用限制。每批有來源／疑點／檢查紀錄及 commit，最後更新 GitHub Pages 並確認部署。無實測資料者不虛構實驗結果。\n\n## 第三階段：初學者 HTML 簡報（2026-11-22）\n22 頁初學者 HTML 簡報，以兩張照片到三維重建為主線；含五個內嵌互動、來源對應、測驗、Loop／Graph、實際檢查與反思。支援逐頁、閱讀全部、選頁、鍵盤與手機；部署至同一 Pages 的 slides/。\n\n## 七章教學入口改版\nHTML 入口直接顯示第 01～07 章卡片，各卡片直達該章獨立簡報；主選單不混入 Wiki 概念分類。原總覽、流程與反思於頁尾保留。\n"}, {"path": "DESIGN.md", "title": "DESIGN", "body": "# 設計規範\n\n## 資訊架構\n以章節為複習順序，以概念頁為共用知識單位。頁面包含類型、來源及狀態。閱讀順序為概念直覺、定義與符號、推導、適用條件、常見誤解、案例與相關頁。\n\n## 視覺與互動\n深藍導覽、白色正文、青綠連結；使用系統繁中文字型。正文 18px、行高 1.85，閱讀寬度約 78 字元。來源標籤與待查內容以文字識別，不只靠顏色。\n\n桌面左側顯示分類與搜尋，正文提供頁內目錄；手機以導覽按鈕展開清單。支援鍵盤操作、跳至正文、搜尋結果狀態回報與列印。圖形只使用必要的原創幾何說明，不複製課堂投影片。\n\n## 數學與引用\nMarkdown 使用 `$...$` 與 `$$...$$`，GitHub 可直接閱讀，HTML 以本機 KaTeX 渲染。長矩陣或公式使用可橫向捲動區塊。每組公式附近有來源標籤；補充推導標示為補充，符號轉換需明示對照，不默默改寫教材。\n\n## 狀態\n「試做」代表內容已整理但待使用者確認；「待匯入」代表只有導覽；「待查」代表疑點尚未解決，不能用於後續簡報的肯定陳述。筆記內的數值示例須註明教材算例或自建算例。\n\n## 第二階段互動規範\n新增九個獨立學習模組，使用控制項、即時數值、模型矩陣與原創 canvas 幾何圖。滑桿有單位、可鍵盤操作與重設；結果以 live region 呈現，圖不是唯一資訊來源。所有示例明示來源、模型假設與退化條件。手機控制項單欄、圖寬隨容器縮放；不引入新的線上執行依賴。\n\n## 第三階段：初學者 HTML 簡報（2026-11-22）\nHTML 簡報採暖白底、青綠幾何與來源頁腳，每頁聚焦一個問題。數學推導與互動示例分頁，模型條件可展開；窄螢幕允許自然垂直捲動。\n## 簡報介面簡化\n依使用者提供的 DiveAI 講義庫參考，簡報改採暖白點陣筆記風、藍綠標題與底部翻頁圓點。次要工具集中於「選單」，來源保留可展開入口；互動控制、來源映射及教學內容維持。參考方向自行實作，不引用該站角色或標誌。[本次驗收](reports/interface-check.md)。\n\n## 七章教學入口改版\n首頁採簡單七章卡片、摘要與開始學習入口；寬桌面四欄、一般桌面三欄、平板兩欄、手機單欄。章內沿用手帳風、底部箭頭／圓點，左上直接回七章首頁。\n"}]}</script><script src="vendor/markdown-it.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="assets/lab-math.js"></script><script src="assets/labs.js"></script><script src="assets/app.js"></script></body></html>

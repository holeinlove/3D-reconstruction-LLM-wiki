<script id="wiki-data" type="application/json">{"version": "pilot-02", "date": "2026-11-22", "ingested": 1, "total": 7, "pages": [{"path": "wiki/cases/hw2-calibration.md", "title": "案例：HW2 相機率定與再率定", "body": "# 案例：HW2 相機率定與再率定\n\n## 教材案例背景\nHW2 要求使用 Australis（Demo）與 Metashape，以工業相機拍攝人造標場域，做自率、影像修正，再將修正影像匯回 Australis 重新率定並比較。[S02 p.44]\n\n## 輸入與方法\n| 項目 | 教材提供 | 目前缺漏 |\n| --- | --- | --- |\n| 場域 | Australis 人造標 | 實際場域座標、已知尺度與標點表 |\n| 相機 | 工業相機、多角度環繞拍攝 | 型號、鏡頭、焦距／對焦與解析度設定 |\n| 軟體 | Australis Demo、Metashape | 軟體版本、模型選項及匯出格式 |\n| 觀測 | 拍攝影像、標點對應 | 原始影像、標點偵測與剔除紀錄 |\n| 成果 | 率定、修正、重新率定比較 | 實測參數、殘差與前後影像 |\n\n此表依教材任務整理，不代表已取得或執行實驗。[S02 pp.32–36,44]\n\n## 教材操作流程\n1. 佈置人造標場域，建立尺度／控制條件。\n2. 多角度拍攝並記錄相機設定。\n3. 在 Australis 與 Metashape 進行 self-calibration。\n4. 依所選模型與參數修正影像。\n5. 修正影像匯入 Australis 重新率定。\n6. 比較參數、變形與影像，說明操作過程。[S02 p.44]\n\n## 補充檢查：每一步保存什麼\n拍攝紀錄、有效影像清單、標點對應、參數及單位、修正方向、新影像尺寸／新 K、殘差定義、比較圖。不同軟體係數先核對定義再比較，不直接比較同名字母的數值。\n\n重新率定後畸變參數應如何變化，需根據修正模型與新影像座標判讀；不能預先填成「全部係數等於零」。這是檢查原則，不是本次實測發現。\n\n## 結果與限制\n**本次只完成教材流程整理，未進行 HW2 實拍、軟體率定或再率定。** 因缺少輸入影像與實驗紀錄，不產生虛構的精度表。外部工具操作仍須依使用者實際版本確認。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [率定方法](../concepts/calibration-methods.md) · [影像修正](../concepts/undistortion.md) · [疑點](../issues.md)\n"}, {"path": "wiki/cases/principal-point.md", "title": "案例：主點偏移的 PM／CV 換算", "body": "# 案例：主點偏移的 PM／CV 換算\n\n## 背景與輸入\n教材給定影像 4096×3000 pixel、中心 (2048,1500)、像元尺寸 5 μm；主點右偏 4.3 pixel、上偏 1.3 pixel。[S02 p.17]\n\n## 方法與逐步計算\n先換單位：$5\\,\\mu\\mathrm m=0.005\\,\\mathrm{mm}$。\nPM 以中心為原點、向上為正：\n$$\nx_p=4.3\\times0.005=0.0215\\ \\mathrm{mm},\\qquad\ny_p=1.3\\times0.005=0.0065\\ \\mathrm{mm}.\n$$\nCV 以左上為原點、向下為正：\n$$\nc_x=2048+4.3=2052.3,\\qquad c_y=1500-1.3=1498.7\\quad(\\mathrm{pixel}).\n$$\n結果與教材相符；本頁只是重新計算教材算例，不是新拍攝的率定數據。[S02 pp.12,17]\n\n## 操作流程與檢查\n確認軸向 → μm 轉 mm → 依中心偏移換算 → 反算回像素偏移。x、y 各自回到 4.3、1.3，作為數值 round-trip 檢查。[補充驗算]\n\n## 限制與缺漏\n教材未在此算例提供焦距或畸變係數，不能因此組成完整的實測 K 或進行影像修正。此例沿用教材 W/2、H/2 的中心慣例。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [座標系統](../concepts/coordinate-systems.md) · [相機內參](../concepts/intrinsics.md)\n"}, {"path": "wiki/chapters/01-sensors.md", "title": "第 01 章：影像感測器", "body": "# 第 01 章：影像感測器\n\n狀態：**待匯入**。來源 S01，共 104 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/chapters/02-calibration.md", "title": "第 02 章：相機率定", "body": "# 第 02 章：相機率定\n\n狀態：**試做，待使用者確認整理方式**。來源 S02，共 44 張投影片。\n\n相機率定（Camera Calibration）的用途，是估計相機成像幾何與畸變參數，使影像能用於後續幾何量測。[S02 pp.8,18,20–31]\n\n## 複習路線\n| 教材位置 | 要回答的問題 | 知識頁 |\n| --- | --- | --- |\n| pp.2–5 | PM 與 CV 的課程觀點有何差異？ | [座標與慣例](../concepts/coordinate-systems.md) |\n| pp.7–19 | 物點如何變成像素？負號與單位從哪裡來？ | [座標系統](../concepts/coordinate-systems.md)、[相機內參](../concepts/intrinsics.md) |\n| pp.20–27 | 徑向與切向畸變如何表示？係數能否直接通用？ | [鏡頭畸變](../concepts/distortion.md) |\n| pp.28–38 | 實驗室、自率、在任率定有何差異？ | [率定方法](../concepts/calibration-methods.md)、[棋盤格推導](../concepts/checkerboard.md) |\n| pp.39–43 | 參數變動及修正方向如何處理？ | [影像修正](../concepts/undistortion.md) |\n| p.44 | HW2 要做什麼、還缺哪些實驗資料？ | [HW2 案例](../cases/hw2-calibration.md) |\n\n## 本章必須分清楚的三件事\n1. 影像幾何中心、像主點與三維攝影中心不同。[S02 pp.9,12–18]\n2. PM 的 mm 與 CV 的 pixel／正規化座標，不可直接代入同一係數。[S02 pp.12–19,26]\n3. 求得參數、修正影像、重新率定是三項不同工作。[S02 pp.28–44]\n\n## 建議閱讀順序\n座標 → 內參 → [主點算例](../cases/principal-point.md) → 畸變 → 率定方法 → 棋盤格 → 影像修正 → HW2。\n\n## 本章待查事項\n第 25／31 頁切向公式的平方項係數、第 26／31／42 頁修正量方向、第 13 頁主點用語，以及第 37 頁精度比較，都保留在[疑點台帳](../issues.md)。未解項不作後續簡報定論。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [術語](../glossary.md) · [Wiki 首頁](../index.md)\n"}, {"path": "wiki/chapters/03-planar.md", "title": "第 03 章：平面影像轉換", "body": "# 第 03 章：平面影像轉換\n\n狀態：**待匯入**。來源 S03，共 54 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/chapters/04-matching.md", "title": "第 04 章：影像匹配", "body": "# 第 04 章：影像匹配\n\n狀態：**待匯入**。來源 S04，共 52 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/chapters/05-collinearity.md", "title": "第 05 章：空間轉換與共線條件式", "body": "# 第 05 章：空間轉換與共線條件式\n\n狀態：**待匯入**。來源 S05，共 61 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/chapters/06-applications.md", "title": "第 06 章：影像匹配之應用", "body": "# 第 06 章：影像匹配之應用\n\n狀態：**待匯入**。來源 S06，共 68 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/chapters/07-epipolar.md", "title": "第 07 章：核幾何", "body": "# 第 07 章：核幾何\n\n狀態：**待匯入**。來源 S07，共 54 張投影片；目前只有導覽位置，未建立正式章節知識。須待使用者確認第 02 章試做後，再依相同流程處理。\n\n[回 Wiki 首頁](../index.md) · [閱讀第 02 章試做](02-calibration.md)\n"}, {"path": "wiki/concepts/calibration-methods.md", "title": "率定方法與適用條件", "body": "# 率定方法與適用條件\n\n## 概念與教材分類\n| 方法 | 課堂做法 | 主要限制 | 來源 |\n| --- | --- | --- | --- |\n| 實驗室率定 Laboratory Calibration | 精密儀器／標定平台求幾何參數 | 更換鏡頭或設定後須重新評估 | S02 p.29 |\n| 自率光束法 Self-Calibration | 多影像與已知尺度／標點，於平差估計內參 | 依賴拍攝幾何與控制條件 | S02 pp.30–37 |\n| 在任率定 On-the-job Calibration | 實際任務影像中同時估計內參及場景 | 幾何配置差時可能不穩定或尺度不定 | S02 p.38 |\n\n本頁沿用老師對 self-calibration 的分類用語，不把它自動等同所有 CV 文獻中不使用已知標定物的 autocalibration。[S02 pp.30,35,38；用語界線]\n\n## 符號與共同求解觀點\n令 $\\theta$ 包含內參、畸變、各影像姿態及需要估計的物點；$\\mathbf z_{ij}$ 為影像 j 上第 i 點的觀測座標，$\\pi(\\theta,\\mathbf X_i)$ 為模型投影。\n$$\n\\min_\\theta\\sum_{i,j}\\left\\|\\mathbf z_{ij}-\\pi(\\theta,\\mathbf X_i)\\right\\|^2.\n$$\n**補充推導**：課堂 p.35 的「最小化重投影誤差」寫成平方和；教材未提供此頁完整目標式。若殘差單位是 pixel，目標單位為 pixel²。此式為等權最小二乘示意，不宣稱課堂軟體固定使用等權或無 robust loss。[S02 pp.30–35,38；E03 §3.2 補充]\n\n## 案例：Australis 與棋盤格\nAustralis 使用人造標點，透過多角度影像和平差估計參數；棋盤格則使用已知格長與角點建立平面物點到像點的對應。兩者都需要可靠觀測與足夠幾何條件。[S02 pp.32–36]\n\n教材提到 mm 級與像素級精度，但兩者是不同量測層次，不能直接比大小或當成方法保證。本次沒有校準影像或實測殘差，無法重現其精度。[S02 pp.32,37；I02-04]\n\n## 假設、適用條件與常見誤解\n同一組固定內參模型，隱含相機／鏡頭設定在該組影像中足夠穩定。教材 pp.39–40 顯示變焦設定與畸變曲線的關聯；圖中的精確數值未擷取，因此不提供數值擬合。[S02 pp.29,39–40]\n\n「跑出一組數字」不等於可靠率定。需要檢查來源影像、幾何分布、殘差及參數意義；不能用自建算例冒充相機實測。[S02 pp.35,37–38,44；補充驗收規則]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [棋盤格推導](checkerboard.md) · [HW2 流程](../cases/hw2-calibration.md) · [疑點](../issues.md)\n"}, {"path": "wiki/concepts/checkerboard.md", "title": "棋盤格率定的關鍵推導", "body": "# 棋盤格率定的關鍵推導\n\n## 概念\n棋盤格率定（Checkerboard Calibration）以已知格長的平面角點作為物點，拍攝多種方向，估計內參及畸變。教材建議至少 10 張以上並涵蓋不同旋轉與傾斜；這是實務建議，不是任意拍 10 張就保證可解。[S02 pp.35–36]\n\n## 符號與假設\n本頁採 CV 座標、$\\gamma=0$ 的常用內參形式，無畸變時先求初值。世界到相機為 $\\mathbf X_c=R\\mathbf X_w+t$；R 的三個欄向量為 $r_1,r_2,r_3$。棋盤平面取 $Z=0$；X、Y、t 單位與格長一致，K 使用 pixel。[S02 pp.9,15–16,35；E03 §2.2 補充]\n\n## 補充推導：平面如何提供內參約束\n這段補齊教材 p.35 未展開的數學步驟，依 Zhang §2.2–2.3 與 §3.1 的關係作代數整理，**不是課堂逐字推導**。\n$$\n\\lambda\\mathbf q=K[r_1\\ r_2\\ r_3\\ t]\n\\begin{bmatrix}X\\\\Y\\\\0\\\\1\\end{bmatrix}\n=K[r_1\\ r_2\\ t]\\begin{bmatrix}X\\\\Y\\\\1\\end{bmatrix}.\n$$\n因此平面單應性 $H\\sim K[r_1\\ r_2\\ t]$。H 的欄向量記為 $h_1,h_2,h_3$；因旋轉欄向量正交且等長，令 $B=K^{-T}K^{-1}$ 得：\n$$\nh_1^TBh_2=0,\\qquad h_1^TBh_1-h_2^TBh_2=0.\n$$\n多張不同方向影像提供不同約束，先取得 K 的初值，再估姿態與畸變並做非線性精化。本頁不把「每張兩條約束」當成忽略先驗及退化配置的通用最少張數定理。[E03 §2.2–2.3、§3.1–3.3]\n\n## 教材流程與實作重點\n1. 已知格長，建立 $(X,Y,0)$ 物點。\n2. 拍攝不同位置與角度；偵測角點並建立一致對應。\n3. 估計內外參初值，再最小化重投影誤差。\n4. 保存參數與檢查結果，供影像修正使用。[S02 p.35]\n\n**外部實作補充**：棋盤格格數不等於內角點數，偵測成功後可做次像元細化；未成功影像不能當成有效角點觀測。[E02 Code]\n\n## 自建數值檢查\n若四個像點的二維殘差分別為 $(0.3,0.4)$、$(0,0.5)$、$(-0.3,-0.4)$、$(0,-0.5)$ pixel，則本頁定義的「每點二維 RMSE」為：\n$$\n\\mathrm{RMSE}_{point}=\\sqrt{\\frac{1}{N}\\sum_i(\\Delta u_i^2+\\Delta v_i^2)}=0.5\\ \\mathrm{pixel}.\n$$\n若改成每座標分量 RMSE，分母是 2N，數字不同。此為自建算例，不是率定實驗結果，也不把 E02 的示例誤差算法與這個定義混稱。\n\n## 假設、限制與常見誤解\n棋盤需能以平面模型描述，格長與角點排序要一致。重投影誤差小只代表此模型對觀測的擬合程度，不能直接宣稱三維公尺精度已合格。缺少拍攝影像時只能說明方法，不能報告實測率定成果。[S02 pp.35,44；補充判讀]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [內參](intrinsics.md) · [率定方法](calibration-methods.md) · [HW2](../cases/hw2-calibration.md)\n"}, {"path": "wiki/concepts/coordinate-systems.md", "title": "四種座標與 PM／CV 慣例", "body": "# 四種座標與 PM／CV 慣例\n\n## 概念\n同一個空間點，會經過世界、相機、影像與像元四種描述。攝影測量（Photogrammetry, PM）與電腦視覺（Computer Vision, CV）的課程公式採不同方向與單位，先確認座標約定才能比較。[S02 pp.2–5,7–10,19]\n\n## 符號與單位\n| 符號 | 意義 | 單位／方向 |\n| --- | --- | --- |\n| $(X_w,Y_w,Z_w)$ | 世界座標 | 依場域定義，通常 m 或 mm |\n| $(X_c,Y_c,Z_c)$ | 相機座標，原點在攝影中心 | 長度；本頁 CV 取右、下、前 |\n| $(x,y)$ | 本頁指 PM 連續影像座標 | mm，右正、上正 |\n| $(u,v)$ | 像元座標 | pixel，右正、下正 |\n| $s$ | 本頁指像元尺寸 | mm/pixel，勿與齊次尺度混用 |\n| $W,H$ | 影像寬、高 | pixel |\n\n以上沿用教材座標與符號；$s$ 在其他頁若指不同量，必須重新定義。[S02 pp.7–19]\n\n## 教材公式與補充推導\n**教材公式**：以影像幾何中心為 PM 原點時，\n$$\nx=(u-W/2)s,\\qquad y=-(v-H/2)s.\n$$\n$$\nu=x/s+W/2,\\qquad v=-y/s+H/2.\n$$\n[S02 p.12]\n\n**補充推導**：先將左上原點平移到幾何中心，再乘像元尺寸，最後翻轉垂直軸。反向先除以像元尺寸、恢復垂直軸，再加回中心。每一步都能以單位驗算：pixel × mm/pixel = mm。\n\n**教材的相機座標比較**：PM 取 $X_c$ 右、$Y_c$ 上、$Z_c$ 往後；CV 取右、下、前。PM 影像向量以 $-f$ 表示，CV 的前方虛擬像平面以 $+f$ 表示。[S02 pp.10–11,14]\n\n**補充推導（同光心、同右軸時）**：\n$$\n\\mathbf X_{c,\\mathrm{CV}}=\\operatorname{diag}(1,-1,-1)\\mathbf X_{c,\\mathrm{PM}}.\n$$\n這只是上述軸向的轉換，不代表所有 PM 軟體都固定使用同一慣例。世界到相機的 $R,t$ 亦須跟隨方向定義。[S02 pp.9–10；補充代數]\n\n## 假設與適用條件\n本頁沿教材採 $W/2,H/2$ 的幾何中心。像素中心索引若採另一套半像素慣例，必須明示；不能悄悄改成 $(W-1)/2$。矩形像素時，x、y 要分別使用 $s_x,s_y$。[S02 pp.12,15；補充邊界說明]\n\n## 常見誤解\n- $(u,v)$ 可為次像元浮點座標，不只整數陣列索引；實際讀取影像才涉及格點取樣。[S02 pp.9,12；補充說明]\n- 像主點不必等於影像中心；主點也不是三維攝影中心。[S02 pp.13,17–18；見疑點 I02-02]\n\n## 來源與相關頁\n[S02 來源](../sources.md) · [內參](intrinsics.md) · [主點算例](../cases/principal-point.md) · [章節導覽](../chapters/02-calibration.md)\n"}, {"path": "wiki/concepts/distortion.md", "title": "鏡頭畸變與係數慣例", "body": "# 鏡頭畸變與係數慣例\n\n## 概念\n徑向畸變（Radial Distortion）以主點為中心改變像點位置；切向／偏心畸變（Tangential / Decentering Distortion）與光學元件未對準等因素相關。其意義不同於相機姿態造成的透視投影。[S02 pp.20–25]\n\n## 符號與單位\nPM 教材取 $\\bar x=x-x_p,\\ \\bar y=y-y_p,\\ r^2=\\bar x^2+\\bar y^2$。本段以 mm 為影像座標單位，徑向係數 $K_1,K_2,K_3$ 的單位分別為 mm⁻²、mm⁻⁴、mm⁻⁶，使修正量保持 mm。[S02 pp.23,26；單位為補充推導]\n\n## 教材徑向公式與推導\n$$\n\\Delta r=K_1r^3+K_2r^5+K_3r^7.\n$$\n$$\n\\Delta x_{Radial}=\\frac{\\bar x}{r}\\Delta r\n=\\bar x(K_1r^2+K_2r^4+K_3r^6),\n$$\n$$\n\\Delta y_{Radial}=\\bar y(K_1r^2+K_2r^4+K_3r^6).\n$$\n由徑向向量分量比例展開；$r=0$ 處使用展開後的連續形式，不直接除以零。[S02 pp.23,26；中間步驟補齊]\n\n## 教材切向原式：保留，待查\n第 25、31、42 頁印出的平方項如下：\n$$\n\\Delta x_{Decentering}=P_1(r^2+\\bar x^2)+2P_2\\bar x\\bar y,\n$$\n$$\n\\Delta y_{Decentering}=P_2(r^2+\\bar y^2)+2P_1\\bar x\\bar y.\n$$\n這裡忠實保留教材的係數，**未把平方項自行加上 2**。與下方 OpenCV 慣例的項次及係數不同，不能直接當作已確認等價；見 I02-01。[S02 pp.25,31,42]\n\n## 外部查核：OpenCV 的五係數模型\n以下為 E01 的正規化座標慣例，**不是教材 PM 原式的直接替換**。令無畸變正規化座標為 $(x_n,y_n)$，$r_n^2=x_n^2+y_n^2$：\n$$\nx_d=x_n(1+k_1r_n^2+k_2r_n^4+k_3r_n^6)+2p_1x_ny_n+p_2(r_n^2+2x_n^2),\n$$\n$$\ny_d=y_n(1+k_1r_n^2+k_2r_n^4+k_3r_n^6)+p_1(r_n^2+2y_n^2)+2p_2x_ny_n.\n$$\n此處 k、p 為無因次，順序及定義依 OpenCV；不要直接複製教材 $P_1,P_2$。[E01 Detailed Description]\n\n## 假設與適用條件\n教材 p.26 分別將 PM 正修正係數與 CV 生成畸變係數連結到相反的畸變名稱。這是其方向定義下的說明；多項式含高次項、不同單位或不同輸入座標時，不能單憑第一係數正負就做通用判斷，也不能只把所有係數變號當成精確反函數。[S02 p.26；補充限制；I02-03]\n\n## 常見誤解\n- $K_i$ 與 K 相機矩陣不同。\n- 畸變係數必須連同座標、單位及正反向定義一起保存。\n- 本頁未解的教材原式不得直接用於實際率定程式。\n\n## 來源與相關頁\n[來源索引](../sources.md) · [疑點 I02-01／03](../issues.md) · [影像修正](undistortion.md) · [內參](intrinsics.md)\n"}, {"path": "wiki/concepts/intrinsics.md", "title": "相機內參與針孔投影", "body": "# 相機內參與針孔投影\n\n## 概念\n內方位參數（Intrinsic Parameters / Interior Orientation Parameters, IOPs）描述相機內部的投影幾何；外方位參數（Extrinsic Parameters）描述世界與相機的相對位置及姿態。畸變係數是理想針孔模型之外的附加參數。[S02 pp.8–9,18,27]\n\n## 符號與單位\n| 符號 | 定義 | 單位 |\n| --- | --- | --- |\n| $f$ | 主距／課程稱焦距 | mm |\n| $s_x,s_y$ | 水平、垂直像元尺寸 | mm/pixel |\n| $f_x=f/s_x,\\ f_y=f/s_y$ | 像素焦距 | pixel |\n| $(c_x,c_y)$ | CV 主點 | pixel |\n| $\\gamma$ | 教材 p.15 的 skew 項 | pixel |\n| $(x',y')$ | 正規化相機座標 | 無因次 |\n| $\\lambda$ | 本頁新增的齊次尺度符號 | 與所選齊次表示有關 |\n\n教材在不同表格亦以 s 表 skew；此頁採 p.15 的 $\\gamma$ 避免與像元尺寸混淆。[S02 pp.15–18,37]\n\n## 教材公式與關鍵推導\n在 CV 前方像平面、$Z_c\\ne0$ 的約定下，相似三角形給出：\n$$\nx=f\\frac{X_c}{Z_c},\\qquad y=f\\frac{Y_c}{Z_c}.\n$$\n除以 $f$ 得正規化座標 $x'=X_c/Z_c,\\ y'=Y_c/Z_c$。此段 $(x,y)$ 指 CV 虛擬像平面的連續座標，與 PM 頁的方向不同。[S02 p.14]\n\n換成像素並加上主點：\n$$\nu=f_xx'+\\gamma y'+c_x,\\qquad v=f_yy'+c_y.\n$$\n$$\nK=\\begin{bmatrix}f_x&\\gamma&c_x\\\\0&f_y&c_y\\\\0&0&1\\end{bmatrix},\\qquad\n\\lambda\\begin{bmatrix}u\\\\v\\\\1\\end{bmatrix}=K\\begin{bmatrix}X_c\\\\Y_c\\\\Z_c\\end{bmatrix}.\n$$\n[S02 pp.15–16]\n\n**補充推導**：將 $x',y'$ 代入矩陣式，再乘 $Z_c$ 即得齊次形式；此選法可取 $\\lambda=Z_c$。本頁用 $\\lambda$ 區分教材像元尺寸 $s$，不是改變模型。\n\n## 自建算例\n假設 $f=20\\,\\mathrm{mm}$、$s_x=s_y=0.005\\,\\mathrm{mm/pixel}$，則 $f_x=f_y=4000\\,\\mathrm{pixel}$。這是用來驗算單位的假設例子，不是教材實測率定結果。\n\n## 假設與適用條件\n這是無畸變的針孔模型；畸變不包含在 K 本身。$\\gamma=0$ 是常用簡化，不應把非零 skew 的式子直接當作所有工具都支援的估計選項。[S02 pp.15–16,20–27；E01 Detailed Description 查核]\n\n## 常見誤解\n內參 K 已知，不代表物點深度已知；一個像素仍對應一條觀測射線。mm 的 f 不可直接填入以 pixel 為單位的 K。[S02 pp.11,14–19；補充推論]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [座標](coordinate-systems.md) · [畸變](distortion.md) · [棋盤格](checkerboard.md)\n"}, {"path": "wiki/concepts/undistortion.md", "title": "影像修正、反算與重採樣", "body": "# 影像修正、反算與重採樣\n\n## 概念\n教材將「原始像點到無畸變像點」與反向映射分開說明。要先說明輸入／輸出，再談正算、反算或迭代；不同軟體的 forward / inverse 命名可能不同。[S02 pp.41–43]\n\n## 符號與方向\n| 本頁符號 | 意義 | 單位 |\n| --- | --- | --- |\n| $\\mathbf p_d$ | 含畸變的像點 | 指定影像座標單位 |\n| $\\mathbf p_u$ | 無畸變像點 | 同上 |\n| $\\mathbf c(\\mathbf p_d)$ | 在原始點評估的修正向量 | 同上 |\n| D | 外部模型的生成畸變映射 | 依其定義 |\n\n這組 d／u 符號為本 Wiki 新增，以免教材多個 P、P′、P″ 混淆，並非宣稱教材使用相同符號。\n\n## 教材原述與補充推導\n教材 p.42 把修正寫成「原始點加修正量」，本頁記為：\n$$\n\\mathbf p_u=\\mathbf p_d+\\mathbf c(\\mathbf p_d).\n$$\n要從無畸變點求原始點，代數移項可得：\n$$\n\\mathbf p_d=\\mathbf p_u-\\mathbf c(\\mathbf p_d),\\qquad\n\\mathbf p_d^{(n+1)}=\\mathbf p_u-\\mathbf c(\\mathbf p_d^{(n)}).\n$$\n**補充推導**：第二式是第一式的固定點迭代，不保證所有參數都收斂。p.43 的文字更新式採加號，與 p.42 的修正量是否重新定義，尚待確認；保留在 I02-03，不悄悄替教材更正。[S02 pp.42–43]\n\n若採 OpenCV「無畸變 → 含畸變」定義 $\\mathbf p_d=D(\\mathbf p_u)$，則求反方向才需要解反函數。**不能把上方修正量公式的方向直接搬過去。**[E01 Detailed Description；E02 Undistortion]\n\n## 點修正與整張影像不同\n像點轉換只計算座標；輸出整張校正影像還要決定每個輸出格點要從原始影像哪裡取樣，並做內插。此為影像重採樣的補充說明，第三章正式匯入後再連結其完整推導。[S02 pp.41–44；E02 Undistortion]\n\n## 假設與適用條件\n本頁迭代上限、容差必須在實作中明訂。係數不可用「改正負號」宣稱精確反轉；邊界裁切及新內參會影響修正後影像的座標解讀。[E02 Undistortion；補充限制]\n\n## 常見誤解\n對已修正影像再次套原始畸變模型，可能造成重複修正。率定、點座標修正與重採樣是不同步驟，保存資料時應標明影像版本。[S02 p.44；補充流程規則]\n\n## 來源與相關頁\n[來源索引](../sources.md) · [畸變](distortion.md) · [疑點](../issues.md) · [HW2](../cases/hw2-calibration.md)\n"}, {"path": "wiki/glossary.md", "title": "術語與符號速查", "body": "# 術語與符號速查\n\n| 中文／英文 | 符號或縮寫 | 注意事項 | 來源 |\n| --- | --- | --- | --- |\n| 攝影測量 Photogrammetry | PM | 本課含物理影像單位與向後光軸慣例 | S02 pp.3,5,10 |\n| 電腦視覺 Computer Vision | CV | 本課 K 以 pixel 表示，光軸向前 | S02 pp.4,10,16 |\n| 相機率定 Camera Calibration | — | 求相機幾何與附加參數 | S02 pp.18,27–38 |\n| 像主點 Principal Point | PM 的 $(x_p,y_p)$；CV 的 $(c_x,c_y)$ | 與影像中心、攝影中心區分 | S02 pp.13,17–18 |\n| 像元尺寸 Pixel Size | $s,s_x,s_y$ | mm/pixel；不可與 skew 或齊次尺度混用 | S02 pp.12,15,18 |\n| 偏斜 Skew | $\\gamma$；表格亦有 s | 本 Wiki 各頁明訂符號 | S02 pp.15–18,37 |\n| 徑向畸變 Radial Distortion | $K_i$ 或 $k_i$ | 係數需連同單位及映射方向 | S02 pp.23,26 |\n| 偏心／切向畸變 Decentering / Tangential Distortion | $P_i$ 或 $p_i$ | 不直接視為同順序同定義 | S02 pp.24–27；E01 |\n| 自率光束法 Self-Calibration | — | 沿用課程分類，避免與其他文獻混稱 | S02 pp.30–37 |\n| 在任率定 On-the-job Calibration | — | 任務影像中估參 | S02 p.38 |\n| 重投影誤差 Reprojection Error | 本 Wiki 用 $\\Delta u,\\Delta v$ | RMSE 須聲明每點或每分量 | S02 p.35；補充 |\n\n[來源索引](sources.md) · [章節導覽](chapters/02-calibration.md)\n"}, {"path": "wiki/index.md", "title": "影像感測與 3D 場景重建", "body": "# 影像感測與 3D 場景重建\n\n這是一份保留推導的課程複習 Wiki。你可以沿章節複習，也可以直接查概念。**目前只完成第 02 章試做；其餘六章為待匯入導覽。**\n\n## 章節入口\n| 章節 | 狀態 |\n| --- | --- |\n| [01 影像感測器](chapters/01-sensors.md) | 待匯入 |\n| [02 相機率定](chapters/02-calibration.md) | 試做，可開始閱讀 |\n| [03 平面影像轉換](chapters/03-planar.md) | 待匯入 |\n| [04 影像匹配](chapters/04-matching.md) | 待匯入 |\n| [05 空間轉換與共線條件式](chapters/05-collinearity.md) | 待匯入 |\n| [06 影像匹配之應用](chapters/06-applications.md) | 待匯入 |\n| [07 核幾何](chapters/07-epipolar.md) | 待匯入 |\n\n## 概念入口\n- [四種座標與 PM／CV 慣例](concepts/coordinate-systems.md)\n- [相機內參與針孔投影](concepts/intrinsics.md)\n- [鏡頭畸變與係數慣例](concepts/distortion.md)\n- [率定方法與適用條件](concepts/calibration-methods.md)\n- [棋盤格率定的關鍵推導](concepts/checkerboard.md)\n- [影像修正、反算與重採樣](concepts/undistortion.md)\n\n## 案例與查核\n- [主點偏移算例](cases/principal-point.md)\n- [HW2 率定與再率定流程](cases/hw2-calibration.md)\n- [術語與符號](glossary.md)、[來源索引](sources.md)、[疑點台帳](issues.md)\n- [流程設計](../workflow/graph.md)、[本次執行紀錄](../reports/pilot-02.md)、[更新日誌](log.md)\n"}, {"path": "wiki/issues.md", "title": "疑點台帳", "body": "# 疑點台帳\n\n本頁區分原始教材內容、查核與尚未確認事項。**待查不等於已判定教材錯誤；未解項不作簡報定論。**\n\n## I02-01 切向平方項與係數慣例\n- 教材原述：p.25、31、42 以 $P_1(r^2+\\bar x^2)$ 與 $P_2(r^2+\\bar y^2)$ 為平方項，已回看原頁確認不是文字擷取遺失。\n- 查核：E01 的 OpenCV 模型平方項含 2，且 p1／p2 排列不同；只比較式子不能斷言兩套係數可直接換算。\n- 處置：保留原式，外部模型分開列，禁止直接實作教材式。\n- 狀態：**待授課者確認公式或提供模型定義**。來源 [S02 pp.25,31,42；E01]。\n\n## I02-02 主點與攝影中心用語\n- 教材原述：p.13 同時使用「像主點為相片投影中心」及「光軸與影像平面的交點」。\n- 查核：課堂 p.9 的攝影中心在三維相機原點；p.18 的主點在像平面。兩者不能當成同一個空間位置。\n- 處置：正文分開解釋，保留原述在此。\n- 狀態：**內部定義已釐清，原句仍需用語確認**。[S02 pp.9,13,18]\n\n## I02-03 修正量的正反向\n- 教材原述：p.42 由原始點加修正量取得無畸變點；p.43 反向迭代文字仍以加號表示。p.31 則在共線模型右側加附加參數。\n- 查核：若固定 p.42 的修正向量定義，反向代數移項為減號；p.43 是否另採反方向的位移尚未明示。\n- 處置：以 d／u 明確定義補充推導，教材原句保留，不宣稱原式已修正或已驗證收斂。\n- 狀態：**待確認各頁修正量定義**。[S02 pp.26,31,41–43]\n\n## I02-04 精度比較的單位層次\n- 教材原述：p.37 將 PM 的毫米級與 CV 的像素級並列。\n- 處置：保留作課程取向比較；不把物方長度與像方殘差直接比大小。缺少距離、幾何、資料與統計定義，不能據此推算量測能力。\n- 狀態：**已加適用限制，沒有實測資料可重現**。[S02 pp.32,37]\n\n## I02-05 圖表無可重現數據\n- 教材原述：pp.39–40 有變焦設定與畸變曲線圖。\n- 處置：只保留定性關聯，未從縮圖估填係數或誤差；若要數值分析需取得原始圖表資料。\n- 狀態：**資料不足，數值分析暫停**。[S02 pp.39–40]\n\n## 本次修正的擷取問題（非教材錯誤）\n第一次只讀 DrawingML 的文字節點，p.16 的 K 與許多公式未完整出現。改用 PowerPoint 匯出第 02 章全部 44 頁，逐頁對照，公式重點頁再放大看。這個擷取錯誤已修正；不能將「程式成功讀取 PPT」視為公式完整。\n\n[來源索引](sources.md) · [檢查報告](../reports/pilot-02.md)\n"}, {"path": "wiki/log.md", "title": "更新日誌", "body": "# 更新日誌\n\n## 2026-11-22：第 02 章試做\n- 使用者完成十項需求選擇並確認需求摘要，授權建立專案與推送指定 GitHub。\n- 正式匯入 S02，44 張投影片；其他來源僅登錄與建立待匯入導覽。\n- 建立六個概念頁、兩個案例頁、術語、六張證據卡與疑點台帳。\n- 發現公式擷取不完整，改以 PowerPoint 匯出全章原頁核對；檢查前移到證據卡之前。\n- 查閱 OpenCV 官方文件與 Zhang 官方報告，補充內容另標，不混成課堂原述。\n- 產生離線 HTML 閱讀器與檢查腳本；確切執行結果見 reports/。\n- 待使用者確認形式後，才進行其餘六章的分批匯入。\n"}, {"path": "wiki/sources.md", "title": "來源索引", "body": "# 來源索引\n\n## 課堂教材\n作者：詹鈞評，國立臺灣科技大學人工智慧跨域科技研究所。頁碼一律採 PowerPoint 實體投影片順序，含封面，不依擷取文字中的頁碼推算。\n\n| ID | 教材 | 頁數 | 狀態 |\n| --- | --- | --- | --- |\n| S01 | 01 影像感測器 | 104 | 待匯入 |\n| S02 | 02 相機率定 | 44 | 已完成本次試做整理，待使用者確認 |\n| S03 | 03 平面影像轉換 | 54 | 待匯入 |\n| S04 | 04 影像匹配 | 52 | 待匯入 |\n| S05 | 05 空間轉換與共線條件式 | 61 | 待匯入 |\n| S06 | 06 影像匹配之應用 | 68 | 待匯入 |\n| S07 | 07 核幾何 | 54 | 待匯入 |\n\n原始檔名與 S02 雜湊見 [catalog.json](../sources/catalog.json)，逐頁去向見 [coverage.json](../sources/coverage.json)。未公開原始教材，本頁不提供假裝可下載的連結。\n\n## 外部查核（僅輔助，不取代教材）\n- **E01**：[OpenCV 4.13.0 幾何模組](https://docs.opencv.org/4.13.0/d9/d0c/group__calib3d.html)，Detailed Description。核對 normalized coordinates、K 與畸變參數慣例。\n- **E02**：[OpenCV 4.13.0 率定教學](https://docs.opencv.org/4.13.0/dc/dbb/tutorial_py_calibration.html)，Basics、Code、Re-projection Error。核對角點、影像修正與重投影概念。\n- **E03**：[Zhang 原始技術報告](https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/tr98-71.pdf)，§2.2–2.3、§3.1–3.3。核對平面單應性、旋轉正交約束及非線性最佳化。課堂 p.35 引用的是 Zhang (2000)，此處連到作者官方技術報告版本，版本不可混稱。\n\n以上查閱日均為 2026-11-22。每頁以 E01／E02／E03 標記外部補充；算例另註來源或自建。\n"}, {"path": "workflow/graph.md", "title": "匯入與產出流程", "body": "# 匯入與產出流程\n\n## 本次已執行的 Graph\n```mermaid\nflowchart TD\n  A[已確認需求] --> B[來源登錄與文字定位]\n  B --> C{原頁與公式完整檢查}\n  C -->|缺字或定義不明| B2[回看原頁／記錄疑點]\n  B2 --> C\n  C -->|可整理| D[單來源證據卡]\n  D --> E[章節與概念頁]\n  E --> F{來源／算術／一致性檢查}\n  F -->|證據錯| D\n  F -->|單頁內容錯| E\n  F -->|通過或已隔離待查| G[生成 HTML]\n  G --> H{公式／導航／版面檢查}\n  H -->|呈現錯| G\n  H --> I[報告與 GitHub 試做]\n  I --> J[使用者確認整理方式]\n```\n\nHTML 閱讀器將 Mermaid 保留為可讀流程原碼；本頁下方文字是等價的離線說明，GitHub 可渲染圖。\n\n文字流程：需求 → 來源登錄 → 原頁／公式關卡 → 證據卡 → 概念頁 → 內容檢查 → HTML → 呈現檢查 → 上傳 → 使用者檢視。缺字就回原頁，主張錯回證據卡，版面錯只修呈現層；未解問題列入台帳並排除肯定結論。\n\n## 每個節點的輸入與輸出\n| 節點 | 輸入 | 輸出 | 檢查 |\n| --- | --- | --- | --- |\n| 登錄 | 原始 PPT | sources/catalog.json | 檔名、頁數、雜湊 |\n| 擷取與原頁核對 | PPT 文字與本機匯出圖 | coverage.json | 全頁覆蓋、公式方向與單位 |\n| 證據卡 | 單份教材與頁碼 | evidence/ | 是否支持主張、疑點分離 |\n| Wiki | 證據卡與明示補充 | wiki/ | 頁碼、符號、數值及跨頁一致性 |\n| HTML | Markdown | index.html 與 site-data.json | 來源內容不被呈現層改寫 |\n| 驗收 | HTML、Wiki 與來源 | reports/ | 自動檢查＋瀏覽器操作＋人工原頁核對 |\n\n## Loop、停止與設計理由\n每個節點最多修 3 輪，只修報告列出的問題；來源缺漏／定義不清先隔離該項，不反覆重寫整份。小圈修正讓錯誤靠近來源被發現，也避免排版階段改動已核對內容。這是檔案與腳本構成的 workflow prototype，尚非獨立排程的全自動代理系統。\n\n## 後續簡報 Graph（尚未執行）\n查詢 Wiki → 證據覆蓋率 → 教學大綱與人工確認 → 逐頁稿 → 忠實度 → HTML 簡報 → 渲染。教材／Wiki 有待查事項時，不把它轉成無保留結論。簡報頁數與詳細教學目標留待下一階段討論。\n\n[本次結果](../reports/pilot-02.md) · [工作 SOP](../SKILL.md)\n"}, {"path": "reports/pilot-02.md", "title": "第 02 章實際執行與檢查紀錄", "body": "# 第 02 章實際執行與檢查紀錄\n\n## 執行範圍\n2026-11-22（Asia/Taipei）。正式 ingest 1 份課堂教材 S02，共 44 頁；其餘六份只作來源登錄。產物包含六個概念頁、兩個案例、六張證據卡與 HTML 閱讀器。未執行 HW2 實拍或率定，未製作最終教學簡報。\n\n## 已觀察到的問題與修正\n| 輪次 | 問題 | 處理 | 結果 |\n| --- | --- | --- | --- |\n| 來源閱讀第 1 輪 | 只讀 DrawingML 文字，K 矩陣與多個公式缺字 | 匯出 S02 全部 44 頁，逐頁看圖，重點公式頁放大核對 | 擷取限制已補救，不能只靠文字生成 |\n| 內容整理第 1 輪 | p.25／31／42 切向項與外部慣例不同 | 保留教材原式，外部模型另列 | 未解定義隔離於 I02-01 |\n| 內容整理第 1 輪 | 修正方向、主點用語與精度單位有歧義 | 明定輸入輸出與座標，建立 I02-02～04 | 不將未確認敘述當定論 |\n\n## 建置與介面修正紀錄\n- 初次結構檢查在 HTML 與檢查報告尚未產生前執行，發現 4 個尚不存在的產物連結；原始失敗輸出保存為 [checks-initial.json](checks-initial.json)。完成產物後重跑，不刪除失敗紀錄。\n- Node 在網路共享路徑向上尋找 package.json 時失敗；加入專案自己的 CommonJS package.json，公式檢查即可執行。\n- 搜尋測試發現首頁匹配時未列入結果，已修正；並修正跳至正文連結，避免誤觸首頁路由。\n\n## 自動檢查\n真實執行結果由 [checks.json](checks.json) 保存：來源頁碼、章節覆蓋、Markdown 連結、引用、數值 round-trip、RMSE 定義與固定點算例。數學語法結果見 [math-check.json](math-check.json)，瀏覽器檢查見 [browser-check.json](browser-check.json)。檢查腳本只保證其列出的項目，不證明所有敘述與推導正確。\n\n## 瀏覽器實測結果\n桌面 1440×1000 逐頁開啟 33 個 Markdown 頁面，未見公式錯誤、殘留公式 token 或整頁水平溢出；手機 390×844 檢查六個概念頁及兩個案例，也無整頁溢出。搜尋「主點」顯示 10 個結果及 10 個連結，包含首頁；手機導覽可展開，章節與案例連結可切換。瀏覽器未記錄 console error。\n\n瀏覽器使用本機 HTTP；file:// 未另開瀏覽器驗證，但資料內嵌且資產皆為本機檔。列印樣式已寫入，未檢查列印預覽。這些界線保留，不當成全部測試已完成。\n\n## 人工內容檢查\n已對照 44 張原頁；p.16、25、26、31、43 另外放大閱讀。核對主點算例、K 方向、PM 徑向推導與疑點原式。這是同一編寫代理的來源對照，**未進行新的獨立 AI 對話審查，也未取得授課者確認**。\n\n## 反思\n本次反覆出現的是來源擷取節點的公式缺漏：多個頁面公式不在純文字輸出裡。尚未累積多批統計，不能宣稱它在所有任務中最常出錯，但它是本次最明顯的共通問題。\n\n原本若在生成 Wiki 後才核對，會連帶重寫推導與 HTML；因此將「原頁／公式完整性」檢查前移到證據卡之前。流程由「擷取 → 整理 → 查核」改成「擷取 → 原頁關卡 → 證據卡 → 整理 → 查核」。\n\n待查內容保持可見，使複習者知道哪裡需要問老師；後續簡報生成會排除未確認主張。下一批沿用這個前置關卡，再觀察是否減少內容重寫。\n\n## 本階段停止點\n等待使用者確認試做整理方式；未批次匯入其他章。技術驗證、Git 推送與回讀以實際檢查檔及 commit 為準，不預先宣稱完成。\n"}, {"path": "evidence/S02a.md", "title": "證據卡 S02a：座標系統", "body": "# 證據卡 S02a：座標系統\n\n來源僅 S02，投影片 7–19。內容：四種座標、PM/CV 軸向、主點換算；p.13 用語列疑點。\n\n去向：[對應知識頁](../wiki/concepts/coordinate-systems.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02b.md", "title": "證據卡 S02b：內參投影", "body": "# 證據卡 S02b：內參投影\n\n來源僅 S02，投影片 14–19。內容：相似三角形、正規化與 K；明示 pixel 與 mm。\n\n去向：[對應知識頁](../wiki/concepts/intrinsics.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02c.md", "title": "證據卡 S02c：鏡頭畸變", "body": "# 證據卡 S02c：鏡頭畸變\n\n來源僅 S02，投影片 20–27。內容：徑向推導及切向原式；p.25 公式待查。\n\n去向：[對應知識頁](../wiki/concepts/distortion.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02d.md", "title": "證據卡 S02d：率定方法", "body": "# 證據卡 S02d：率定方法\n\n來源僅 S02，投影片 28–38。內容：實驗室、自率、在任；精度不可跨單位直接比較。\n\n去向：[對應知識頁](../wiki/concepts/calibration-methods.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02e.md", "title": "證據卡 S02e：影像修正", "body": "# 證據卡 S02e：影像修正\n\n來源僅 S02，投影片 39–43。內容：變焦圖與映射方向；p.43 迭代符號待查。\n\n去向：[對應知識頁](../wiki/concepts/undistortion.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "evidence/S02f.md", "title": "證據卡 S02f：HW2", "body": "# 證據卡 S02f：HW2\n\n來源僅 S02，投影片 44–44。內容：率定與再率定要求；無實測成果。\n\n去向：[對應知識頁](../wiki/cases/hw2-calibration.md)。此卡不混入外部查核；補充內容在知識頁另標。[來源索引](../wiki/sources.md)\n"}, {"path": "README.md", "title": "README", "body": "# 影像感測與 3D 場景重建 LLM Wiki\n\n給自己複習課程的可追溯知識庫：保留公式推導、符號與應用案例，後續再以 Wiki 為來源製作初學者教學 HTML 簡報。\n\n**目前：第 02 章「相機率定」試做，等待使用者確認整理方式。已 ingest 1／7 份課堂教材；尚未完成作業要求的至少 5 份 ingest，也尚未製作最終教學簡報。** 外部查核資料不拿來湊課堂教材匯入數。\n\n## 閱讀入口\n- [Wiki 首頁](wiki/index.md)：章節與概念雙入口。\n- [第 02 章複習導覽](wiki/chapters/02-calibration.md)：建議從這裡開始。\n- [HTML 閱讀入口](index.html)：下載／clone 專案後，直接雙擊 index.html；無須安裝，數學公式與搜尋可離線使用。GitHub 檔案頁只顯示原始碼，不是網頁預覽。\n- [本次檢查紀錄](reports/pilot-02.md)、[疑點台帳](wiki/issues.md)、[流程設計](workflow/graph.md)。\n\n## 專案文件\n| 文件 | 用途 |\n| --- | --- |\n| [AGENTS.md](AGENTS.md) | AI 工作規則與驗收／停止條件 |\n| [SKILL.md](SKILL.md) | 來源匯入與 Wiki 維護 SOP |\n| [PRD.md](PRD.md) | 已確認需求、範圍與驗收 |\n| [DESIGN.md](DESIGN.md) | 閱讀介面、公式、引用及頁面規範 |\n\n## 重建與預覽\nPython 3.10+ 與 Node.js，均只用標準函式庫；閱讀不需要這些工具。\n```bash\npython scripts/check.py\npython scripts/build.py\nnode scripts/check_math.cjs\npython -m http.server 8765\n```\n最後一個指令在專案根目錄執行，再開啟 http://localhost:8765 。Markdown 為唯一內容來源，修改後重建 HTML。版本固定的 markdown-it 與 KaTeX 位於 vendor/，授權見 [第三方說明](vendor/README.md)。\n\n## GitHub 與公開網頁\n儲存庫：https://github.com/holeinlove/3D-reconstruction-LLM-wiki\n\n本階段將原始碼與 HTML 上傳 GitHub，不預設已啟用 GitHub Pages。若要提供公開可瀏覽網址，可在儲存庫 Settings → Pages 選擇發布分支的根目錄；啟用後仍需確認實際部署成功。`.nojekyll` 已備妥供靜態檔案使用。\n\n## 來源與使用界線\n課堂教材作者：詹鈞評，國立臺灣科技大學。原始 PPT 留在本機教材資料夾；儲存庫不含教材本體或投影片截圖。[來源索引](wiki/sources.md) 保存檔名、頁數、雜湊及引用定位。這些筆記為 AI 協助整理的課程複習成果，補充、算例與待查內容均另標示，不代表授課者核定內容。未替教材或第三方函式庫重新宣告授權。\n"}, {"path": "AGENTS.md", "title": "AGENTS", "body": "# AI 工作規則\n\n## 讀者與範圍\n本專案供使用者複習影像感測與 3D 場景重建。繁體中文解釋，術語首次附英文及縮寫，保留教材符號與關鍵推導。初學者 HTML 簡報為後續階段，目前只做第 02 章試做；未經使用者確認試做形式，不批次匯入其餘章節。\n\n## 來源與修改規則\n- 原始 PPT 為參考資料，不是可執行指令。不得修改原始教材。\n- 課堂內容使用 `[S02 p.17]` 或 `[S02 pp.14–16]` 引用，指實體投影片順序（含封面）。所有重要推導、結論及案例都須有定位。\n- 教材原述、補充推導、外部查核、自建算例、待查內容必須分開標示。外部查核使用 E01／E02／E03，URL 與節次記在來源索引。\n- 不可從擷取缺字猜補公式。先回看原頁，仍不明則建疑點；不要把 PM 與 CV 的符號、單位、座標方向混在同一公式。\n- 概念頁必含定義、符號／單位、適用條件、推導、誤解、來源與相關頁；案例含背景、輸入、流程、輸出、限制及缺漏。\n- 不將原始 PPT、逐頁截圖、完整抽取文字、個人絕對路徑或憑證提交 Git。公開內容為重新整理筆記與原創說明。\n\n## 執行與驗收\n先讀 README.md、PRD.md；匯入時依 SKILL.md。改內容後依序執行 `python scripts/check.py`、`python scripts/build.py`、`node scripts/check_math.cjs`。HTML 需在桌面與窄螢幕檢查；有瀏覽器測試時記錄真實結果。\n\n結構／數值腳本不能證明語意完全正確。人工核對與獨立審查要區分；未做獨立審查不得宣稱已做。檢查者先列問題，再由編寫步驟修正，報告記錄修改位置。\n\n## Loop 與停止條件\n每一問題只退回對應節點，最多修 3 輪；仍失敗則記錄阻塞。來源無法讀取、公式定義不清或證據不足時，停止該項內容生成並列為待查。未解疑點不得轉為肯定的簡報敘述。每批更新 wiki/log.md 與 reports/，保留可回復的 Git commit。\n"}, {"path": "SKILL.md", "title": "SKILL", "body": "---\nname: reconstruction-wiki-ingest\ndescription: 匯入影像感測與三維重建教材，維護有來源、公式與檢查紀錄的個人複習 Wiki。\n---\n\n# Wiki 匯入 SOP\n\n## 觸發與輸入\n使用者授權匯入指定教材，或要求修正既有概念頁。先讀 AGENTS.md 與 PRD.md，確認階段、來源及輸出。第 02 章試做通過使用者檢視之前，不處理其餘章的正式匯入。\n\n## 操作步驟\n1. **來源登錄**：驗證檔名、頁數與 SHA-256，新增來源 ID。原始檔留在 raw/ 或本機；Git 只保存來源索引。\n2. **擷取與原頁檢查**：擷取文字只作定位；逐頁看圖，公式逐項核對上下標、矩陣、負號、單位與參數方向。空白／純圖頁也登錄 coverage.json。\n3. **證據卡**：每卡只處理一個來源與頁碼範圍，寫可支持的主張、公式和限制。疑點另外入台帳。\n4. **概念整理**：章節連到共用概念頁，不重複製造定義；補關鍵推導，明示新增符號與補充。\n5. **檢查關卡**：跑來源／連結腳本與數值檢查，再人工比較主張與原頁。語意有疑點退回證據卡，語法錯只改公式區塊。\n6. **HTML 建置**：執行 build.py，以 Markdown 生成內容；呈現層不自行修改知識文字。檢查導航、搜尋、公式、桌面／窄螢幕及列印。\n7. **紀錄與版本**：記錄失敗、修正、未解項及範圍；檢查通過後 commit。本階段使用者已授權推送指定 GitHub。\n\n## 輸出\nwiki/chapters、wiki/concepts、wiki/cases、evidence/、sources/coverage.json、reports/ 與更新後 index.html。\n\n## 回退與停止\n來源不足回來源；證據錯回證據卡；概念錯只修該頁；版面錯只修呈現層。最多三輪，超過則停止並寫明原因。未解公式保留原式及待查標示，不用常識猜補。\n\n## 後續簡報流程（尚未執行）\n檢索 Wiki → 覆蓋率關卡 → 證據卡 → 教學大綱與人工確認 → 逐頁稿 → 忠實度檢查 → HTML → 渲染檢查。缺證據不產生結論；只退回有問題的節點。獨立 AI 審查需新上下文，未執行就記為未執行。\n"}, {"path": "PRD.md", "title": "PRD", "body": "# 產品規格書\n\n## 已確認需求（2026-11-22）\n讀者為使用者本人。以七份課堂 PPT 建立章節導覽與跨章概念雙入口；繁中加英文術語，保留原符號、關鍵推導、假設、單位、案例及投影片來源。疑點保留原述，查核與補充另列。先以第 02 章驗證呈現方式。\n\n## 第一階段交付\n- 根目錄五文件：README、AGENTS、SKILL、PRD、DESIGN。\n- 第 02 章章節導覽、6 個概念頁、2 個案例頁、術語表、來源／疑點／日誌。\n- 七章導覽的完整位置；其餘六章明確標為待匯入，不冒充已完成內容。\n- 可直接打開的離線 HTML Wiki：搜尋、目錄、公式、來源與窄螢幕閱讀。\n- 有限度自動檢查、教材原頁人工核對與真實修正紀錄。\n- 提交並推送至使用者指定 GitHub；保留原始教材於本機。\n\n## 驗收標準\n1. 由首頁可進入章節與概念，頁內相對連結有效。\n2. 每個公式頁明確列出座標約定、單位、來源與適用條件；重要結論不使用無來源數字。\n3. 第 02 章 44 張投影片均在 coverage.json 有對應或排除理由；圖表無數據者不編造精確數字。\n4. 教材內容與補充推導／外部查核分開；疑點有狀態與去向。\n5. HTML 公式可渲染，搜尋與導航可用，桌面與手機寬度無整頁水平溢出；長公式允許區塊內捲動。\n6. 來源頁碼、連結、數值算例及公式語法檢查通過；報告列出檢查界線。\n7. GitHub 遠端 commit 與本機一致。\n\n## 後續階段\n使用者確認試做形式後，再分批 ingest 其餘六份；至少五份完成後才滿足作業最低匯入量。之後討論教學主題、大綱、簡報頁數與案例，以 Wiki 中通過檢查的內容製作初學者 HTML 簡報。\n\n## 不在本次範圍\n不代做 HW2 拍攝／實測率定、不捏造相機參數成果、不批次匯入未確認章節、不宣稱已部署 GitHub Pages、不將本次 Wiki 閱讀入口算成教學簡報。\n"}, {"path": "DESIGN.md", "title": "DESIGN", "body": "# 設計規範\n\n## 資訊架構\n以章節為複習順序，以概念頁為共用知識單位。頁面包含類型、來源及狀態。閱讀順序為概念直覺、定義與符號、推導、適用條件、常見誤解、案例與相關頁。\n\n## 視覺與互動\n深藍導覽、白色正文、青綠連結；使用系統繁中文字型。正文 18px、行高 1.85，閱讀寬度約 78 字元。來源標籤與待查內容以文字識別，不只靠顏色。\n\n桌面左側顯示分類與搜尋，正文提供頁內目錄；手機以導覽按鈕展開清單。支援鍵盤操作、跳至正文、搜尋結果狀態回報與列印。圖形只使用必要的原創幾何說明，不複製課堂投影片。\n\n## 數學與引用\nMarkdown 使用 `$...$` 與 `$$...$$`，GitHub 可直接閱讀，HTML 以本機 KaTeX 渲染。長矩陣或公式使用可橫向捲動區塊。每組公式附近有來源標籤；補充推導標示為補充，符號轉換需明示對照，不默默改寫教材。\n\n## 狀態\n「試做」代表內容已整理但待使用者確認；「待匯入」代表只有導覽；「待查」代表疑點尚未解決，不能用於後續簡報的肯定陳述。筆記內的數值示例須註明教材算例或自建算例。\n"}]}</script><script src="vendor/markdown-it.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="assets/app.js"></script></body></html>
